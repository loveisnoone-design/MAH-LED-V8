<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAH LED">
<title>MAH LED · v9</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#0b0f14; --line:#272e3a; --fg:#e6edf3; --dim:#8b96a5;
    --ok:#1fb31f; --out:#3987e5; --rep:#e0a53a; --bad:#e05252; --acc:#9085e9;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-block:0 calc(84px + var(--safe-b));-webkit-text-size-adjust:100%}
  h2{font-size:12px;margin:0 0 8px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.9px}
  header{position:sticky;top:0;z-index:6;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
  .brand{font-size:14px;font-weight:700;letter-spacing:.3px}
  .brand small{display:block;font-size:10px;color:var(--dim);font-weight:500;letter-spacing:.6px;text-transform:uppercase}
  main{max-width:620px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{justify-content:space-between}
  .grow{flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.wait{background:var(--rep)}
  .muted{color:var(--dim)} .sm{font-size:13px} .xs{font-size:11px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  button{font:inherit;font-weight:600;color:var(--fg);background:#21262d;border:1px solid var(--line);
         border-radius:11px;padding:12px 14px;min-height:46px;cursor:pointer}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#0d1117}
  button.ghost{background:transparent}
  button.wide{width:100%;justify-content:center}
  button:disabled{opacity:.45}
  input,select,textarea{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);
               border-radius:11px;padding:12px;min-height:46px;width:100%}
  textarea{min-height:70px}
  label{display:block;font-size:11px;color:var(--dim);margin:0 0 4px;text-transform:uppercase;letter-spacing:.6px}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .tile b{display:block;font-size:24px;font-weight:650;line-height:1.15}
  .tile span{font-size:11px;color:var(--dim)}
  .tile.flash{animation:fl 1s ease-out}
  @keyframes fl{0%{border-color:var(--acc);background:#1d1b33}100%{border-color:var(--line);background:var(--card2)}}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:9px;font-size:14px;padding:8px 6px}
  .seg button[aria-pressed="true"]{background:var(--acc);color:#0d1117}
  .seg.small button{min-height:38px;font-size:13px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--bg);
      border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  nav button{flex:1;background:transparent;border:0;color:var(--dim);font-size:11px;font-weight:600;
             display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:6px 2px}
  nav button[aria-pressed="true"]{color:var(--fg)}
  nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
  .cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .frame{position:absolute;inset:14% 12%;border:2px solid rgba(255,255,255,.75);border-radius:14px;
              box-shadow:0 0 0 100vmax rgba(0,0,0,.28)}
  .cam .off{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center;padding:20px}
  .res{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--card2);margin-top:10px}
  .res.ok{border-color:var(--ok);background:#0f2a12}
  .res.bad{border-color:var(--bad);background:#2c1414}
  .res.dup{border-color:var(--rep);background:#2a2410}
  .res b{display:block;font-size:16px;margin-bottom:2px}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
  ul.list li:first-child{border-top:0}
  .tag{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;text-transform:uppercase;letter-spacing:.4px}
  .t-ok{background:#0f2a12;color:var(--ok)} .t-bad{background:#2c1414;color:var(--bad)}
  .t-dup{background:#2a2410;color:var(--rep)} .t-q{background:#121d2c;color:var(--out)}
  .pill{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .job{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .job b{font-size:15px} .job .meta{font-size:12px;color:var(--dim);margin-top:3px}
  .bar{height:6px;border-radius:99px;background:#1d232c;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + var(--safe-b));z-index:9;
         background:#21262d;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:13px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .sheet{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);display:grid;align-items:end}
  .sheet .inner{background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b));max-height:86vh;overflow:auto}
  @media(min-width:620px){.sheet{align-items:center;justify-items:center}.sheet .inner{border-radius:16px;max-width:560px;width:100%}}
  .stack>*+*{margin-top:10px}
  [hidden]{display:none!important}
  /* print: the work-order summary */
  #print{display:none}
  @media print{
    body{background:#fff;color:#000;padding:0}
    header,nav,main,.toast,.sheet{display:none!important}
    #print{display:block;padding:14mm;font:11px/1.5 -apple-system,system-ui,sans-serif;color:#000}
    #print h1{font-size:18px;margin:0 0 2px} #print h2{color:#444;font-size:10px;margin:14px 0 5px}
    #print table{width:100%;border-collapse:collapse;font-size:10.5px}
    #print th{text-align:left;border-bottom:1.2px solid #000;padding:4px 3px;font-size:9px;text-transform:uppercase;letter-spacing:.4px}
    #print td{border-bottom:.5px solid #ccc;padding:4px 3px;vertical-align:top}
    #print .sub{color:#555;font-size:10px}
    #print .sign{margin-top:22px;display:flex;gap:24px}
    #print .sign div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:10px;color:#444}
  }
</style>
</head>
<body>

<header>
  <div class="brand">MAH LED <small>v9 · live</small></div>
  <div class="row sm">
    <span class="dot" id="dLive"></span><span class="muted xs" id="who">—</span>
    <button class="ghost xs" id="bOut" style="min-height:34px;padding:6px 10px">Sign out</button>
  </div>
</header>

<main>
  <section class="card" id="boot"><div class="row"><span class="dot wait"></span><span class="sm">Loading…</span></div></section>

  <section id="login" hidden>
    <div class="card stack">
      <h2>Sign in</h2>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" inputmode="email"></div>
      <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="primary wide" id="bIn">Sign in</button>
      <p class="xs muted" id="msg">Ask Mah for your login.</p>
    </div>
  </section>

  <!-- TODAY -->
  <section id="pgToday" hidden>
    <div class="card">
      <h2>Stock right now</h2>
      <div class="grid4">
        <div class="tile" id="tOut"><b>–</b><span>out</span></div>
        <div class="tile" id="tIn"><b>–</b><span>in stock</span></div>
        <div class="tile" id="tRep"><b>–</b><span>repair</span></div>
        <div class="tile" id="tRem"><b>–</b><span>reminders</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Jobs running now</h2>
      <div id="todayJobs"><p class="sm muted">No job is out at the moment.</p></div>
    </div>
    <div class="card">
      <h2>Latest activity</h2>
      <ul class="list" id="feed"></ul>
    </div>
  </section>

  <!-- SCAN -->
  <section id="pgScan" hidden>
    <div class="card stack">
      <div class="seg" role="group" aria-label="What are you doing">
        <button type="button" data-mode="out" aria-pressed="true">Scan out</button>
        <button type="button" data-mode="in" aria-pressed="false">Scan in</button>
        <button type="button" data-mode="check" aria-pressed="false">Check</button>
      </div>
      <div id="scanJob"></div>
      <div id="scanCond" hidden>
        <label>Condition coming back</label>
        <div class="seg small" role="group" aria-label="Condition">
          <button type="button" data-cond="in_stock" aria-pressed="true">Good</button>
          <button type="button" data-cond="repair" aria-pressed="false">Repair</button>
          <button type="button" data-cond="lost" aria-pressed="false">Lost</button>
        </div>
        <input id="retNote" placeholder="Note — what is wrong (optional)" style="margin-top:8px">
      </div>
      <div class="cam" id="cam">
        <video id="vid" playsinline muted></video>
        <div class="frame" id="frame" hidden></div>
        <div class="off" id="camOff">Camera is off<br><span class="xs">Tap “Start camera”. Allow the camera when the phone asks.</span></div>
      </div>
      <div class="row">
        <button class="primary grow" id="bCam">Start camera</button>
        <button class="ghost" id="bTorchless" hidden></button>
      </div>
      <div class="row">
        <input id="manual" class="grow" placeholder="Or type a serial / FC number" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
        <button id="bGo">Enter</button>
      </div>
      <div id="res"></div>
    </div>
    <div class="card">
      <div class="row sp"><h2 style="margin:0">This session <span id="sessN" class="pill">0</span></h2>
        <button class="ghost sm" id="bClear" style="min-height:34px;padding:6px 10px">Clear</button></div>
      <ul class="list" id="sess"></ul>
    </div>
  </section>

  <!-- JOBS -->
  <section id="pgJobs" hidden>
    <div class="card stack">
      <div class="row sp"><h2 style="margin:0">Work orders</h2><button class="primary" id="bNew">New job</button></div>
      <div id="jobList"></div>
    </div>
  </section>
</main>

<nav>
  <button type="button" data-tab="today" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-4H4z"/></svg>Today</button>
  <button type="button" data-tab="scan" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/></svg>Scan</button>
  <button type="button" data-tab="jobs" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM9 7V4h6v3M9 12h6M9 16h6"/></svg>Jobs</button>
</nav>

<div id="sheetHost"></div>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
(function(){
'use strict';
/* ═══ MAH LED v9 — crew phone app ═══
   Scan out · scan in with condition · open and close work orders · status and
   condition · live dashboard · work-order summary to print or share.
   Everything else (moving cabinets, fitting modules, editing master data) is on
   the website. Every action goes to the database through a function; when the
   phone is offline the actions wait in a queue and are sent once. */

const SB_URL='https://jeafknkwmaktgheyqbuq.supabase.co';
const SB_KEY='sb_publishable_1u3NPs-jwPjcfFEyXCS--Q_m5MMn7xt';  // safe in a browser
const QK='mah_v9_queue', SK='mah_v9', DK='mah_v9_dev';

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST_L={in_stock:'In stock',out:'Out',repair:'Repair',lost:'Lost',installed:'Installed',retired:'Retired'};
const KIND_L={cabinet:'Cabinet',module:'Module',pdu:'PDU',hanging_bar:'Hanging bar',processor:'Processor',
  recv_card:'Receiving card',hub:'HUB',psu:'PSU',frame:'Frame',reset_wheel:'Reset wheel',other:'Item'};
const load=(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const save=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const uuid=()=> (window.crypto&&crypto.randomUUID)?crypto.randomUUID()
  :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
const clock=t=>new Date(t||Date.now()).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dayTxt=d=>{ if(!d) return '—'; const [y,m,dd]=String(d).slice(0,10).split('-').map(Number);
  return dd+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]; };
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
const daysTo=d=>{ if(!d) return null; return Math.round((Date.parse(d+'T00:00:00+07:00')-Date.parse(today()+'T00:00:00+07:00'))/86400000); };

const SB=(window.supabase&&window.supabase.createClient)
  ? window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;

let ME=null, ROLE='none', LIVE=false, TAB=load(SK+'-tab','today');
let MODE=load(SK+'-mode','out'), COND='in_stock', JOB=load(SK+'-job',null);
let JOBS=[], SESS=[], COUNTS={out:0,in_stock:0,repair:0,rem:0}, FEED=[];
let queue=load(QK,[]), offline=false, sending=false;

/* ── talking to the database ─────────────────────────────── */
function isOff(){ return offline || navigator.onLine===false; }

async function rpc(fn,args){
  const {data,error}=await SB.rpc(fn,args);
  if(error) throw new Error(error.message);
  return data;
}
/* an action: sent now, or queued with its own id so a re-send counts once */
async function act(fn,args,label){
  const job={fn,args:Object.assign({p_client_id:'v9-'+uuid().slice(0,12)},args),label,at:Date.now()};
  if(isOff()){ queue.push(job); save(QK,queue); paintQueue(); return {queued:true,msg:label+' — waiting for signal'}; }
  try{
    const d=await rpc(job.fn,job.args)||{};
    return d;
  }catch(e){
    queue.push(job); save(QK,queue); paintQueue();
    return {queued:true,msg:'No answer — saved on the phone ('+e.message+')'};
  }
}
async function flush(){
  if(sending||isOff()||!queue.length) return;
  sending=true;
  while(queue.length && !isOff()){
    const job=queue[0];
    try{ const d=await rpc(job.fn,job.args)||{};
      pushSess({ok:d.ok!==false,dup:!!d.dup,text:(job.label||job.fn)+(d.msg?' — '+d.msg:''),sent:true});
      queue.shift(); save(QK,queue); paintQueue();
    }catch(e){ break; }
  }
  sending=false; refreshCounts();
}

/* ── screens ─────────────────────────────────────────────── */
function setTab(t){
  TAB=t; save(SK+'-tab',t);
  $$('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===t));
  $('#pgToday').hidden=t!=='today'; $('#pgScan').hidden=t!=='scan'; $('#pgJobs').hidden=t!=='jobs';
  if(t!=='scan') stopScan();
  if(t==='today') refreshCounts();
  if(t==='jobs') renderJobs();
  if(t==='scan') renderScan();
  window.scrollTo(0,0);
}
let toastT=null;
function toast(m){
  let el=$('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; },3000);
}
function sheet(html){
  return new Promise(res=>{
    const host=$('#sheetHost');
    host.innerHTML='<div class="sheet"><div class="inner">'+html+'</div></div>';
    const close=v=>{ host.innerHTML=''; res(v); };
    host.querySelector('.sheet').addEventListener('click',e=>{ if(e.target===host.querySelector('.sheet')) close(null); });
    host.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));
    host.querySelector('.inner').dataset.open='1';
    host._close=close;
  });
}

/* ── dashboard ───────────────────────────────────────────── */
async function refreshCounts(){
  if(!SB||!ME) return;
  const cnt=(t,c,v)=>SB.from(t).select('id',{count:'exact',head:true}).eq(c,v);
  try{
    const [o,i,r,rem]=await Promise.all([
      cnt('assets','status','out'), cnt('assets','status','in_stock'), cnt('assets','status','repair'),
      SB.from('reminders').select('id',{count:'exact',head:true}).is('resolved_at',null)]);
    COUNTS={out:o.count||0,in_stock:i.count||0,repair:r.count||0,rem:rem.count||0};
    tile('tOut',COUNTS.out); tile('tIn',COUNTS.in_stock); tile('tRep',COUNTS.repair); tile('tRem',COUNTS.rem);
    $('#dLive').className='dot '+(LIVE?'on':'wait');
  }catch(e){ $('#dLive').className='dot off'; }
  await loadJobs();
  renderTodayJobs();
}
function tile(id,n){
  const el=$('#'+id), b=el.querySelector('b');
  if(b.textContent!==String(n)){ b.textContent=n; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
async function loadJobs(){
  const {data,error}=await SB.from('work_orders')
    .select('id,name,location,responsible,start_date,end_date,status,notes,created_at,completed_at')
    .order('created_at',{ascending:false}).limit(25);
  if(error) return;
  JOBS=data||[];
  if(JOB && !JOBS.some(w=>w.id===JOB)) JOB=null;
  if(!JOB){ const a=JOBS.find(w=>w.status==='active'); JOB=a?a.id:null; save(SK+'-job',JOB); }
  const ids=JOBS.filter(w=>w.status==='active').map(w=>w.id);
  if(ids.length){
    const {data:ls}=await SB.from('wo_lines').select('wo_id,returned_at').in('wo_id',ids);
    const m={}; (ls||[]).forEach(l=>{ const x=m[l.wo_id]||(m[l.wo_id]={n:0,back:0}); x.n++; if(l.returned_at) x.back++; });
    JOBS.forEach(w=>{ if(m[w.id]) Object.assign(w,m[w.id]); });
  }
}
function jobCard(w,go){
  const n=w.n||0, back=w.back||0, out=n-back, d=daysTo(w.end_date);
  const due=w.status!=='active' ? 'Closed '+dayTxt(w.completed_at)
    : d==null ? '' : d<0 ? '<b style="color:var(--bad)">overdue '+(-d)+' day'+(-d>1?'s':'')+'</b>'
    : d===0 ? '<b style="color:var(--rep)">back today</b>' : 'back in '+d+' day'+(d>1?'s':'');
  return `<button class="job" data-job="${esc(w.id)}" data-go="${go||''}" type="button">
    <div class="row sp"><b>${esc(w.name)}</b><span class="pill">${w.status==='active'?'active':'closed'}</span></div>
    <div class="meta">${esc(w.location||'')} · ${dayTxt(w.start_date)} – ${dayTxt(w.end_date)} ${due?'· '+due:''}</div>
    ${n?`<div class="meta">${out} still out · ${back} back of ${n}</div><div class="bar"><i style="width:${Math.round(back/n*100)}%"></i></div>`:''}
  </button>`;
}
function renderTodayJobs(){
  const act=JOBS.filter(w=>w.status==='active');
  $('#todayJobs').innerHTML=act.length?act.map(w=>jobCard(w,'job')).join(''):'<p class="sm muted">No job is out at the moment.</p>';
  bindJobs('#todayJobs');
}
function bindJobs(sel){
  $$(sel+' [data-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.job));
}
function feedRow(e){
  const li=document.createElement('li');
  li.innerHTML=`<span class="muted xs">${clock(e.at)}</span> <b>${esc(String(e.action||'').replace(/_/g,' '))}</b> <span class="mono">${esc(e.sn||e.fc_code||e.wo_id||'')}</span> <span class="muted xs">· ${esc(e.actor_name||'')}</span>`;
  const f=$('#feed'); f.insertBefore(li,f.firstChild); while(f.children.length>12) f.removeChild(f.lastChild);
}
async function loadFeed(){

function beep(ok){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=new C(), o=c.createOscillator(), g=c.createGain();
    o.frequency.value=ok?880:220; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.12,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(ok?.16:.32));
    o.start(); o.stop(c.currentTime+(ok?.17:.33)); setTimeout(()=>c.close(),600);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ok?40:[60,50,60]); }catch(e){}
}
function showRes(kind,title,detail){
  $('#res').innerHTML=`<div class="res ${kind}"><b>${esc(title)}</b><span class="sm">${detail||''}</span></div>`;
}
function pushSess(x){
  SESS.unshift(Object.assign({t:Date.now()},x)); SESS=SESS.slice(0,50);
  $('#sessN').textContent=SESS.length;
  $('#sess').innerHTML=SESS.map(s=>`<li class="row"><span class="tag ${s.queued?'t-q':s.dup?'t-dup':s.ok?'t-ok':'t-bad'}">${s.queued?'queued':s.dup?'again':s.ok?'ok':'no'}</span>
    <span class="grow">${esc(s.text)}</span><span class="muted xs">${clock(s.t)}</span></li>`).join('');
}
function paintQueue(){
  const n=queue.length;
  const b=$('#bCam');
  if(n) toastQueue(n);
  $('#dLive').className='dot '+(isOff()?'off':LIVE?'on':'wait');
  if(b) b.title=n?n+' waiting':'';

  if(box && n && !box.querySelector('.qn')) box.insertAdjacentHTML('beforeend',
    `<p class="qn sm" style="color:var(--out)">${n} scan${n>1?'s':''} waiting for signal — they go up by themselves.</p>`);
  if(box && !n){ const q=box.querySelector('.qn'); if(q) q.remove(); }
}
let qT=0;
function toastQueue(n){ if(Date.now()-qT>8000){ qT=Date.now(); } }

async function handleCode(code){
  code=String(code||'').trim(); if(!code) return;
  if(MODE==='check'){
    try{
      const d=await rpc('scan_lookup',{p_code:code})||{};
      if(d.type==='asset'){
        beep(true);
        showRes('ok',d.sn,`${KIND_L[d.kind]||d.kind} · ${ST_L[d.status]||d.status}${d.cond&&d.cond!=='good'?' · '+d.cond:''}${d.fc_code?' · FC '+parseInt(d.fc_code,10)+(d.fc_slot?' slot '+d.fc_slot:''):''}${d.parent_sn?' · in '+esc(d.parent_sn):''}${d.current_wo?' · on a job':''}`);
        pushSess({ok:true,text:d.sn+' · '+(ST_L[d.status]||d.status)});
        itemSheet(d);
      } else if(d.type==='fc'){
        beep(true);
        const cabs=d.cabinets||[];
        showRes('ok','FC '+parseInt(d.code,10),`${cabs.length} of ${d.capacity} slots filled · ${cabs.filter(c=>c.status==='out').length} out`);
        pushSess({ok:true,text:'FC '+parseInt(d.code,10)+' · '+cabs.length+'/'+d.capacity});
      } else if(d.type==='bulk'){
        beep(true); showRes('ok',d.name,`${d.available} of ${d.qty_total} available`);
        pushSess({ok:true,text:d.name});
      } else { beep(false); showRes('bad','Not in the database',esc(code)); pushSess({ok:false,text:code+' — unknown'}); }
    }catch(e){ beep(false); showRes('bad','Could not check',e.message); }
    return;
  }
  if(MODE==='out'){
    if(!JOB){ beep(false); showRes('bad','Pick a job first','Items always go out on a work order.'); return; }
    const r=await act('wo_checkout',{p_wo:JOB,p_code:code},'Out '+code);
    finish(r,code,'out');
    return;
  }
  const note=$('#retNote').value.trim();
  const r=await act('wo_return',{p_code:code,p_status:COND,p_cond:COND==='repair'?'damaged':null,p_note:note},'In '+code);
  finish(r,code,'in');
}
function finish(r,code,kind){
  if(r.queued){ beep(true); showRes('dup','Saved on the phone',esc(r.msg||'')); pushSess({queued:true,text:(kind==='out'?'Out ':'In ')+code}); return; }
  if(r.ok===false){ beep(false); showRes('bad','Not done',esc(r.msg||'')); pushSess({ok:false,text:esc(r.msg||code)}); return; }
  if(r.dup){ beep(true); showRes('dup','Counted already',esc(r.msg||'')); pushSess({dup:true,ok:true,text:(kind==='out'?'Out ':'In ')+code}); return; }
  beep(true);
  const msg=r.msg||((r.sn||code)+(kind==='out'?' is out':' is back'));
  showRes('ok',kind==='out'?'Out':'Back in stock',esc(msg));
  pushSess({ok:true,text:msg});
  refreshCounts();
}

      <button class="ghost wide" data-v="">Cancel</button>

}

/* ── camera (same reader as v8.9, which works on your phones) ── */
let _stream=null, _raf=null, scanOn=false;
function stopScan(){
  scanOn=false;
  if(_raf){ cancelAnimationFrame(_raf); _raf=null; }
  if(_stream){ _stream.getTracks().forEach(t=>t.stop()); _stream=null; }
  $('#frame').hidden=true; $('#camOff').hidden=false; $('#bCam').textContent='Start camera';
}
async function startScan(){
  if(scanOn){ stopScan(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast(window.isSecureContext?'This browser cannot open the camera — try Safari or Chrome':'The camera needs https — open the https:// link');
    return;
  }
  const v=$('#vid');
  try{
    let stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}); }
    catch(e1){ try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
      catch(e2){ stream=await navigator.mediaDevices.getUserMedia({video:true}); } }
    _stream=stream; v.srcObject=stream;
    v.setAttribute('playsinline',''); v.setAttribute('autoplay',''); v.muted=true;
    try{ await v.play(); }catch(e){}
    scanOn=true; $('#camOff').hidden=true; $('#frame').hidden=false; $('#bCam').textContent='Stop camera';
    if(!window.jsQR){ toast('The QR reader is still loading — one moment'); }
    const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
    let last='', lastT=0;
    const tick=()=>{
      if(!scanOn||!_stream) return;
      if(v.readyState===v.HAVE_ENOUGH_DATA && v.videoWidth>0 && window.jsQR){
        canvas.width=v.videoWidth; canvas.height=v.videoHeight;
        ctx.drawImage(v,0,0);
        try{
          const img=ctx.getImageData(0,0,canvas.width,canvas.height);
          const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
          if(code&&code.data){
            const now=Date.now();
            if(code.data!==last||(now-lastT)>2000){ last=code.data; lastT=now; handleCode(code.data); }
          }
        }catch(e){}
      }
      _raf=requestAnimationFrame(tick);
    };
    _raf=requestAnimationFrame(tick);
  }catch(err){
    const android=/android/i.test(navigator.userAgent);
    const where=android?'Chrome → site settings → Camera':'Settings → Safari → Camera';
    if(err.name==='NotAllowedError'||err.name==='PermissionDeniedError') toast('Allow the camera in '+where);
    else if(err.name==='NotFoundError') toast('No camera on this device');
    else if(err.name==='NotReadableError') toast('The camera is busy — close other apps using it');
    else toast('Camera: '+(err.message||err.name));
    stopScan();
  }
}

/* ── work-order summary: print / save as PDF / copy ──────── */
function summary(w,ls,how){
  const out=ls.filter(l=>!l.returned_at), back=ls.filter(l=>l.returned_at);
  const byFc={};
  ls.filter(l=>l.assets.kind==='cabinet').forEach(l=>{ const k=l.assets.fc_code||'—'; (byFc[k]=byFc[k]||{out:[],back:[]})[l.returned_at?'back':'out'].push(l.assets.sn); });
  const bars=ls.filter(l=>l.assets.kind==='hanging_bar');
  const procs=ls.filter(l=>l.assets.kind==='processor');
  const rep=back.filter(l=>l.return_status==='repair'), lost=back.filter(l=>l.return_status==='lost');
  if(how==='copy'){
    const t=[`${w.name} — ${w.location||''}`,
      `${dayTxt(w.start_date)} – ${dayTxt(w.end_date)} · ${w.responsible||''}`,
      `Cabinets ${ls.filter(l=>l.assets.kind==='cabinet').length} · hanging bars ${bars.length} · processors ${procs.length}`,
      `Still out ${out.length} · back ${back.length}${rep.length?` · repair ${rep.length}`:''}${lost.length?` · lost ${lost.length}`:''}`,
      '', ...Object.entries(byFc).sort().map(([k,v])=>`FC ${k==='—'?'—':parseInt(k,10)}: ${v.out.length+v.back.length} cab${v.out.length?` (${v.out.length} still out)`:''}`),
      rep.length?'\nRepair: '+rep.map(l=>l.assets.sn).join(', '):''].join('\n');
    navigator.clipboard ? navigator.clipboard.writeText(t).then(()=>toast('Summary copied — paste it in LINE'),()=>toast('Could not copy'))
      : toast('Copying is not available here');
    return;
  }
  const rows=Object.entries(byFc).sort().map(([k,v])=>
    `<tr><td>FC ${k==='—'?'—':parseInt(k,10)}</td><td>${v.out.length+v.back.length}</td><td>${v.out.length}</td>
     <td class="sub">${esc(v.out.concat(v.back).join(', '))}</td></tr>`).join('');
  $('#print').innerHTML=`
    <h1>${esc(w.name)}</h1>
    <div class="sub">${esc(w.location||'')} · ${dayTxt(w.start_date)} – ${dayTxt(w.end_date)} · ${esc(w.responsible||'')} · ${w.status==='active'?'ACTIVE':'CLOSED '+dayTxt(w.completed_at)}</div>
    <div class="sub">MAH LED Wall · printed ${new Date().toLocaleString('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} (BKK) by ${esc((ME&&ME.email)||'')}</div>
    <h2>Totals</h2>
    <table><tr><th>Cabinets</th><th>Hanging bars</th><th>Processors</th><th>Still out</th><th>Back</th><th>Repair</th><th>Lost</th></tr>
    <tr><td>${ls.filter(l=>l.assets.kind==='cabinet').length}</td><td>${bars.length}</td><td>${procs.length}</td>
    <td>${out.length}</td><td>${back.length}</td><td>${rep.length}</td><td>${lost.length}</td></tr></table>
    <h2>Cabinets by flight case</h2>
    <table><tr><th>Flight case</th><th>Total</th><th>Still out</th><th>Serials</th></tr>${rows||'<tr><td colspan="4">None</td></tr>'}</table>
    ${bars.length?`<h2>Hanging bars</h2><div class="sub">${esc(bars.map(l=>l.assets.sn).join(', '))}</div>`:''}
    ${procs.length?`<h2>Processors</h2><div class="sub">${esc(procs.map(l=>l.assets.sn).join(', '))}</div>`:''}
    ${rep.length?`<h2>Came back damaged / to repair</h2><div class="sub">${esc(rep.map(l=>l.assets.sn).join(', '))}</div>`:''}
    ${lost.length?`<h2>Lost</h2><div class="sub">${esc(lost.map(l=>l.assets.sn).join(', '))}</div>`:''}
    ${w.notes?`<h2>Note</h2><div class="sub">${esc(w.notes)}</div>`:''}
    <div class="sign"><div>Packed / checked by</div><div>Received by</div><div>Date</div></div>`;
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast('Printing is blocked here'); } },120);
}

    if(!ME && (e==='SIGNED_IN')) location.reload(); });                  // just signed in on the login screen
  if(!data||!data.session){ showLogin(); return; }
  ME=data.session.user;
  try{
    const r=await SB.rpc('my_role'); ROLE=(r.error?'none':r.data)||'none';
    if(ROLE==='none'){ showLogin('This login is not in the team list yet — ask Mah to add it.'); return; }
    $('#who').textContent=(ME.email||'').split('@')[0]+' · '+ROLE;
    $('#boot').hidden=true; $('#login').hidden=true;
    await loadJobs(); await loadFeed(); await refreshCounts();
    subscribe(); setTab(TAB); paintQueue(); flush();
  }catch(e){ showLogin('Could not read the database: '+e.message); }
}
boot();
})();
</script>
</body>
</html>
