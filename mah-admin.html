const RPT={sections:{summary:true,active:true,history:true,repair:true,reminders:true,checks:true,inventory:true},wo:'all'};
const nowBkk=()=>new Date().toLocaleString('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function reportData(){
  const cabs=Object.values(D.cabs), own=ownMap();
  const outC=cabs.filter(c=>c.st==='out'); const m2out=outC.reduce((a,c)=>a+M2[c.s],0), m2tot=cabs.reduce((a,c)=>a+M2[c.s],0);
  const cc=countSt(cabs.map(c=>c.st));
  const wsel=RPT.wo==='all'?D.wos:RPT.wo==='active'?D.wos.filter(w=>w.status==='active'):D.wos.filter(w=>w.id===RPT.wo);
  const activeW=wsel.filter(w=>w.status==='active'||RPT.wo===w.id);
  const woDetail=w=>{ const byFc={}; const loose=[]; w.cabs.forEach(sn=>{ const o=own.get(sn); if(o) (byFc[o.f.n]=byFc[o.f.n]||{f:o.f,sns:[]}).sns.push(sn); else loose.push(sn); });
    return {w, m2:woM2(w), fcs:Object.values(byFc).sort((a,b)=>parseInt(a.f.n)-parseInt(b.f.n)), loose}; };
  const repCabs=cabs.filter(c=>c.st==='repair'||c.st==='lost'||(c.cd&&c.cd!=='good')).map(c=>{ const o=own.get(c.sn); return {sn:c.sn,where:o?`FC ${o.f.l} · S${o.i+1}`:'unassigned',st:ST_L[c.st]||c.st,cd:CD_L[c.cd]||c.cd||'',note:c.note||''}; });
  const probParts=[]; cabs.forEach(c=>{ const o=own.get(c.sn); (c.mods||[]).forEach((m,i)=>{ const p=m&&D.parts[m]; if(p&&p.cd!=='good') probParts.push({sn:m,part:'M'+(i+1),cab:c.sn,where:o?`FC ${o.f.l}`:'',cd:CD_L[p.cd],note:p.note||''}); }); const p=c.pdu&&D.parts[c.pdu]; if(p&&p.cd!=='good') probParts.push({sn:c.pdu,part:'PDU',cab:c.sn,where:o?`FC ${o.f.l}`:'',cd:CD_L[p.cd],note:p.note||''}); });
  const spareRep=Object.values(D.spares).filter(s=>s.st==='repair'||s.st==='lost').map(s=>({sn:s.sn,kind:s.k==='P'?'PDU':'Module',st:ST_L[s.st],note:s.note||''}));
  const repFc=Object.entries(GS.fcsheet).filter(([n,v])=>v[2]>0).map(([n])=>parseInt(n,10));
  const rem=reminders().map(r=>({what:r.type==='slot'?`FC ${r.f.l} · S${r.i+1} empty`:`${r.c.sn} · ${r.type==='pdu'?'PDU':'M'+(r.i+1)} missing`,why:r.rec?`${r.rec.text} · ${hhmm(r.rec.t)}`:'Empty in the seed data'}));
  return {gen:nowBkk(),src:'Live from the MAH LED database',
    summary:[['LED wall out',`${nf(m2out)} m² of ${nf(m2tot)} m² (${Math.round(m2out/m2tot*100)}%)`],['Cabinets',`${nf(cabs.length)} · in stock ${nf(cc.in_stock)} · out ${nf(cc.out)} · repair ${nf(cc.repair)} · lost ${nf(cc.lost)}`],['Work orders',`${D.wos.filter(w=>w.status==='active').length} active · ${D.wos.filter(w=>w.status!=='active').length} completed`],['Needs attention',`${attention().length} items`],['Reminders',`${rem.length} empty slots / missing parts`]],
    active:activeW.map(woDetail), history:wsel.slice().sort((a,b)=>dt(woSpan(b)[0])-dt(woSpan(a)[0])),
    repCabs, probParts, spareRep, repFc, rem, checks:attention(), inv:invRows()};
}
function reportHTML(R){
  const S=RPT.sections; const sec=(t,b)=>`<section class="rs"><h3>${t}</h3>${b}</section>`;
  const tbl=(h,rows,cls='')=>`<table class="rt ${cls}"><thead><tr>${h.map(x=>`<th${/^#|n:/.test(x)?' class="n"':''}>${esc(x.replace(/^n:/,''))}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td${/^n:/.test(h[i])?' class="n"':''}>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="none">None</td></tr>`}</tbody></table>`;
  return `<div class="rdoc">
  <header class="rh"><div><div class="rk">MAH LED · Infiled RS</div><h2>Stock &amp; Work Order Report</h2></div><div class="rmeta">Generated ${esc(R.gen)} (BKK)<br>${esc(R.src)}</div></header>
  ${S.summary?sec('Summary',`<div class="rkpis">${R.summary.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`):''}
  ${S.active?sec(RPT.wo==='all'||RPT.wo==='active'?'Active work orders — pick list':'Work order detail',R.active.length?R.active.map(x=>`<div class="rwo"><div class="rwoh"><b>${esc(x.w.name)}</b><span>${esc(x.w.loc)} · ${woDates(x.w)} · ${esc(x.w.resp)} · ${x.w.status==='active'?'Active':'Completed'}</span></div>
    <div class="rwos">${x.w.cabs.length} cabinets · ${nf(x.m2)} m² · ${x.fcs.length} flight cases · hanging bars ${x.w.items.length} · IL signal ${x.w.cables.il_signal||0} · IL power ${x.w.cables.il_power||0} · main power ${x.w.cables.main_power||0} · Cat6 ${x.w.cables.cat6||0} · VX2000 Pro ${x.w.procs.vx2000pro||0} · CVT-M ${x.w.procs.cvtm||0}</div>
    ${tbl(['Flight case','n:Cab','Cabinet serials'],x.fcs.map(g=>[`FC ${esc(g.f.l)}`,`${g.sns.length}/${cap(g.f)}`,`<span class="mono">${esc(g.sns.join(', '))}</span>`]))}
    ${x.w.items.length?`<p class="rp"><b>Hanging bars:</b> <span class="mono">${esc(x.w.items.join(', '))}</span></p>`:''}${x.loose.length?`<p class="rp"><b>Not in a case:</b> <span class="mono">${esc(x.loose.join(', '))}</span></p>`:''}${x.w.notes?`<p class="rp"><b>Note:</b> ${esc(x.w.notes)}</p>`:''}</div>`).join(''):'<p class="rp">No active work orders.</p>'):''}
  ${S.history?sec('Work orders',tbl(['Work order','Venue','Crew','Dates','Status','n:Cabinets','n:m²','n:Bars'],R.history.map(w=>[`<b>${esc(w.name)}</b>`,esc(w.loc),esc(w.resp),woDates(w),w.status==='active'?'<span class="st out">Active</span>':'Completed',w.cabs.length,nf(woM2(w)),w.items.length]))):''}
  ${S.repair?sec('Repair &amp; problem items',`<h4>Cabinets</h4>${tbl(['Cabinet','Location','Status','Condition','Note'],R.repCabs.map(c=>[`<span class="mono">${esc(c.sn)}</span>`,esc(c.where),`<span class="st rep">${esc(c.st)}</span>`,esc(c.cd),esc(c.note)]))}
    ${R.repFc.length?`<p class="rp">FlightCases tab reports a cabinet in repair in FC ${R.repFc.join(', ')}.</p>`:''}
    <h4>Modules &amp; PDUs marked problem</h4>${tbl(['Serial','Part','Cabinet','Location','Condition','Note'],R.probParts.map(p=>[`<span class="mono">${esc(p.sn)}</span>`,p.part,`<span class="mono">${esc(p.cab)}</span>`,esc(p.where),esc(p.cd),esc(p.note)]))}
    <h4>Spares in repair / lost</h4>${tbl(['Serial','Type','Status','Note'],R.spareRep.map(s=>[`<span class="mono">${esc(s.sn)}</span>`,s.kind,`<span class="st rep">${esc(s.st)}</span>`,esc(s.note)]))}`):''}
  ${S.reminders?sec('Reminders — empty slots &amp; missing parts',tbl(['Reminder','Reason'],R.rem.map(r=>[esc(r.what),esc(r.why)]))):''}
  ${S.checks?sec('Data checks',tbl(['Level','Finding','Detail'],R.checks.map(a=>[`<span class="st ${a.sev}">${a.sev==='crit'?'Critical':a.sev==='warn'?'Warning':'Info'}</span>`,esc(a.t),esc(a.d)]))):''}
  ${S.inventory?sec('Inventory status',tbl(['Group','Item','n:Total','n:In stock','n:Out','n:Repair','n:Lost'],R.inv.map(r=>[r.g,esc(r.name),nf(r.total),nf(r.in_stock),nf(r.out),nf(r.repair),nf(r.lost||0)]))):''}
  <footer class="rf">MAH LED Wall Manager · ${esc(R.gen)}</footer></div>`;
}
let _dl=null; (async()=>{ try{ if(window.claude&&window.claude.use){ _dl=await window.claude.use('downloads'); } }catch(e){ _dl=null; } const b=$('#rDl'); if(b) b.hidden=!_dl; })();
function openReport(){
  const host=$('#report');
  const opts=[['summary','Summary'],['active','Active WO pick list'],['history','WO history'],['repair','Repair & problems'],['reminders','Reminders'],['checks','Data checks'],['inventory','Inventory']];
  host.innerHTML=`<div class="rbar"><b>Report</b>

    <label class="rsel">Work orders <select id="rWo"><option value="all">All</option><option value="active">Active only</option>${D.wos.map(w=>`<option value="${w.id}" ${RPT.wo===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label>
    <span class="grow"></span>

  $('#rDl').onclick=downloadPdf;
}
async function downloadPdf(){
  if(!_dl||!window.jspdf){ toast('PDF download is not available here — use Print / Save as PDF'); return; }
  const R=reportData(); const S=RPT.sections;
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const Lm=14, Wd=182, Bot=282; let y=18;
  const ink=[19,32,34], mut=[88,106,108], acc=[10,140,161], line=[200,211,212];
  const txt=(s,x,yy,o={})=>{ doc.setFont('helvetica',o.b?'bold':'normal'); doc.setFontSize(o.s||9); doc.setTextColor(...(o.c||ink)); doc.text(String(s),x,yy,o.a?{align:o.a}:undefined); };
  const need=h=>{ if(y+h>Bot){ doc.addPage(); y=18; } };
  const h3=t=>{ need(14); y+=4; doc.setFillColor(...acc); doc.rect(Lm,y-4,2,6,'F'); txt(t,Lm+5,y+0.5,{b:1,s:12}); y+=7; };
  const para=(t,o={})=>{ doc.setFont('helvetica',o.b?'bold':'normal'); doc.setFontSize(o.s||8.5); const ls=doc.splitTextToSize(String(t),Wd); ls.forEach(l=>{ need(4.6); txt(l,Lm,y,{s:o.s||8.5,c:o.c,b:o.b}); y+=4.2; }); y+=1; };
  const table=(cols,rows)=>{ // cols: [{t,w,a}]
    const pad=1.6, fs=7.8; const head=()=>{ need(7); doc.setFillColor(236,241,241); doc.rect(Lm,y-4.2,Wd,6,'F'); let x=Lm; cols.forEach(c=>{ txt(c.t.toUpperCase(),c.a==='right'?x+c.w-pad:x+pad,y,{b:1,s:6.8,c:mut,a:c.a}); x+=c.w; }); y+=3.5; };
    head(); if(!rows.length){ need(6); txt('None',Lm+pad,y+2,{s:fs,c:mut}); y+=7; return; }
    rows.forEach((r,ri)=>{ doc.setFont('helvetica','normal'); doc.setFontSize(fs); const cells=r.map((v,i)=>doc.splitTextToSize(String(v==null?'':v),cols[i].w-pad*2)); const h=Math.max(...cells.map(c=>c.length))*3.4+2.4;
      if(y+h>Bot){ doc.addPage(); y=18; head(); }
      if(ri%2) { doc.setFillColor(248,250,250); doc.rect(Lm,y-1.2,Wd,h,'F'); }
      let x=Lm; cells.forEach((c,i)=>{ c.forEach((l,li)=>txt(l,cols[i].a==='right'?x+cols[i].w-pad:x+pad,y+2.2+li*3.4,{s:fs,a:cols[i].a})); x+=cols[i].w; });
      doc.setDrawColor(...line); doc.setLineWidth(0.15); doc.line(Lm,y-1.2+h,Lm+Wd,y-1.2+h); y+=h; });
    y+=3; };
  // header
  txt('MAH LED · INFILED RS',Lm,y,{s:8,c:acc,b:1}); txt('Generated '+R.gen+' (BKK)',Lm+Wd,y,{s:7.5,c:mut,a:'right'}); y+=7;
  txt('Stock & Work Order Report',Lm,y,{s:18,b:1}); y+=5; para(R.src,{c:mut,s:7.5}); doc.setDrawColor(...ink); doc.setLineWidth(0.4); doc.line(Lm,y,Lm+Wd,y); y+=3;
  if(S.summary){ h3('Summary'); table([{t:'Measure',w:45},{t:'Value',w:137}],R.summary); }
  if(S.active){ h3(RPT.wo==='all'||RPT.wo==='active'?'Active work orders — pick list':'Work order detail');
    if(!R.active.length) para('No active work orders.');
    R.active.forEach(x=>{ need(16); txt(x.w.name,Lm,y,{b:1,s:10.5}); y+=4.6; para(`${x.w.loc} · ${woDates(x.w)} · ${x.w.resp} · ${x.w.status==='active'?'Active':'Completed'}`,{c:mut});
      para(`${x.w.cabs.length} cabinets · ${nf(x.m2)} m² · ${x.fcs.length} flight cases · hanging bars ${x.w.items.length} · IL signal ${x.w.cables.il_signal||0} · IL power ${x.w.cables.il_power||0} · main power ${x.w.cables.main_power||0} · Cat6 ${x.w.cables.cat6||0} · VX2000 Pro ${x.w.procs.vx2000pro||0} · CVT-M ${x.w.procs.cvtm||0}`);
      table([{t:'Flight case',w:26},{t:'Cab',w:14,a:'right'},{t:'Cabinet serials',w:142}],x.fcs.map(g=>['FC '+g.f.l,g.sns.length+'/'+cap(g.f),g.sns.join(', ')]));
      if(x.w.items.length) para('Hanging bars: '+x.w.items.join(', ')); if(x.loose.length) para('Not in a case: '+x.loose.join(', ')); if(x.w.notes) para('Note: '+x.w.notes); y+=2; }); }
  if(S.history){ h3('Work orders'); table([{t:'Work order',w:44},{t:'Venue',w:36},{t:'Crew',w:30},{t:'Dates',w:28},{t:'Status',w:18},{t:'Cab',w:10,a:'right'},{t:'m²',w:9,a:'right'},{t:'Bars',w:7,a:'right'}],R.history.map(w=>[w.name,w.loc,w.resp,woDates(w),w.status==='active'?'Active':'Completed',w.cabs.length,nf(woM2(w)),w.items.length])); }
  if(S.repair){ h3('Repair & problem items'); para('Cabinets',{b:1});
    table([{t:'Cabinet',w:32},{t:'Location',w:30},{t:'Status',w:20},{t:'Condition',w:22},{t:'Note',w:78}],R.repCabs.map(c=>[c.sn,c.where,c.st,c.cd,c.note]));
    if(R.repFc.length) para('FlightCases tab reports a cabinet in repair in FC '+R.repFc.join(', ')+'.',{c:mut});
    para('Modules & PDUs marked problem',{b:1}); table([{t:'Serial',w:38},{t:'Part',w:12},{t:'Cabinet',w:30},{t:'Location',w:22},{t:'Condition',w:20},{t:'Note',w:60}],R.probParts.map(p=>[p.sn,p.part,p.cab,p.where,p.cd,p.note]));
    para('Spares in repair / lost',{b:1}); table([{t:'Serial',w:44},{t:'Type',w:22},{t:'Status',w:22},{t:'Note',w:94}],R.spareRep.map(s=>[s.sn,s.kind,s.st,s.note])); }
  if(S.reminders){ h3('Reminders — empty slots & missing parts'); table([{t:'Reminder',w:70},{t:'Reason',w:112}],R.rem.map(r=>[r.what,r.why])); }
  if(S.checks){ h3('Data checks'); table([{t:'Level',w:20},{t:'Finding',w:80},{t:'Detail',w:82}],R.checks.map(a=>[a.sev==='crit'?'Critical':a.sev==='warn'?'Warning':'Info',a.t,a.d])); }
  if(S.inventory){ h3('Inventory status'); table([{t:'Group',w:22},{t:'Item',w:70},{t:'Total',w:18,a:'right'},{t:'In stock',w:20,a:'right'},{t:'Out',w:17,a:'right'},{t:'Repair',w:18,a:'right'},{t:'Lost',w:17,a:'right'}],R.inv.map(r=>[r.g,r.name,nf(r.total),nf(r.in_stock),nf(r.out),nf(r.repair),nf(r.lost||0)])); }
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); txt(`MAH LED · Stock & Work Order Report · page ${i} of ${n}`,Lm+Wd/2,291,{s:7,c:mut,a:'center'}); }
  const name='MAH-LED-report-'+new Date().toISOString().slice(0,10)+'.pdf';
  try{ await _dl.save({filename:name,data:doc.output('blob')}); toast('PDF saved: '+name); }
  catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='rate_limited'?'A save prompt is already open':'PDF download is not available here — use Print / Save as PDF'); }
}
