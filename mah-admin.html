<title>Cosmos LED Management</title>
<meta name="description" content="MAH LED flight cases and Infiled RS cabinets in 3D — locate any serial, open a case, move cabinets, modules and PDUs between fixed slots with reminders for every empty slot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E6ECED; --sheet:#F4F7F7; --panel:#FFFFFF; --panel-2:#F0F4F4;
  --ink:#132022; --muted:#586A6C; --line:#C8D3D4; --grid:rgba(19,32,34,.07);
  --accent:#0A8CA1; --accent-soft:rgba(10,140,161,.12); --accent-ink:#FFFFFF;
  --ok:#0ca30c; --out:#2a78d6; --rep:#d03b3b; --lost:#4a3aa7; --flag:#c27400; --flag-soft:rgba(237,161,0,.14);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --g-led:#0A8CA1; --g-rig:#eb6834; --g-cab:#1baf7a; --g-ctl:#4a3aa7; --g-wo:#2a78d6; --track:#E4EAEB;
  --case:#454C4D; --case-edge:#1C2627; --frame:#7A8687; --led:#0B1011; --edge3d:#1E2B2C; --dim:#0A8CA1; --slotfill:#20282A;
  --font-d:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A0F10; --sheet:#0E1516; --panel:#131B1C; --panel-2:#18221F;
    --ink:#E2EBEB; --muted:#8D9E9F; --line:#263233; --grid:rgba(226,235,235,.05);
    --accent:#36C1D5; --accent-soft:rgba(54,193,213,.14); --accent-ink:#031416;
    --ok:#1fb31f; --out:#3987e5; --rep:#e05252; --lost:#9085e9; --flag:#f0b429; --flag-soft:rgba(240,180,41,.14);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --g-led:#36C1D5; --g-rig:#d95926; --g-cab:#199e70; --g-ctl:#9085e9; --g-wo:#3987e5; --track:#223031;
    --case:#2E3637; --case-edge:#8FA3A4; --frame:#5E6B6C; --led:#050809; --edge3d:#9DB2B3; --dim:#36C1D5; --slotfill:#0B1011;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A0F10; --sheet:#0E1516; --panel:#131B1C; --panel-2:#18221F;
  --ink:#E2EBEB; --muted:#8D9E9F; --line:#263233; --grid:rgba(226,235,235,.05);
  --accent:#36C1D5; --accent-soft:rgba(54,193,213,.14); --accent-ink:#031416;
  --ok:#1fb31f; --out:#3987e5; --rep:#e05252; --lost:#9085e9; --flag:#f0b429; --flag-soft:rgba(240,180,41,.14);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --g-led:#36C1D5; --g-rig:#d95926; --g-cab:#199e70; --g-ctl:#9085e9; --g-wo:#3987e5; --track:#223031;
  --case:#2E3637; --case-edge:#8FA3A4; --frame:#5E6B6C; --led:#050809; --edge3d:#9DB2B3; --dim:#36C1D5; --slotfill:#0B1011;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--font-b);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh;padding-inline:12px;padding-block:0 12px;gap:10px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font:700 22px/1 var(--font-d);letter-spacing:.02em;text-transform:uppercase}
.brand span{font:500 11px/1 var(--font-m);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;font-family:var(--font-m);font-size:13px;min-width:0}
.search svg{flex:none;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* who you are and the way out, pushed to the right so they sit under the
   Dashboard / Manage switch rather than in the middle of the stock buttons */
.acct{display:flex;align-items:center;gap:6px;margin-left:auto;padding-left:12px;
      border-left:1px solid var(--line)}
.acct .conn{margin-right:2px}
#bOut{color:var(--muted)}
#bOut:hover{border-color:var(--rep);color:var(--rep)}
@media (max-width:900px){
  .acct{margin-left:0;padding-left:0;border-left:0;width:100%;
        padding-top:8px;border-top:1px solid var(--line)}
}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tile:focus-visible,.row:focus-visible,.chip:focus-visible,.ic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.flagbtn{border-color:var(--flag);color:var(--flag);background:var(--flag-soft);font-weight:600}
.btn.flagbtn.none{border-color:var(--line);color:var(--muted);background:var(--panel);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:4px 8px;font-size:11.5px}
/* ── layout: FC list | Library (Cab · PDU · Module) | 3D | Editor ── */
main.work{display:grid;grid-template-columns:230px minmax(430px,1.15fr) minmax(420px,1.5fr) 320px;grid-template-areas:"fcl lib stage edit";gap:10px;min-height:0}
aside.fcl{grid-area:fcl} section.lib{grid-area:lib} .stage{grid-area:stage} aside.edit{grid-area:edit}
aside,section.lib{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.colh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 10px 6px}
.colh h2{margin:0;font:700 13px/1.1 var(--font-d);letter-spacing:.09em;text-transform:uppercase}
.colh .n{font:500 11px/1 var(--font-m);color:var(--muted);font-variant-numeric:tabular-nums}
.colf{display:flex;gap:5px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.colf input,.colf select{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 8px;font-size:12px;min-width:0;outline:none}
.colf input{flex:1;font-family:var(--font-m)}
.colf select{flex:none;max-width:118px}
.colf input:focus,.colf select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scroll{overflow:auto;min-height:0;flex:1}
.libh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 0}
.libh h2{margin:0;font:700 15px/1 var(--font-d);letter-spacing:.09em;text-transform:uppercase}
.libtabs{display:none;gap:4px}
.libcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:1;min-height:0}
.libcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.libcol:last-child{border-right:0}
.libcol .list{padding:6px 8px 10px;display:flex;flex-direction:column;gap:5px}
.more{font:11px/1.35 var(--font-m);color:var(--muted);padding:4px 2px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--accent-soft)}
.row b{font:600 14px/1.2 var(--font-d);letter-spacing:.02em}
.row .meta{font:12px/1.2 var(--font-m);color:var(--muted);font-variant-numeric:tabular-nums}
.row .chain{grid-column:1/-1;font:11.5px/1.35 var(--font-m);color:var(--muted);overflow-wrap:anywhere}
.row .chain em{font-style:normal;color:var(--ink)}
.fl{color:var(--flag);font:600 11.5px/1 var(--font-m);margin-left:6px}
.bar{grid-column:1/-1;display:flex;gap:2px;height:4px}
.bar i{flex:1;border-radius:1px;background:var(--line)}
.bar i.e{background:transparent;box-shadow:inset 0 0 0 1px var(--flag)}
.kind{font:600 10px/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0;
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.hot{cursor:pointer}
.crumbs{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;right:230px;pointer-events:none}
.crumbs>*{pointer-events:auto}
.crumb{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:600 12.5px/1 var(--font-d);letter-spacing:.04em;cursor:pointer}
.crumb.cur{border-color:var(--accent);color:var(--accent);cursor:default}
.sep{color:var(--muted);font-size:12px}
.views{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:220px}
.layers{position:absolute;left:10px;bottom:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 270px);align-items:center}
.layers .lab{font:600 10.5px/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.hint{position:absolute;left:10px;bottom:46px;font:11px/1.3 var(--font-m);color:var(--muted);max-width:50%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font:500 11.5px/1.2 var(--font-b);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tblock{position:absolute;right:10px;bottom:10px;border:1px solid var(--ink);background:var(--panel);font:11px/1.25 var(--font-m);display:grid;grid-template-columns:auto auto;min-width:230px;max-width:calc(100% - 20px)}
.tblock div{padding:4px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tblock div:nth-child(2n){border-right:0}
.tblock .k{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:9.5px}
.tblock .v{font-weight:600}
.tblock .v.big{font:700 15px/1.1 var(--font-d);letter-spacing:.03em}
.panel{padding:12px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;flex-direction:column;gap:3px}
.ph h3{margin:0;font:700 20px/1.1 var(--font-d);letter-spacing:.02em;text-wrap:balance;overflow-wrap:anywhere}
.ph p{margin:0;color:var(--muted);font-size:12.5px}
.lbl{font:600 11px/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.drop{border:1px dashed transparent;border-radius:8px;transition:border-color .12s,background .12s;min-width:0}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.slot{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px}
.slot .no{font:600 12px/1 var(--font-m);color:var(--muted);text-align:center}
.slot.hl .no{color:var(--accent)}
.slot.flag .no{color:var(--flag)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:9px 10px;color:var(--muted);font-size:12px;text-align:center}
.empty.flag{border-color:var(--flag);color:var(--flag);background:var(--flag-soft);text-align:left}
.empty.flag b{font:600 12.5px/1.2 var(--font-b)}
.empty.flag small{display:block;color:var(--muted);font:11px/1.35 var(--font-m);margin-top:2px;overflow-wrap:anywhere}
.tile{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 7px;min-width:0;user-select:none;-webkit-user-select:none;cursor:grab}
.tile.static{cursor:pointer}
.tile.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tile .grip{touch-action:none;color:var(--muted);font-size:14px;line-height:1;padding:4px 2px;cursor:grab;flex:none}
.tile.static .grip{visibility:hidden}
.tile .sn{font:500 12px/1.2 var(--font-m);overflow-wrap:anywhere;min-width:0;flex:1}
.tile .sub{display:block;font:11px/1.25 var(--font-b);color:var(--muted);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.out{background:var(--out)}.dot.repair{background:var(--rep)}.dot.lost{background:var(--lost)}.dot.installed{background:var(--accent)}.dot.none{background:transparent;border:1px solid var(--muted)}
.ic{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:5px;font-size:13px;flex:none;line-height:1}
.ic:hover{color:var(--accent);background:var(--accent-soft)}
.ic.rm:hover{color:var(--rep);background:color-mix(in srgb,var(--rep) 12%,transparent)}
.front{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.front .mod{min-height:84px;display:flex}
.front .mod>.tile,.front .mod>.empty{width:100%}
.front .mod .tile{flex-direction:column;align-items:stretch;justify-content:space-between;padding:8px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:4px}
.mtop b{font:700 15px/1 var(--font-d)}
.zone{border:1px dashed var(--line);border-radius:8px;padding:9px;font-size:12px;color:var(--muted);text-align:center}
.zone.bin{color:var(--rep);border-color:color-mix(in srgb,var(--rep) 45%,var(--line))}
.note{font-size:11.5px;color:var(--muted);line-height:1.4}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font:11.5px/1.35 var(--font-m);color:var(--muted)}
.log li{overflow-wrap:anywhere}
.log time{color:var(--ink);margin-right:6px}
.proto{font:10.5px/1.3 var(--font-m);color:var(--muted);letter-spacing:.04em}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:260px}
body.dragging,body.dragging *{cursor:grabbing!important}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s}
.toast[hidden]{display:none!important}
.dlg{position:fixed;inset:0;background:rgba(5,10,11,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.dlg .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(440px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h4{margin:0;font:700 18px/1.15 var(--font-d);letter-spacing:.02em}
.dlg p{margin:0;color:var(--muted);font-size:13px}
.dlg .opts{display:flex;flex-direction:column;gap:6px}
.dlg .opts .btn{text-align:left;padding:9px 11px;white-space:normal}
.dlg .opts .btn small{display:block;color:var(--muted);font-weight:400;font-family:var(--font-m);font-size:11px}
.dlg .opts .btn.primary small{color:inherit;opacity:.85}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font:600 11px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:8px 10px;font-family:var(--font-m);font-size:13px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.dlg .acts{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
#file{display:none}
/* page switch */
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg2 button{border:0;background:transparent;padding:7px 12px;font:600 12.5px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
body[data-page="dash"] main.work{display:none}
body:not([data-page="dash"]) .dash{display:none}
/* status editor */
.stbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.segs{display:flex;flex-wrap:wrap;gap:4px}
.segs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.segs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.segs button.s-out[aria-pressed="true"]{background:var(--out);border-color:var(--out);color:#fff}
.segs button.s-repair[aria-pressed="true"],.segs button.s-damaged[aria-pressed="true"]{background:var(--rep);border-color:var(--rep);color:#fff}
.segs button.s-lost[aria-pressed="true"]{background:var(--lost);border-color:var(--lost);color:#fff}
.segs button.s-in_stock[aria-pressed="true"],.segs button.s-good[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.stbox input{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 9px;font-size:12.5px;outline:none;min-width:0}
.stbox input:focus{border-color:var(--accent)}
.stbox .row2{display:flex;gap:6px;align-items:center}
.stbox .row2 input{flex:1}
.tag{font:600 10.5px/1 var(--font-m);padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--rep) 14%,transparent);color:var(--rep)}
/* dashboard — colour-coded */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-content:start;overflow:auto;min-height:0;padding-bottom:8px}
.dash>section{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.kpi{grid-column:span 3;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--kc,var(--accent));background:linear-gradient(180deg,color-mix(in srgb,var(--kc,var(--accent)) 9%,var(--panel)) 0,var(--panel) 70%)}
.k-led{--kc:var(--out)} .k-cab{--kc:var(--ok)} .k-wo{--kc:var(--g-led)} .k-att{--kc:var(--flag)} .k-att.crit{--kc:var(--rep)}
.khead{display:flex;align-items:center;gap:8px}
.kic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--kc);color:#fff;font:700 14px/1 var(--font-b)}
.klbl{font:700 12.5px/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.kbody{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kbig{font:700 40px/1 var(--font-d);letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kbig small{font:600 16px/1 var(--font-d);color:var(--muted);letter-spacing:.04em}
.kbig.muted{color:var(--muted)}
.ksub{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}
.ksub b{color:var(--ink)}
.kpair{display:flex;gap:28px}
.klist{display:flex;flex-direction:column;gap:5px;min-width:130px;flex:1}
.klist div{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:7px;font-size:13px}
.klist i{width:12px;height:12px;border-radius:3px}
.klist b{font:600 14px/1 var(--font-m);font-variant-numeric:tabular-nums}
.klist i.ok{background:var(--ok)} .klist i.out{background:var(--out)} .klist i.rep{background:var(--rep)} .klist i.lost{background:var(--lost)}
.donut{flex:none}
.donut .dc{font:700 22px var(--font-d);fill:var(--ink)} .donut .ds{font:500 11px var(--font-m);fill:var(--muted)}
.nextc{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-left:4px solid var(--out);border-radius:8px;padding:8px 10px;background:var(--panel);cursor:pointer}
.nextc:hover{border-color:var(--out)}
.nextc b{font-size:14px} .nextc span{font-size:12px;color:var(--muted)} .nextc .pill{align-self:flex-start;color:#fff}
.sevrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--font-b);padding:5px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill.crit{background:var(--rep);color:#fff} .pill.warn{background:var(--flag);color:#1a1200} .pill.info{background:var(--out);color:#fff}
.pill.act{background:var(--out);color:#fff} .pill.done{background:var(--track);color:var(--muted)}
.rep-btn{align-self:flex-start;margin-top:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend i.ok{background:var(--ok)} .legend i.out{background:var(--out)} .legend i.rep{background:var(--rep)} .legend i.lost{background:var(--lost)}
.sbar{display:flex;gap:2px;height:16px;min-width:90px}
.sbar.big{height:18px}
.sbar i{border-radius:4px;min-width:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sbar i em{font:600 10px/1 var(--font-m);font-style:normal;color:#fff;padding:0 4px;white-space:nowrap}
.sbar i.ok{background:var(--ok)} .sbar i.out{background:var(--out)} .sbar i.rep{background:var(--rep)} .sbar i.lost{background:var(--lost)}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card.wo{grid-column:span 8} .card.att{grid-column:span 4} .card.rep{grid-column:span 4}
.card.rep{display:flex;flex-direction:column;min-height:0}
.rchips{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px 0}
.rchips .chip{font:600 11.5px/1 var(--font-b);border:1px solid var(--line);border-radius:7px;padding:6px 9px;
              color:var(--muted);background:var(--panel);cursor:pointer}
.rchips .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rchips .chip i{font-style:normal;font-family:var(--font-m);font-weight:500;opacity:.75;margin-left:5px}
.rfind{display:flex;gap:6px;padding:9px 12px}
.rfind input{flex:1;min-width:0;font:12.5px var(--font-m);border:1px solid var(--line);border-radius:7px;
             padding:7px 9px;background:var(--panel-2);color:var(--ink)}
.rfind select{font:12.5px var(--font-b);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
              background:var(--panel-2);color:var(--ink);max-width:132px}
/* Two rules, both needed. flex:0 0 auto stops the flex column squeezing the
   list back down to the two rows this was meant to fix; min-height:auto lets
   the card claim its real height — with min-height:0 the grid row stayed as
   short as the card beside it and the list spilled over the card below. */
.rlist{overflow-y:auto;border-top:1px solid var(--line);flex:0 0 auto;
       height:calc(var(--rrows,10) * 46px)}
.card.rep{min-height:auto}
.rfoot{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);
       background:var(--sheet);font:500 11.5px/1 var(--font-m);color:var(--muted)}
.rfoot .btn{margin-left:auto}
/* ── the master schedule ── */
.sched{--sgut:250px;--sday:34px;--srow:38px;min-width:max-content;position:relative}
.srow{display:grid;grid-template-columns:var(--sgut) repeat(var(--n),var(--sday));align-items:stretch}
.shead{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line)}
.scell{padding:6px 0 7px;text-align:center;border-left:1px solid var(--grid)}
.scell.wk{border-left-color:var(--line)}
.sd{font:600 12px/1.1 var(--font-m);color:var(--ink);font-variant-numeric:tabular-nums}
.sm{font:600 8.5px/1.4 var(--font-d);letter-spacing:.1em;color:var(--muted)}
.sgut{position:sticky;left:0;z-index:5;background:var(--panel);border-right:1px solid var(--line);
      padding:5px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.shead .sgut{font:600 10px/1 var(--font-d);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
             justify-content:flex-end;padding-bottom:9px}
.sjob{border-bottom:1px solid var(--grid);min-height:var(--srow)}
.sjob:hover .sgut,.sjob:hover .slane{background:var(--panel-2)}
.sn{font:600 12.5px/1.25 var(--font-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font:400 11px/1.3 var(--font-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slane{position:relative;grid-column:2/-1;display:grid;
       grid-template-columns:repeat(var(--n),var(--sday));background:var(--panel)}
.slane .g{border-left:1px solid var(--grid)}
.slane .g.wk{border-left-color:var(--line)}
.slane .g.we{background:var(--sheet)}
.sbar{grid-row:1;align-self:center;height:21px;margin:0 2px;border-radius:6px;display:flex;align-items:center;
      padding:0 8px;font:600 11.5px/1 var(--font-b);color:#fff;white-space:nowrap;overflow:hidden;
      cursor:pointer;z-index:2;background:var(--c);border:1.5px solid transparent;min-width:0}
.sbar .sl{overflow:hidden;text-overflow:ellipsis}
.sbar .sq{margin-left:auto;padding-left:9px;font:500 10.5px/1 var(--font-m);opacity:.85}
.sbar:hover{filter:brightness(1.12)}
.sbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sbar.booked{background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--c);border-color:var(--c)}
.sbar.done{background:color-mix(in srgb,var(--c) 26%,var(--panel));color:var(--muted)}
.sbar.clash{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--rep)}
.sline{position:absolute;top:0;bottom:0;width:2px;background:var(--rep);z-index:3;pointer-events:none}
/* under the grid, not over the dates — it was covering the 15th and the 16th */
.sflag{position:absolute;bottom:0;z-index:6;transform:translateX(-50%);background:var(--rep);color:#fff;
       font:600 8.5px/1 var(--font-d);letter-spacing:.09em;text-transform:uppercase;
       padding:3px 6px;border-radius:5px 5px 0 0;white-space:nowrap}
.sout{grid-row:1;align-self:center;display:flex;align-items:center;padding:0 8px;min-width:0;
      font:600 11.5px/1 var(--font-b);color:var(--ink);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;pointer-events:none;z-index:1}
.sout.bef{justify-content:flex-end}
.sbar.tiny{padding:0;min-width:9px}
.snone{padding:20px 12px;color:var(--muted);grid-column:1/-1;text-align:center}
.slegend{display:flex;flex-wrap:wrap;align-items:center;gap:13px;font-size:11.5px;color:var(--muted)}
.slegend span{display:flex;align-items:center;gap:6px}
.slegend .sright{margin-left:auto;gap:9px}
.slegend .scl{color:var(--rep)}
.ssw{width:21px;height:11px;border-radius:3px;background:var(--out);flex:none}
.ssw.bk{background:color-mix(in srgb,var(--out) 15%,var(--panel));border:1.5px solid var(--out)}
.ssw.dn{background:color-mix(in srgb,var(--out) 26%,var(--panel))}
.ssw.cl{background:var(--lost);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--rep)}
.rrow{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;padding:8px 12px;
      border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover{background:var(--panel-2)}
.rrow .ri{font:500 11px/1 var(--font-m);color:var(--muted);text-align:right}
.rrow{min-height:46px}
.rrow b{font:600 12.5px/1.25 var(--font-m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rt2{text-align:right;white-space:nowrap}
.stg{font:700 9.5px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 8px;
     display:inline-block}
.stg.wait{background:color-mix(in srgb,var(--flag) 18%,transparent);color:#8a6100}
.stg.vend{background:color-mix(in srgb,var(--out) 18%,transparent);color:var(--out)}
.rrow .dy{font:500 10.5px/1 var(--font-m);color:var(--muted);display:block;margin-top:4px}
.rnone{padding:16px 12px;text-align:center;color:var(--muted);font-size:12.5px}
/* the option list: a colour rail on the left says what kind of thing it is */
.opts .btn{position:relative;padding-left:15px}
.opts .btn::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:transparent}
.opts .btn.o-bad::before{background:var(--rep)}
.opts .btn.o-job::before{background:var(--flag)}
.opts .btn.o-good::before{background:var(--ok)}
.opts .btn.o-read::before{background:var(--muted);opacity:.45}
.opts .btn.o-bad{border-color:rgba(208,59,59,.45)}
.opts .btn.o-bad:hover{border-color:var(--rep);background:var(--rep-soft2)}
.opts .btn.o-job:hover{border-color:var(--flag);background:var(--flag-soft)}
.opts .btn.o-good:hover{border-color:var(--ok);background:var(--ok-soft2)}
.opts .btn.primary::before{background:rgba(255,255,255,.55)}
:root{--rep-soft2:rgba(208,59,59,.09);--ok-soft2:rgba(12,163,12,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rep-soft2:rgba(224,82,82,.13);--ok-soft2:rgba(31,179,31,.12)}}
:root[data-theme="dark"]{--rep-soft2:rgba(224,82,82,.13);--ok-soft2:rgba(31,179,31,.12)}
/* a repair chip you can press */
.stgbtn{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;border-radius:5px}
.stgbtn:hover{outline:2px solid var(--accent);outline-offset:1px}
.repnow{cursor:pointer;border-radius:8px;padding:6px 8px;margin-left:-8px;
        border:1px dashed transparent}
.repnow:hover,.repnow:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.repnow .rgo{font:600 10.5px/1 var(--font-m);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
/* the inventory list */
:root{--g-spare:#8a6bd1;--g-acc:#c07830;--g-other:#9a9a9a}
.invbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 14px 10px}
.invq{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
      background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.invq:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.invchk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
table.inv tr.sgrp td{padding:7px 14px 3px;font:600 11px/1 var(--font-m);letter-spacing:.07em;
                     text-transform:uppercase;color:var(--muted);background:transparent;border:0}
table.inv tr.grp td{display:flex;gap:10px;align-items:center}
table.inv .gcount{white-space:nowrap}
table.inv .gcount{font:500 11.5px/1 var(--font-m);color:var(--muted)}
table.inv .invadd{margin-left:auto;padding:3px 9px;font-size:11.5px}
table.inv .iname{font-weight:600}
table.inv .icode{display:inline-block;margin-left:8px;font:500 10.5px/1 var(--font-m);color:var(--muted);
                 background:var(--chip);padding:2px 5px;border-radius:4px}
table.inv .icode.ser{background:transparent;border:1px dashed var(--line)}
table.inv .iedit{display:inline-block;margin-left:8px;font:600 10px/1 var(--font-m);letter-spacing:.07em;
                 text-transform:uppercase;color:var(--accent);opacity:0}
table.inv tr.ied{cursor:pointer}
table.inv tr.ied:hover{background:var(--accent-soft)}
table.inv tr.ied:hover .iedit,table.inv tr.ied:focus-visible .iedit{opacity:1}
table.inv tr.ied:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.inv tr.iret{opacity:.55}
table.inv tr.iret .iname{text-decoration:line-through}
table.inv .invnone{padding:18px 14px;color:var(--muted);text-align:center}
.alist li .afix{margin-top:7px;align-self:flex-start}
.alist li .afix{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.alist li .afix:hover{background:var(--flag);color:#fff}
.itemact{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.btn.sm{padding:5px 9px;font-size:11.5px}
.repnow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:2px 0 10px}
.repnow .rd{font:500 11.5px/1 var(--font-m);color:var(--muted)}
.repnow .rf2{flex:0 0 100%;font:12px/1.4 var(--font-b);color:var(--muted)}
.tile .sub .stg{margin-top:3px} .card.inv{grid-column:span 8} .card.map{grid-column:span 4}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ch h2{margin:0;font:700 17px/1.1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.hic{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;color:#fff;font:700 13px/1 var(--font-b)}
.tlwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.tl{width:100%;min-width:640px;height:auto;display:block}
.tl .ma{fill:transparent} .tl .mb{fill:var(--grid)}
.tl .ax{font:600 12px var(--font-d);letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.tl .today{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.tl .todayl{fill:var(--ink)}
.tl .wn{font:500 13px var(--font-b);fill:var(--ink)} .tl .wn.act{font-weight:700}
.tl .wbar{opacity:.85} .tl .wbar.act{opacity:1;stroke:var(--ink);stroke-width:2}
.tl .bl{font:600 11.5px var(--font-m);fill:var(--muted)}
.tl .hit{fill:transparent} .tl .wor{cursor:pointer}
.tl .wor:hover .hit,.tl .wor:focus .hit{fill:var(--accent-soft)} .tl .wor:focus{outline:none}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:700 11px/1.2 var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td .sub{display:block;color:var(--muted);font-size:12px;margin-left:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-m);white-space:nowrap}
.tbl td.g{color:var(--ok)} .tbl td.o{color:var(--out);font-weight:700} .tbl td.r{color:var(--rep);font-weight:700} .tbl td.l{color:var(--lost);font-weight:700}
.tbl .nw{white-space:nowrap}
.tbl tbody tr[data-go]{cursor:pointer}
.tbl tbody tr[data-go]:hover{background:var(--panel-2)}
.tbl tr.arow{background:color-mix(in srgb,var(--out) 7%,transparent)}
.wdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:0}
.cbar{min-width:110px;position:relative;white-space:nowrap}
.cbar .ib{display:inline-block;height:10px;border-radius:3px;vertical-align:middle;margin-right:7px;max-width:70%}
.cbar b{font:600 12.5px var(--font-m)}
.tbl tr.grp td{padding-top:14px;border-bottom:0}
.gchip{display:inline-flex;align-items:center;gap:7px;font:700 12px/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--gc)}
.gchip span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--gc);color:#fff;font:700 11px/1 var(--font-b)}
.tbl .barc{width:36%;min-width:130px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.alist li{border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;background:var(--panel)}
.alist li[data-go]{cursor:pointer}
.alist li[data-go]:hover{background:var(--panel-2)}
.alist li.crit{border-left-color:var(--rep);background:color-mix(in srgb,var(--rep) 6%,var(--panel))}
.alist li.warn{border-left-color:var(--flag);background:color-mix(in srgb,var(--flag) 7%,var(--panel))}
.alist li.info{border-left-color:var(--out);background:color-mix(in srgb,var(--out) 5%,var(--panel))}
.alist li .pill{align-self:flex-start}
.alist b{font-size:13.5px;font-weight:600}
.alist small{color:var(--muted);font:12px/1.4 var(--font-m);overflow-wrap:anywhere}
.fclegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.fclegend div{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.fclegend i{width:14px;height:14px;border-radius:4px}
.fclegend b{font:600 13px var(--font-m)}
.fcmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.fcc{border:1px solid transparent;border-radius:5px;padding:7px 0;font:600 11px/1 var(--font-m);cursor:pointer}
.fcc:hover,.fcc:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.fc-in{background:color-mix(in srgb,var(--ok) 20%,var(--panel));color:var(--ink)}
.fc-partial{background:color-mix(in srgb,var(--out) 38%,var(--panel));color:var(--ink)}
.fc-out{background:var(--out);color:#fff}
.fc-repair{background:var(--rep);color:#fff}
.fc-flag{background:var(--panel);border:2px dashed var(--flag)!important;color:var(--flag)}
.dfoot{grid-column:1/-1;margin:0}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--panel);font:12.5px/1.35 var(--font-b);padding:7px 10px;border-radius:7px;max-width:340px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip[hidden]{display:none!important}
@media (max-width:1300px){ .kpi{grid-column:span 6} }
@media (max-width:1180px){ .card.wo,.card.att,.card.inv,.card.map{grid-column:span 12} .dash{overflow:visible} }
@media (max-width:600px){ .kpi{grid-column:span 12} .kbig{font-size:32px} }
/* report preview + print */
.report{position:fixed;inset:0;z-index:75;background:rgba(5,10,11,.55);display:flex;flex-direction:column}
.report[hidden]{display:none!important}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.rbar>b{font:700 16px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase}
.rchips{display:flex;gap:4px;flex-wrap:wrap}
.rsel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.rsel select{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 8px;font-size:12.5px;max-width:220px}
.grow{flex:1}
.rscroll{overflow:auto;flex:1;padding:18px 16px}
.rdoc{background:#fff;color:#132022;max-width:210mm;margin:0 auto;padding:16mm 14mm;box-shadow:0 10px 40px rgba(0,0,0,.35);font:10.5pt/1.45 var(--font-b)}
.rh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid #132022;padding-bottom:8px;margin-bottom:6px}
.rh h2{margin:2px 0 0;font:700 22pt/1.05 var(--font-d);letter-spacing:.01em}
.rk{font:700 8.5pt/1 var(--font-d);letter-spacing:.14em;text-transform:uppercase;color:#0A8CA1}
.rmeta{font:8pt/1.4 var(--font-m);color:#586A6C;text-align:right}
.rs{margin-top:14px;break-inside:auto}
.rs h3{font:700 12.5pt/1.1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;padding-left:8px;border-left:4px solid #0A8CA1}
.rs h4{font:700 9.5pt/1.2 var(--font-b);margin:10px 0 4px}
.rkpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.rkpis div{border:1px solid #C8D3D4;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.rkpis span{font:600 7.5pt/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:#586A6C}

/* --bg, --mut and --acc were never tokens in this stylesheet, so the gate had
   no background of its own and the app showed straight through the login. */
#gate{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;place-items:center;
      padding:20px;overflow:auto}
#gate[hidden]{display:none!important}
.gatecard{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}

.gatecard input{width:100%;padding:11px 12px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--sheet);color:var(--ink);font:inherit}
.gatecard input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

.gmsg{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5}

         background:var(--panel);border:1px solid var(--flag);border-left:4px solid var(--flag);
         border-radius:12px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.28)}

.idlebox .btn{width:100%;justify-content:center}

}

'use strict';
/* ───────── DATA ─────────
   Slots are FIXED per case (6 × 500×1000, 10 × 500×500) and keep their position.
   An empty slot, or a missing module / PDU in a placed cabinet, is a reminder until refilled. */
/* ═══════════════ LIVE DATA (Supabase) ═══════════════
   Replaces the prototype's seed + localStorage store.
   S  = raw rows from the database (the truth)
   D  = the shape the rest of the page already speaks
   Every edit goes to the database through a function (srv), never straight into a table. */
const SB_URL = 'https://jeafknkwmaktgheyqbuq.supabase.co';
const SB_KEY = 'sb_publishable_1u3NPs-jwPjcfFEyXCS--Q_m5MMn7xt';   // safe in a browser
const SK = 'mah-admin-v1';
const STD = {L:6, S:10};
const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s||'').toUpperCase().replace(/\s+/g,' ').trim();
const ST_L = {in_stock:'In stock', out:'Out', repair:'Repair', lost:'Lost', installed:'Installed', retired:'Retired'};

const SB = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}})

let ROLE = 'none', MY = '', LIVE = false;
const S = {fc:[], assets:new Map(), rem:new Map(), wos:[], lines:[], bulk:[], events:[], repairs:[], wbulk:[]};
/* cables and accessories are counted by quantity, not by serial */
const bulkNameOf = code => { const b = S.bulk.find(x=>x.code===code); return b ? b.name : code; };
const bulkUnitOf = code => { const b = S.bulk.find(x=>x.code===code); return (b && b.unit) || 'pcs'; };
let D = {fcs:[], cabs:{}, spares:{}, parts:{}, flags:{}, notes:[], wos:[], hb:{}, log:[], src:'Supabase'};
let GS = {title:'Supabase', at:'', fcsheet:{}, acc:[], cables:[], cards:{}};

function normalizeFc(f){
  const src = f.slots||f.sn||[]; const capN = Math.max(STD[f.s]||6, src.length, f.cap||0);
  f.slots = Array.from({length:capN}, (_,i)=>src[i]||null);
  delete f.sn; delete f.c; f.note = f.note||''; return f;
}

/* ── fetch ─────────────────────────────────────────────── */
async function pageAll(table, cols, orderCol){
  let out = [], from = 0;
  for(;;){
    const {data, error} = await SB.from(table).select(cols).order(orderCol, {ascending:true}).range(from, from+999);
    if(error) throw new Error(table+': '+error.message);
    out = out.concat(data||[]);
    if(!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}

async function loadAll(){
  const [fc, assets, rem, wos, lines, bulk, events, reps, wbulk] = await Promise.all([
    pageAll('flight_cases','code,num,label,qr,size,capacity,note','code'),
    pageAll('assets','id,sn,kind,size,model,spec,group_name,status,cond,fc_code,fc_slot,parent_id,part_slot,current_wo,note','sn'),
    pageAll('reminders','id,kind,message,asset_id,fc_code,slot,wo_id,created_at,resolved_at','id').then(r=>r.filter(x=>!x.resolved_at)),
    pageAll('work_orders','id,name,location,responsible,start_date,end_date,status,notes,extras,created_at,completed_at,legacy,wo_no,wo_year','created_at'),
    pageAll('wo_lines','id,wo_id,asset_id,out_at,returned_at,return_status,return_cond,return_note','id'),
    /* retired_at arrives with 16_upgrade.sql; an older database simply has no
       retired counted items instead of a page that will not load */
    pageAll('bulk_items','code,name,category,sub,spec,unit,qr,qty_total,qty_out,qty_repair,note,sort,retired_at','sort')
      .catch(()=>pageAll('bulk_items','code,name,category,sub,spec,unit,qr,qty_total,qty_out,qty_repair,note,sort','sort')),
    SB.from('events').select('at,actor_name,action,sn,fc_code,wo_id').order('id',{ascending:false}).limit(25).then(r=>r.data||[]),
    /* open repair tickets — the view is added by 04_upgrade.sql; an older
       database simply shows no repair panel instead of breaking the page */
    SB.from('v_repairs').select('id,sn,kind,group_name,fc_code,fc_slot,vendor,fault,stage,days_open,days_at_vendor,wo_name,note')
      .is('back_at',null).order('days_open',{ascending:false}).limit(500)
      .then(r=>r.data||[], ()=>[]).catch(()=>[]),
    pageAll('wo_bulk','wo_id,item_code,qty_out,qty_returned,qty_damaged,qty_lost,note','wo_id')
  ]);
  S.fc = fc; S.wos = wos; S.lines = lines; S.bulk = bulk; S.events = events; S.repairs = reps||[]; S.wbulk = wbulk||[];
  S.assets = new Map(assets.map(a=>[a.id,a]));
  S.rem = new Map(rem.map(r=>[r.id,r]));
  buildD();
}

/* ── raw rows → the shape the page speaks ──────────────── */
function buildD(){
  const cabs = {}, spares = {}, parts = {}, hb = {}, byId = S.assets;
  const cabById = new Map();
  for(const a of byId.values()){
    if(a.kind === 'cabinet'){
      const c = {sn:a.sn, s:a.size||'L', pdu:'', mods:[], st:a.status, cd:a.cond, note:a.note||'', id:a.id, wo:a.current_wo||undefined, model:a.model||''};
      c.mods = Array.from({length: c.s==='S'?2:4}, ()=>'');
      cabs[a.sn] = c; cabById.set(a.id, c);
    } else if(a.kind === 'hanging_bar'){
      hb[a.sn] = {id:a.sn, sub:/500/.test(a.group_name||'')?'S':'L', st:a.status, wo:a.current_wo||''};
    }
  }
  for(const a of byId.values()){
    if(!a.parent_id) continue;
    const c = cabById.get(a.parent_id); if(!c) continue;
    if(a.part_slot === 0) c.pdu = a.sn;
    else if(a.part_slot >= 1 && a.part_slot <= c.mods.length) c.mods[a.part_slot-1] = a.sn;
    if(a.cond !== 'good' || (a.note||'')) parts[a.sn] = {cd:a.cond, note:a.note||''};
  }
  for(const a of byId.values()){
    if(a.parent_id || (a.kind !== 'module' && a.kind !== 'pdu')) continue;
    spares[a.sn] = {sn:a.sn, k:a.kind==='pdu'?'P':'M', st:a.status, sub:a.kind==='pdu'?'PDU':'Module', note:a.note||''};
  }
  /* how many cases there actually are — this used to be hard-coded as 156,
     which is not a number that has ever been true. */
  const fcTotal = S.fc.length;
  const fcs = S.fc.map(f=>{
    const slots = Array.from({length:f.capacity}, ()=>null);
    for(const a of byId.values()) if(a.fc_code === f.code && a.fc_slot >= 1 && a.fc_slot <= f.capacity) slots[a.fc_slot-1] = a.sn;
    return normalizeFc({n:f.code, l:String(f.num)+'/'+fcTotal, s:f.size, slots, cap:f.capacity, note:f.note||''});
  });

  /* reminders from the database → the page's flag map (empty slots / missing parts),
     everything else (verify a serial, duplicate serial, migration notes) goes to D.notes */
  const flags = {}, notes = [];
  const note = (r, rec) => notes.push(Object.assign({}, rec, {
    sn: r.asset_id && byId.get(r.asset_id) ? byId.get(r.asset_id).sn : '', fc:r.fc_code||'', wo:r.wo_id||''}));
  for(const r of S.rem.values()){
    const rec = {id:r.id, t:Date.parse(r.created_at)||Date.now(), text:r.message, kind:r.kind};
    const cab = r.asset_id ? cabById.get(r.asset_id) : null;
    let key = null;
    if(r.fc_code && r.slot != null){
      const f = fcs.find(x=>x.n === r.fc_code);
      if(f && !f.slots[r.slot-1]) key = 'fc:'+r.fc_code+':'+(r.slot-1);   // only while that slot is still empty
    }
    else if(cab && r.slot != null && (r.kind==='empty_slot'||r.kind==='dummy_blank'||r.kind==='duplicate_sn')){
      const filled = r.slot === 0 ? cab.pdu : cab.mods[r.slot-1];
      if(!filled) key = 'cab:'+cab.sn+':'+(r.slot===0?'PDU':'M'+r.slot);   // still empty → it is that slot's reminder
    }
    if(key && !flags[key]) flags[key] = rec; else note(r, rec);   // anything that has no empty slot of its own stays a note
  }

  const day = t => t ? String(t).slice(0,10) : '';
  const lineSn = id => { const a = byId.get(id); return a ? a.sn : null; };
  const wos = S.wos.map(w=>{
    const ls = S.lines.filter(l=>l.wo_id === w.id);
    const cs = [], its = [];
    ls.forEach(l=>{ const a = byId.get(l.asset_id); if(!a) return; (a.kind==='cabinet'?cs:its).push(a.sn); });
    /* how the job ended: what came back, and in what state — this is what the
       History view shows, so it has to survive the job being closed */
    let back = 0, rep = 0, lost = 0;
    ls.forEach(l=>{ if(!l.returned_at) return; back++;
      if(l.return_status === 'repair') rep++; else if(l.return_status === 'lost') lost++; });
    const lg = w.legacy||{};
    return {id:w.id, name:w.name, loc:w.location||'', resp:w.responsible||'', start:day(w.start_date), end:day(w.end_date),
      status:w.status==='active'?'active':w.status, created:day(w.created_at), completed:day(w.completed_at),
      cabs:cs, items:its.filter(sn=>hb[sn]), notes:w.notes||'', cables:lg.cables||{}, procs:lg.procs||{}, extras:w.extras||[],
      no:w.wo_no, year:w.wo_year, lines:ls.length, back, rep, lost,
      bulk:(S.wbulk||[]).filter(b=>b.wo_id === w.id && b.qty_out > 0)};
  }).sort((a,b)=>String(a.created).localeCompare(String(b.created)));

  D = {fcs, cabs, spares, parts, flags, notes, wos, hb, repairs:(S.repairs||[]), log:D.log||[], src:'Supabase · live'};

  /* the dashboard's "sheet" numbers, now computed from the live rows */
  const fcsheet = {};
  fcs.forEach(f=>{
    const cs = f.slots.map(s=>s&&cabs[s]).filter(Boolean);
    const out = cs.filter(c=>c.st==='out').length, rep = cs.filter(c=>c.st==='repair'||c.st==='lost').length;
    const wo = (cs.find(c=>c.st==='out'&&c.wo)||{}).wo || '';
    fcsheet[f.n] = [out===cs.length&&out?'out':rep?'repair':'in', out, rep, wo];
  });
  const cables = S.bulk.filter(b=>b.category==='cable').map(b=>[b.code, b.name, b.spec||'', b.qty_total, b.qty_out, b.qty_repair]);
  const acc = S.bulk.filter(b=>b.category!=='cable').map(b=>[b.code, b.name, b.qty_total, b.qty_out, b.qty_repair]);
  const proc = {};
  for(const a of byId.values()) if(a.kind==='processor'){
    const g = /CVT/i.test(a.model)?'PROC-02':'PROC-01';
    const p = proc[g] || (proc[g] = {name:a.model||g, total:0, out:0, repair:0});
    p.total++; if(a.status==='out') p.out++; if(a.status==='repair') p.repair++;
  }
  Object.entries(proc).forEach(([id,p])=>acc.push([id, p.name, p.total, p.out, p.repair]));
  const cards = {};
  ['recv_card','hub','psu'].forEach(k=>{ let n=0; for(const a of byId.values()) if(a.kind===k) n++; cards[k]=n; });
  /* the whole counted list, exactly as the database holds it — the inventory
     page groups it by category and sub-group, so nothing is left out */
  const bulk = S.bulk.map(b=>({...b, retired: !!b.retired_at}));
  GS = {title:'MAH LED database', at:new Date().toISOString().slice(0,10), fcsheet, acc, cables, cards, bulk};
}

/* ── writes: always through a database function ─────────── */
const cid = () => 'adm-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
let busy = 0;
function setBusy(n){ busy = Math.max(0, busy+n); document.body.classList.toggle('saving', busy>0); }

async function srv(fn, args, label){
  if(!SB) return false;
  setBusy(1);
  try{
    const {data, error} = await SB.rpc(fn, Object.assign({p_client_id:cid()}, args));
    if(error) throw new Error(error.message);
    if(data && data.ok === false){
      toast((label?label+' — ':'') + (data.msg||'the database refused this'));
      await reload(); return false;
    }
    return data || {ok:true};
  }catch(e){
    toast('Not saved: ' + e.message);
    await reload(); return false;
  }finally{ setBusy(-1); }
}

async function reload(){
  try{ await loadAll(); refresh(true); }catch(e){ toast('Reload failed: '+e.message); }
}

/* ── realtime ──────────────────────────────────────────── */
let rtT = null, chan = null;
function rtSoon(){ clearTimeout(rtT); rtT = setTimeout(()=>{ buildD(); refresh(true); }, 250); }

/* debounced refetches for the tables that change in bursts */
let lT = null, bT = null, pT = null;
function linesSoon(){
  clearTimeout(lT);
  lT = setTimeout(async ()=>{
    try{ S.lines = await pageAll('wo_lines','id,wo_id,asset_id,out_at,returned_at,return_status,return_cond,return_note','id'); rtSoon(); }
    catch(e){}
  }, 700);
}
function bulkSoon(){
  clearTimeout(bT);
  bT = setTimeout(async ()=>{
    try{ S.wbulk = await pageAll('wo_bulk','wo_id,item_code,qty_out,qty_returned,qty_damaged,qty_lost,note','wo_id'); rtSoon(); }
    catch(e){}
  }, 700);
}
function repairsSoon(){
  clearTimeout(pT);
  pT = setTimeout(async ()=>{
    try{
      const {data} = await SB.from('v_repairs')
        .select('id,sn,kind,group_name,fc_code,fc_slot,vendor,fault,stage,days_open,days_at_vendor,wo_name,note')
        .is('back_at', null).order('days_open', {ascending:false}).limit(500);
      S.repairs = data || []; rtSoon();
    }catch(e){}
  }, 700);
}
function subscribe(){
  if(!SB || chan) return;
  chan = SB.channel('mah-admin')
    .on('postgres_changes', {event:'*', schema:'public', table:'assets'}, p=>{
      if(p.eventType === 'DELETE'){ S.assets.delete(p.old.id); } else { S.assets.set(p.new.id, p.new); }
      rtSoon();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'reminders'}, p=>{
      if(p.eventType === 'DELETE' || (p.new && p.new.resolved_at)) S.rem.delete((p.new||p.old).id);
      else S.rem.set(p.new.id, p.new);
      rtSoon();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'work_orders'}, async p=>{
      const i = S.wos.findIndex(w=>w.id === (p.new||p.old).id);
      if(p.eventType === 'DELETE'){ if(i>=0) S.wos.splice(i,1); }
      else if(i>=0) S.wos[i] = p.new; else S.wos.push(p.new);
      rtSoon();
    })
    /* A crew scanning a truck fires one of these per item. Refetching the whole
       line table each time falls behind and the page looks stale, so collect
       them and refetch once the scanning pauses. */
    .on('postgres_changes', {event:'*', schema:'public', table:'wo_lines'}, ()=>linesSoon())
    .on('postgres_changes', {event:'*', schema:'public', table:'wo_bulk'}, ()=>bulkSoon())
    .on('postgres_changes', {event:'*', schema:'public', table:'repairs'}, ()=>repairsSoon())
    .on('postgres_changes', {event:'*', schema:'public', table:'bulk_items'}, p=>{
      const i = S.bulk.findIndex(b=>b.code === (p.new||p.old).code);
      if(p.eventType === 'DELETE'){ if(i>=0) S.bulk.splice(i,1); }
      else if(i>=0) S.bulk[i] = p.new;
      else if(p.new) S.bulk.push(p.new);   /* an item added on another screen */
      rtSoon();
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'events'}, p=>{
      S.events.unshift(p.new); S.events = S.events.slice(0,25);
      D.log.unshift({t:Date.parse(p.new.at)||Date.now(), text:evText(p.new)}); D.log = D.log.slice(0,80);
      rtSoon();
    })
    .subscribe(st=>{ LIVE = (st === 'SUBSCRIBED'); paintConn(); if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ chan=null; setTimeout(subscribe, 4000); } });
}
function evText(e){
  const who = e.actor_name ? ' · ' + e.actor_name : '';
  return (e.action||'change').replace(/_/g,' ') + ' ' + (e.sn || (e.fc_code?'FC '+e.fc_code:'') || e.wo_id || '') + who;
}

/* ── how long a session lasts ──────────────────────────────
   Thirty minutes without a touch, and no login carries from one day into the
   next. A minute's warning first, so nobody loses what they were typing.
   The Supabase project settings can do this too, but only on the Pro plan and
   only at the next token refresh — this works today and can warn. */
const IDLE_MS = 30 * 60 * 1000, WARN_MS = 60 * 1000;
let lastTouch = Date.now(), idleTick = null, signedOnDay = '';
const today = () => new Date().toLocaleDateString('en-CA');   // 2026-09-16, local

/* Signing out was landing straight back on the dashboard. Two reasons, and it
   needed both fixed: the auth listener reloaded the page the instant it saw
   SIGNED_OUT, which could beat Supabase to clearing its own stored token — so
   the reload read the old token and signed you back in. LEAVING stops the
   listener racing us, and the token is cleared by hand in case the sign-out
   call itself failed. */
let LEAVING = false;
async function endSession(why){
  if(LEAVING) return;
  LEAVING = true;
  if(idleTick){ clearInterval(idleTick); idleTick = null; }
  try{ sessionStorage.setItem(SK + '-why', why); }catch(e){}
  try{ await SB.auth.signOut(); }catch(e){}
  try{
    Object.keys(localStorage).forEach(k=>{ if(/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k); });
  }catch(e){}
  location.reload();
}

function idleWarn(left){
  let box = document.getElementById('idlebox');
  if(!box){
    box = document.createElement('div');
    box.id = 'idlebox'; box.className = 'idlebox'; box.setAttribute('role','alertdialog');
    box.innerHTML = `<b>Still there?</b>
      <p>Nobody has touched this page for a while. It will sign out in <span id="idleN"></span>
         seconds, so it is not left open on your stock.</p>
      <button class="btn primary" id="idleStay" type="button">Stay signed in</button>`;
    document.body.appendChild(box);
    box.querySelector('#idleStay').onclick = ()=>{ lastTouch = Date.now(); box.remove(); };
  }
  box.querySelector('#idleN').textContent = left;
}

function watchSession(){
  signedOnDay = today();
  const touch = ()=>{ lastTouch = Date.now();
    const b = document.getElementById('idlebox'); if(b) b.remove(); };
  ['pointerdown','keydown','wheel','touchstart'].forEach(e=>
    document.addEventListener(e, touch, {passive:true, capture:true}));

  idleTick = setInterval(()=>{
    /* a login does not carry from one day into the next */
    if(today() !== signedOnDay) return endSession('day');
    const idle = Date.now() - lastTouch;
    if(idle >= IDLE_MS) return endSession('idle');
    if(idle >= IDLE_MS - WARN_MS) idleWarn(Math.max(1, Math.ceil((IDLE_MS - idle) / 1000)));
  }, 5000);
}

function whySignedOut(){
  let why = '';
  try{ why = sessionStorage.getItem(SK + '-why') || ''; sessionStorage.removeItem(SK + '-why'); }catch(e){}
  if(why === 'idle') return 'You were signed out after 30 minutes without a touch. Sign in to carry on.';
  if(why === 'day')  return 'A login does not carry from one day into the next. Sign in to carry on.';
  if(why === 'asked') return 'Signed out. Sign in again whenever you need to.';
  return '';
}

async function boot(){
  if(!SB){ document.getElementById('gate').hidden = false;
    document.getElementById('gate').innerHTML = '<div class="gatecard"><h2>Offline</h2><p class="gmsg">The Supabase library did not load. Check the connection and reload.</p></div>';
    return; }
  const {data} = await SB.auth.getSession();
  /* Same trap as the phone had: reloading on any event with no session turns
     the sign-in page into a refresh loop, because Supabase fires one as soon
     as it subscribes. Reload only when the state actually changed. */
  SB.auth.onAuthStateChange((e, sess)=>{
    if(e === 'INITIAL_SESSION' || LEAVING) return;   // endSession does its own reload
    if(!sess){ if(MY) location.reload(); return; }   // signed out somewhere else
    if(!MY && e === 'SIGNED_IN') location.reload();  // just signed in at the door
  });
  if(!data || !data.session){ loginBox(whySignedOut()); return; }
  MY = data.session.user.email || '';
  document.getElementById('gate').hidden = true;
  try{
    const r = await SB.rpc('my_role'); ROLE = (r.error ? 'none' : r.data) || 'none';
    if(ROLE === 'none'){ loginBox('This login is not in the team list yet — ask Mah to add it.', true); return; }
    if(ROLE === 'crew'){ wrongDoor(); return; }
    /* the page dresses itself for the role before any of it is drawn */
    document.body.dataset.role = ROLE;
    watchSession();
    await loadAll();
    D.log = S.events.map(e=>({t:Date.parse(e.at)||Date.now(), text:evText(e)}));
    start();
    subscribe();
    paintConn();
  }catch(e){
    loginBox('Could not read the database: ' + e.message);
  }
}

const fcBy=n=>D.fcs.find(f=>f.n===n)||null;
function fcOf(sn){ if(!sn) return null; for(const f of D.fcs){ const i=f.slots.indexOf(sn); if(i>=0) return {f,i}; } return null; }
function ownMap(){ const m=new Map(); D.fcs.forEach(f=>f.slots.forEach((s,i)=>{ if(s) m.set(s,{f,i}); })); return m; }
function unassigned(){ const own=ownMap(); return Object.values(D.cabs).filter(c=>!own.has(c.sn)); }
const cap=f=>f.slots.length;
const filled=f=>f.slots.filter(Boolean).length;
const nMods=c=>c.s==='S'?2:4;
const sizeTxt=s=>s==='S'?'500×500':'500×1000';
const hhmm=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

/* reminders: derived from state; D.flags keeps when/why for each one */
const kSlot=(n,i)=>`fc:${n}:${i}`, kPart=(sn,p)=>`cab:${sn}:${p}`;
function flag(k,text){ D.flags[k]={t:Date.now(),text}; }
function unflag(k){ delete D.flags[k]; }
function reminders(){
  const out=[]; const own=ownMap();
  D.fcs.forEach(f=>f.slots.forEach((sn,i)=>{ if(!sn){ const k=kSlot(f.n,i); out.push({k,type:'slot',f,i,rec:D.flags[k]}); } }));
  Object.values(D.cabs).forEach(c=>{
    const placed=own.has(c.sn);
    for(let i=0;i<nMods(c);i++) if(!c.mods[i]){ const k=kPart(c.sn,'M'+(i+1)); if(placed||D.flags[k]) out.push({k,type:'mod',c,i,rec:D.flags[k],o:own.get(c.sn)}); }
    if(!c.pdu){ const k=kPart(c.sn,'PDU'); if(placed||D.flags[k]) out.push({k,type:'pdu',c,rec:D.flags[k],o:own.get(c.sn)}); }
  });
  return out;
}

function optTone(o){
  const v = String(o.v||''), l = String(o.l||'').toLowerCase();
  if(/^(kill|delete)/.test(v) || /delete|beyond repair|mark .*lost|retire/.test(l)) return 'o-bad';
  if(/^(close|reopen|settle|count|edit|plan|cancel):?/.test(v) ||
     /close|reopen|settle|count them|edit the job|cancel it/.test(l)) return 'o-job';
  if(/^(paper|creport|go|life)/.test(v) || /print|reprint|report|find it|whole life|open the/.test(l)) return 'o-read';
  if(/back in stock|came back fixed|turned up|bring it back|sent to the repairer/.test(l)) return 'o-good';
  return '';
}

/* the last word on what a role may be offered: whatever builds the list, an
   option that writes never reaches a view-only account, and an option that
   opens the Manage page never reaches someone who has no Manage page. */
const VIEW_SAFE = /^(paper|creport|go|life|find|__)/;
function forRole(opts){
  if(!Array.isArray(opts) || canEdit()) return opts;
  return opts.filter(o=>o && VIEW_SAFE.test(String(o.v||'')));
}

function dialog({title,text,html,opts,fields,ok,cancel='Cancel'}){
  opts = forRole(opts);
  return new Promise(res=>{
    const host=$('#dlgHost');
    host.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="card">
      <h4 id="dlgT">${esc(title)}</h4>${text?`<p>${text}</p>`:''}${html||''}
      ${fields?fields.map(f=>`<div class="fld"><label for="f_${f.id}">${esc(f.label)}</label>${f.options?`<select id="f_${f.id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${f.id}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off" spellcheck="false">`}</div>`).join(''):''}
      ${opts?`<div class="opts">${opts.map((o,i)=>`<button class="btn ${i===0&&!o.plain?'primary':''} ${optTone(o)}" data-o="${esc(o.v)}" type="button">${esc(o.l)}${o.d?`<small>${esc(o.d)}</small>`:''}</button>`).join('')}</div>`:''}
      <div class="acts"><button class="btn" data-o="__cancel" type="button">${esc(cancel)}</button>${ok?`<button class="btn primary" data-o="__ok" type="button">${esc(ok)}</button>`:''}</div>
    </div></div>`;
    const close=v=>{ host.innerHTML=''; res(v); };
    host.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.o;
      if(v==='__cancel') return close(null);
      if(v==='__ok'){ const o={}; (fields||[]).forEach(f=>o[f.id]=host.querySelector('#f_'+f.id).value); return close(o); }
      close(v);
    });
    host.querySelectorAll('[data-em]').forEach(el=>{
      el.onclick=()=>close('who:'+el.dataset.em);
      el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); close('who:'+el.dataset.em); } };
    });
    host.querySelectorAll('[data-dev]').forEach(el=>{
      el.onclick=()=>close('dev:'+el.dataset.dev);
      el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); close('dev:'+el.dataset.dev); } };
    });
    host.querySelector('.dlg').addEventListener('click',e=>{ if(e.target.classList.contains('dlg')) close(null); });
    const first=host.querySelector('input,.opts .btn'); if(first) first.focus();
    host.querySelector('.dlg').addEventListener('keydown',e=>{ if(e.key==='Escape') close(null); if(e.key==='Enter'&&ok&&e.target.tagName==='INPUT'){ e.preventDefault(); host.querySelector('[data-o="__ok"]').click(); } });
  });
}

async function placeCab(sn,slot){
  const f=fcBy(V.fc); const c=D.cabs[sn]; if(!f||!c) return;
  const old=f.slots[slot]; if(old===sn) return;
  if(c.s!==f.s){ toast(`${sn} is a ${sizeTxt(c.s)} cabinet — FC ${f.l} holds ${sizeTxt(f.s)}`); return; }
  const src=fcOf(sn);
  let mode='move';
  if(src&&src.f!==f&&old){
    mode=await dialog({title:'Cabinet comes from FC '+src.f.l,text:`<b>${esc(sn)}</b> goes into S${slot+1}. Where does <b>${esc(old)}</b> go?`,
      opts:[{v:'swap',l:'Swap — into FC '+src.f.l+' · S'+(src.i+1),d:'The two cabinets trade places'},{v:'move',l:'Move only — '+old+' becomes unassigned',d:'FC '+src.f.l+' · S'+(src.i+1)+' is flagged empty'}]});
    if(!mode) return;
  }
  V.slot=slot;
  commit(`FC ${f.l} S${slot+1} ← ${sn}${old?' · '+old+(mode==='swap'&&src&&src.f!==f?' → FC '+src.f.l:' → unassigned'):''}`,()=>{
    f.slots[slot]=sn; unflag(kSlot(f.n,slot));
    if(src&&src.f===f){ f.slots[src.i]=old||null; if(!old) flag(kSlot(f.n,src.i),`${sn} moved to S${slot+1}`); return; }
    if(src){ if(mode==='swap'&&old){ src.f.slots[src.i]=old; } else { src.f.slots[src.i]=null; flag(kSlot(src.f.n,src.i),`${sn} moved to FC ${f.l} · S${slot+1}`); } }
  });
  await srv('move_cabinet',{p_sn:sn,p_fc:f.n,p_slot:slot+1,p_mode:mode},'Move '+sn);
}

async function removeCab(slot){
  const f=fcBy(V.fc); const sn=f&&f.slots[slot]; if(!sn) return;
  const r=await dialog({title:`Remove ${sn} from FC ${f.l} · S${slot+1}?`,text:'The cabinet goes to <b>Unassigned</b>. The slot stays empty and is flagged as a reminder until a cabinet goes back in.',opts:[{v:'y',l:'Remove and flag the slot'}]});
  if(!r) return;
  commit(`${sn} removed from FC ${f.l} · S${slot+1} — ⚑ slot flagged`,()=>{ f.slots[slot]=null; flag(kSlot(f.n,slot),`${sn} removed`); });
  await srv('unplace_cabinet',{p_sn:sn,p_note:''},'Remove '+sn);
}
function unplaceDrop(sn){ const src=fcOf(sn); if(!src) return; V.fc=src.f.n; removeCab(src.i); }

async function swapModule(cabSn,from,to){
  const c=D.cabs[cabSn]; if(!c||from===to) return;
  const moving=(c.mods||[])[from]||''; if(!moving){ toast('That slot is empty'); return; }
  commit(`${cabSn}: M${from+1} ⇄ M${to+1}`,()=>{ const m=c.mods.slice(); while(m.length<nMods(c)) m.push(''); [m[from],m[to]]=[m[to],m[from]]; c.mods=m;
    [from,to].forEach(i=>{ if(m[i]) unflag(kPart(cabSn,'M'+(i+1))); else flag(kPart(cabSn,'M'+(i+1)),`Module moved to M${(i===from?to:from)+1}`); }); });
  await srv('fit_part',{p_cab_sn:cabSn,p_slot:to+1,p_part_sn:moving,p_mode:'swap'},'Move module');
}
async function fateOf(oldSn,what,flagged){
  if(!oldSn) return 'none';
  return dialog({title:'What happens to the removed '+what+'?',text:`<b>${esc(oldSn)}</b>${flagged?`<br>The ${esc(flagged)} is flagged as a reminder until a new ${what} is fitted.`:''}`,
    opts:[{v:'repair',l:'Send to repair',d:'Listed as Repair in the library'},{v:'in_stock',l:'Good — back to spare stock',d:'Available to fit into another cabinet',plain:true},{v:'lost',l:'Mark lost',plain:true}]});
}
function shelve(sn,kind,st,note){ if(!sn) return; D.spares[sn]={sn,k:kind,st,sub:kind==='P'?'PDU':'Module',note}; }

async function fitModule(cabSn,slot,newSn){
  const c=D.cabs[cabSn]; if(!c) return;
  const m=c.mods.slice(); while(m.length<nMods(c)) m.push('');
  const old=m[slot]||''; if(norm(old)===norm(newSn)) return;
  const fate=await fateOf(old,'module'); if(!fate) return;
  commit(`${cabSn} M${slot+1}: ${newSn} in${old?' · '+old+' → '+(ST_L[fate]||fate):''}`,()=>{
    m[slot]=newSn; c.mods=m; unflag(kPart(cabSn,'M'+(slot+1)));
    if(D.spares[newSn]){ D.spares[newSn].st='installed'; D.spares[newSn].note='Installed in '+cabSn+' M'+(slot+1); }
    if(old) shelve(old,'M',fate,'Removed from '+cabSn+' M'+(slot+1));
  });
  const ok=await srv('fit_part',{p_cab_sn:cabSn,p_slot:slot+1,p_part_sn:newSn,p_mode:'move',p_create:true},'Fit '+newSn);
  if(ok&&old&&fate!=='in_stock') await srv('set_status',{p_sn:old,p_status:fate,p_note:'Removed from '+cabSn+' M'+(slot+1)},old);
}

async function removeModule(cabSn,slot){
  const c=D.cabs[cabSn]; const old=(c.mods||[])[slot]; if(!old) return;
  const fate=await fateOf(old,'module','M'+(slot+1)); if(!fate) return;
  commit(`${cabSn} M${slot+1}: ${old} removed → ${ST_L[fate]} — ⚑ flagged`,()=>{ const m=c.mods.slice(); m[slot]=''; c.mods=m; shelve(old,'M',fate,'Removed from '+cabSn+' M'+(slot+1)); flag(kPart(cabSn,'M'+(slot+1)),`${old} removed → ${ST_L[fate]}`); });
  await srv('remove_part',{p_cab_sn:cabSn,p_slot:slot+1,p_status:fate,p_note:'Removed from '+cabSn+' M'+(slot+1)},'Remove '+old);
}

async function fitPdu(cabSn,newSn){

async function removePdu(cabSn){

async function showReminders(){
  const all=reminders();
  const notes=(D.notes||[]).slice();
  if(!all.length&&!notes.length){ toast('No reminders — every slot is filled'); return; }
  const opts=all.slice(0,40).map(r=>({v:r.k,plain:true,
    l:r.type==='slot'?`FC ${r.f.l} · S${r.i+1} empty`:`${r.c.sn} · ${r.type==='pdu'?'PDU':'M'+(r.i+1)} missing${r.o?' (FC '+r.o.f.l+' · S'+(r.o.i+1)+')':''}`,
    d:r.rec?`${r.rec.text} · ${hhmm(r.rec.t)}`:'Empty since the import'}))
   .concat(notes.slice(0,30).map(n=>({v:'note:'+n.id,plain:true,l:(n.sn||n.fc&&('FC '+n.fc)||'Check')+' · '+n.kind.replace(/_/g,' '),d:n.text})));
  const k=await dialog({title:`⚑ ${all.length+notes.length} reminder${all.length+notes.length>1?'s':''}`,
    text:'Empty slots, missing parts and the checks from the import. Pick one to go to it or mark it done.',opts,cancel:'Close'});
  if(!k) return;
  if(k.startsWith('note:')){
    const n=notes.find(x=>String(x.id)===k.slice(5)); if(!n) return;
    const a=await dialog({title:n.kind.replace(/_/g,' '),text:esc(n.text),opts:[{v:'done',l:'Mark done',d:'Takes it off the list'},{v:'go',l:'Find the item',plain:true}]});
    if(a==='done'){ await srv('resolve_reminder',{p_id:n.id,p_note:'Done on the website'},'Reminder'); await reload(); }
    else if(a==='go'&&n.sn){ V.q=n.sn; const qi=$('#q'); if(qi) qi.value=n.sn; setPage('manage'); refresh(false); }
    return;
  }
  const r=all.find(x=>x.k===k); if(!r) return;
  if(r.rec&&r.rec.id){
    const a=await dialog({title:'Reminder',text:esc(r.rec.text),opts:[{v:'go',l:'Go to the slot'},{v:'done',l:'Mark done',d:'Takes it off the list',plain:true}]});
    if(!a) return;
    if(a==='done'){ await srv('resolve_reminder',{p_id:r.rec.id,p_note:'Done on the website'},'Reminder'); await reload(); return; }
  }
  if(r.type==='slot'){ V.view='fc'; V.fc=r.f.n; V.cab=null; V.open=true; V.slot=r.i; setPage('manage'); refresh(true); }
  else { const o=fcOf(r.c.sn); if(o) V.fc=o.f.n; setPage('manage'); openCab(r.c.sn,r.type==='pdu'?'PDU':'M'+(r.i+1)); }
}

/* ───────── LOCATE (header search) ───────── */
function locate(q){
  const u=norm(q); if(!u) return [];
  const out=[]; const push=o=>{ if(out.length<60) out.push(o); };
  const fcNum=u.replace(/^FC\s*0*/,'').replace(/\/156$/,'');
  D.fcs.forEach(f=>{ if(/^\d+$/.test(fcNum)&&parseInt(f.n,10)===parseInt(fcNum,10) || norm(f.l)===u) push({k:'fc',f}); });
  const own=ownMap();
  for(const c of Object.values(D.cabs)){
    const o=own.get(c.sn);
    if(norm(c.sn).includes(u)) push({k:'cab',c,o});
    else if(norm(c.pdu).includes(u)) push({k:'pdu',c,o});
    else { const mi=(c.mods||[]).findIndex(m=>norm(m).includes(u)); if(mi>=0) push({k:'mod',c,o,mi}); }
  }
  for(const s of Object.values(D.spares)){ if(s.st!=='installed'&&norm(s.sn).includes(u)) push({k:'spare',s}); }
  return out;
}
const whereTxt=o=>o?`<em>FC ${esc(o.f.l)}</em> · S${o.i+1}`:'<em>unassigned</em>';

/* the repair panel only holds what is open; from a chip we may be looking at
   an item whose ticket is filtered out, so go to the database for it */
async function repairFor(sn){
  if(!mayAct()) return;
  const r = (D.repairs||[]).find(x=>x.sn === sn);
  if(r) return repairAction(sn);
  const d = await rpc('item_life', {p_sn:sn});
  if(!d || d.ok === false) return toast('No repair open on '+sn);
  const open = (d.repairs||[]).find(x=>!x.back);
  if(!open) return toast(sn+' has no open repair');
  RP.list = (RP.list||[]).concat([{sn, stage:open.sent?'at_vendor':'waiting', vendor:open.vendor||'',
    fault:open.fault||'', days_open:open.days||0, days_at_vendor:null, kind:d.kind, group_name:d.group_name}]);
  return repairAction(sn);
}

/* picking + orbit */
const ray=hasGL?new THREE.Raycaster():null; const ptr=new Map(); let down=null, pinch0=null;
function pickAt(e){ if(!hasGL) return null; const r=cv.getBoundingClientRect(); const v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(v,camera); const hits=ray.intersectObjects(picks.filter(p=>{ let o=p; while(o){ if(o.visible===false) return false; o=o.parent; } return true; }),false); return hits.length?hits[0].object.userData.pick:null; }
if(hasGL){
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); down={x:e.clientX,y:e.clientY,th:O.theta,ph:O.phi,moved:false}; if(ptr.size===2){ const [a,b]=[...ptr.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),r:O.r}; } });
cv.addEventListener('pointermove',e=>{
  if(ptr.has(e.pointerId)) ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2&&pinch0){ const [a,b]=[...ptr.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); O.r=Math.max(0.6,Math.min(8,pinch0.r*pinch0.d/Math.max(20,d))); down&&(down.moved=true); invalidate(); return; }
  if(down&&ptr.size===1){ const dx=e.clientX-down.x, dy=e.clientY-down.y; if(Math.hypot(dx,dy)>5) down.moved=true; if(down.moved){ O.theta=down.th-dx*0.008; O.phi=Math.max(0.08,Math.min(1.62,down.ph-dy*0.006)); invalidate(); } return; }
  if(e.pointerType==='mouse'){ const p=pickAt(e); cv.classList.toggle('hot',!!p&&!(p.t==='part'&&p.p==='FRAME')); }
});
const up=e=>{ ptr.delete(e.pointerId); if(ptr.size<2) pinch0=null; if(down&&!down.moved&&ptr.size===0) click3D(e); if(ptr.size===0) down=null; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',e=>{ ptr.delete(e.pointerId); down=null; pinch0=null; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); O.r=Math.max(0.6,Math.min(8,O.r*(1+Math.sign(e.deltaY)*0.08))); invalidate(); },{passive:false});
}
function click3D(e){
  const p=pickAt(e); if(!p) return;
  if(p.t==='case'){ if(!V.open){ V.open=true; animateLid(true); renderChrome(); } return; }
  if(p.t==='slot'){ V.slot=p.i; renderPanel(); build3D(); toast('⚑ S'+(p.i+1)+' is empty — drag a cabinet from the Library into it'); return; }
  if(p.t==='cab'){
    const m=cabMeshes.find(g=>g.userData.sn===p.sn); V.slot=p.i;
    if(m&&!reduce){ const y0=m.position.y; tween(380,k=>{ m.position.y=y0+0.35*k; },()=>openCab(p.sn)); } else openCab(p.sn);
    return;
  }
  if(p.t==='part'){ if(p.p==='FRAME'){ V.part=null; } else V.part=V.part===p.p?null:p.p; renderPanel(); renderChrome(); build3D(); }
}

const M2={L:0.5,S:0.25};
const TODAY=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
const dt=s=>s?new Date(s+'T00:00:00+07:00').getTime():NaN;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=s=>{ if(!s) return '—'; const [y,m,d]=s.split('-').map(Number); return d+' '+MON[m-1]; }; // dates are stored as Bangkok calendar days
const nf=n=>Number(n).toLocaleString('en-GB');
const woBy=id=>D.wos.find(w=>w.id===id)||null;
function woSpan(w){ const a=w.start||w.created; let b=w.end||w.completed||a; if(dt(b)<dt(a)) b=a; return [a,b]; }
function woDates(w){ const [a,b]=woSpan(w); return a===b?fmtD(a):fmtD(a)+' – '+fmtD(b); }
function fcState(f){
  const cs=f.slots.map(s=>s&&D.cabs[s]); const n=cs.filter(Boolean).length;
  const o=cs.filter(c=>c&&c.st==='out').length, r=cs.filter(c=>c&&(c.st==='repair'||c.st==='lost')).length, e=f.slots.filter(s=>!s).length;
  return {o,r,e,n,state:r?'repair':o&&o===n?'out':o?'partial':e?'flag':'in'};
}
function countSt(arr){ const m={in_stock:0,out:0,repair:0,lost:0}; arr.forEach(s=>{ if(s in m) m[s]++; }); return m; }
function attention(){
  const out=[]; const active=D.wos.filter(w=>w.status==='active');
  active.forEach(w=>{ const [,b]=woSpan(w); const n=w.cabs.filter(s=>D.cabs[s]&&D.cabs[s].st==='out').length; const late=dt(b)<dt(TODAY);
    out.push({sev:late?'crit':'info',t:`${w.name} — ${late?'overdue since':'due back'} ${fmtD(b)}`,d:`${n} cabinets out · ${w.items.length} hanging bars · ${w.loc}`,go:'wo:'+w.id}); });
  // items still marked out after a work order was closed (the database raises these as check_stale reminders)
  const staleFc={}; Object.entries(GS.fcsheet).forEach(([n,[st,no,nr,wo]])=>{ const w=woBy(wo); if(st==='out'&&w&&w.status!=='active'){ (staleFc[wo]=staleFc[wo]||{n:0,fcs:[]}); staleFc[wo].n+=no; staleFc[wo].fcs.push(parseInt(n,10)); } });
  Object.entries(staleFc).forEach(([wo,x])=>{ const w=woBy(wo); out.push({sev:'warn',t:`${x.n} cabinets still out on ${w.name}`,d:`Closed ${fmtD(w.completed)} · FC ${x.fcs.join(', ')} — the return scan is missing`,go:'wo:'+wo}); });
  const staleHb={}; Object.values(D.hb).forEach(h=>{ const w=woBy(h.wo); if(h.st==='out'&&w&&w.status!=='active'){ staleHb[h.wo]=(staleHb[h.wo]||0)+1; } });
  Object.entries(staleHb).forEach(([wo,n])=>{ const w=woBy(wo); out.push({sev:'warn',t:`${n} hanging bars still marked Out on ${w.name}`,d:`Closed ${fmtD(w.completed)} — the return scan is missing`,go:'wo:'+wo}); });
  const repFc=Object.entries(GS.fcsheet).filter(([n,v])=>v[2]>0).map(([n])=>parseInt(n,10));
  const repCab=Object.values(D.cabs).filter(c=>c.st==='repair'||c.st==='lost');
  if(repFc.length||repCab.length) out.push({sev:'warn',t:`${Math.max(repFc.length,repCab.length)} cabinets in repair`,d:(repFc.length?`FC ${repFc.join(', ')}`:'')+(repCab.length?` · known serials: ${repCab.map(c=>c.sn).join(', ')}`:''),go:repCab[0]?'cab:'+repCab[0].sn:null,fix:'repairs',fixL:'Open the repair list'});
  active.forEach(w=>{ const m=/(\d+)\s*pcs/i.exec(w.notes||''); if(m&&+m[1]!==w.cabs.length) out.push({sev:'warn',t:`${w.name}: note says ${m[1]} cabinets, WO lists ${w.cabs.length}`,d:`“${w.notes}”`,go:'wo:'+w.id}); });
  /* any finished job still holding something — counted from the job itself, so
     a flight case that is only half stuck is caught too */
  D.wos.filter(w=>w.status!=='active'&&(w.lines||0)>(w.back||0)).forEach(w=>{
    const n=(w.lines||0)-(w.back||0);
    out.push({sev:'warn',t:`${n} item${n===1?'':'s'} never scanned back on ${w.name}`,
      d:`Closed ${w.completed?fmtD(w.completed):'—'} — ${n===1?'it is':'they are'} still counted as out, so ${n===1?'it':'they'} cannot go on another job`,
      go:'wo:'+w.id, fix:'settle:'+w.id, fixL:`Settle ${n===1?'it':'them'}`}); });
  const rem=reminders().length; if(rem) out.push({sev:'info',t:`⚑ ${rem} reminder${rem>1?'s':''} — empty slots / missing parts`,d:'Open the list to refill them',go:'rem',fix:'rem',fixL:'Open the list'});
  const prob=Object.values(D.parts||{}).filter(p=>p.cd==='damaged').length; if(prob) out.push({sev:'warn',t:`${prob} module/PDU marked Problem`,d:'Set in the part status editor',go:null});
  return out;
}
