/* ── the master schedule ───────────────────────────────────────────────────
   A day grid, not a month bar. One column per day, so two jobs three days
   apart stop looking identical; the week line is heavier than the day line,
   weekends are shaded, and the job's name rides in its own bar. */
const SCHED_ROWS = 12;
let schedOpen = false;
const MN3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYMS = 86400000;
/* "Capella Hotel" and "capella  hotel" are the same place */
const venueKey = w => String(w.loc||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

/* two days of run-up, four weeks ahead, stretched to finish a job that runs past the edge */
function schedWindow(){
  const t = dt(TODAY), d0 = t - 2*DAYMS;
  let d1 = d0 + 29*DAYMS;
  D.wos.forEach(w=>{ const [a,b]=woSpan(w);
    if(w.status!=='cancelled' && dt(a)>=d0 && dt(a)<=d1 && dt(b)>d1) d1 = Math.min(d0 + 59*DAYMS, dt(b)); });
  return [d0, d1];
}
function schedJobs(d0, d1){
  return D.wos.filter(w=>{ const [a,b]=woSpan(w);
      return w.status!=='cancelled' && dt(b)>=d0 && dt(a)<=d1; })
    .sort((a,b)=>dt(woSpan(a)[0])-dt(woSpan(b)[0]) || String(a.name).localeCompare(String(b.name)));
}
/* the thing that bites on the day: two jobs at one place at one time */
function schedClash(js){
  const hit = new Set();
  js.forEach((a,i)=>js.forEach((b,k)=>{
    if(k<=i) return;
    const ka = venueKey(a); if(!ka || ka !== venueKey(b)) return;
    const [a1,a2]=woSpan(a), [b1,b2]=woSpan(b);
    if(dt(a1)<=dt(b2) && dt(b1)<=dt(a2)){ hit.add(a.id); hit.add(b.id); }
  }));
  return hit;
}
function schedHTML(){
  const [d0,d1] = schedWindow(), N = Math.round((d1-d0)/DAYMS)+1;
  const all = schedJobs(d0,d1), clash = schedClash(all);
  const shown = schedOpen ? all : all.slice(0, SCHED_ROWS);
  const colOf = t => Math.max(1, Math.min(N, Math.round((t-d0)/DAYMS)+1));

  let cells=''; for(let i=0;i<N;i++){ const wd=new Date(d0+i*DAYMS).getUTCDay();
    cells += `<div class="g${wd===1?' wk':''}${(wd===0||wd===6)?' we':''}"></div>`; }

  let head = '<div class="srow shead"><div class="sgut">Job / Venue</div>';
  for(let i=0;i<N;i++){ const d=new Date(d0+i*DAYMS), wd=d.getUTCDay();
    head += `<div class="scell${wd===1?' wk':''}"><div class="sd">${d.getUTCDate()}</div>`+
            `<div class="sm">${wd===1?MN3[d.getUTCMonth()]:'&nbsp;'}</div></div>`; }
  head += '</div>';

  const rows = shown.map(w=>{
    const [a,b]=woSpan(w);
    const c1=colOf(dt(a)), c2=Math.max(c1+1, Math.min(N+1, colOf(dt(b))+1));
    const st = w.status==='active' ? '' : w.status==='completed' ? ' done' : ' booked';
    const cl = clash.has(w.id) ? ' clash' : '';
    const tip = esc(`${w.name} · ${w.loc} · ${woDates(w)} · ${w.cabs.length} cabinets · ${nf(woM2(w))} m² · ${
      w.status==='active'?'out now':w.status==='completed'?'finished':'booked'}${
      clash.has(w.id)?' · another job at the same place':''}`);
    /* one or two days is narrower than the job's own name, so the name goes
       beside the bar — after it, or before it when the bar ends at the edge */
    const tiny = (c2 - c1) < 4, after = c2 <= N - 5;
    const label = tiny
      ? `<span class="sout ${after?'aft':'bef'}" style="grid-column:${after?`${c2}/-1`:`1/${c1}`}">${
          esc(w.name)}${w.cabs.length?` · ${w.cabs.length}`:''}</span>`
      : '';
    return `<div class="srow sjob">
      <div class="sgut"><span class="sn">${esc(w.name)}</span><span class="sv">${esc(w.loc||'—')}</span></div>
      <div class="slane">${cells}<button type="button" class="sbar${st}${cl}${tiny?' tiny':''}" data-go="wo:${w.id}"
        style="--c:${woColor(w)};grid-column:${c1}/${c2}" data-tip="${tip}"
        >${tiny?'':`<span class="sl">${esc(w.name)}</span>${w.cabs.length?`<span class="sq">${w.cabs.length}</span>`:''}`}</button>${label}</div></div>`;
  }).join('') || '<div class="srow sjob"><div class="snone">No job falls in these four weeks.</div></div>';

  const tx = `calc(var(--sgut) + ${colOf(dt(TODAY))-0.5} * var(--sday))`;
  return `<div class="tlwrap" id="schedScroll"><div class="sched" style="--n:${N}">${head}${rows}
      <div class="sline" style="left:${tx}"></div>
      <div class="sflag" style="left:${tx}">${fmtD(TODAY)}</div></div></div>
    <div class="slegend">
      <span><i class="ssw"></i>Out now</span>
      <span><i class="ssw bk"></i>Booked — not out yet</span>
      <span><i class="ssw dn"></i>Finished</span>
      <span><i class="ssw cl"></i>Same place, same day</span>
      <span class="sright"><b>${shown.length} of ${all.length}</b> job${all.length===1?'':'s'}${
        clash.size?` · <b class="scl">${clash.size} in a clash</b>`:''}
        <button class="btn sm" id="bToday" type="button">Today</button>
        ${all.length>SCHED_ROWS?`<button class="btn sm" id="bSched" type="button">${schedOpen?'Collapse ▴':'Expand ▾'}</button>`:''}</span>
    </div>`;
}
function bindSched(){
  const b = document.getElementById('bSched');
  if(b) b.onclick = ()=>{ schedOpen = !schedOpen; renderDash(); };
  const t = document.getElementById('bToday');

}

/* ═══ §31 · Export to Excel ═══════════════════════════════════════════════
   A .xlsx file is a zip of XML parts. Writing one by hand keeps this page
   free of a spreadsheet library it would otherwise have to fetch from the
   internet every time somebody wants a stock sheet — and stored (uncompressed)
   zip entries are perfectly legal, so there is no deflate to implement either.

   The file is a SNAPSHOT of the moment you press the button. It cannot update
   itself — a file on your disk has no connection to the database. That is why
   the sheet says when it was taken, and why the button is one click: take a
   fresh one whenever you need one. The live picture is this page. */

const CRC32 = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0; }
  return b => { let c = 0xFFFFFFFF;
    for(let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0; };
})();

/* Squeeze a part if the browser has a deflate stream — it takes a 3 MB book
   down to about 300 KB. Where it is missing the part is stored as-is, which
   is still a perfectly legal zip entry, just a fatter one. */
async function deflate(bytes){
  if(typeof CompressionStream !== 'function') return null;
  try{
    const cs = new CompressionStream('deflate-raw');
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
    const out = new Uint8Array(buf);
    return out.length < bytes.length ? out : null;
  }catch(e){ return null; }
}

async function zipStore(files){
  const enc = new TextEncoder(), parts = [], dir = [];
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  let off = 0;
  for(const f of files){
    const name = enc.encode(f.name), raw = f.data, crc = CRC32(raw), n = raw.length;
    const packed = await deflate(raw);
    const data = packed || raw, method = packed ? 8 : 0, cn = data.length;
    const hdr = Uint8Array.from([0x50,0x4b,3,4, ...u16(20), ...u16(0), ...u16(method),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(cn), ...u32(n),
      ...u16(name.length), ...u16(0)]);
    parts.push(hdr, name, data);
    dir.push({name, crc, n, cn, method, off});
    off += hdr.length + name.length + cn;
  }
  const cd = []; let cdLen = 0;
  dir.forEach(d => {
    const h = Uint8Array.from([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0),
      ...u16(d.method), ...u16(0), ...u16(0), ...u32(d.crc), ...u32(d.cn), ...u32(d.n),
      ...u16(d.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(d.off)]);
    cd.push(h, d.name); cdLen += h.length + d.name.length;
  });
  const end = Uint8Array.from([0x50,0x4b,5,6, ...u16(0), ...u16(0),
    ...u16(dir.length), ...u16(dir.length), ...u32(cdLen), ...u32(off), ...u16(0)]);
  const all = parts.concat(cd, [end]);
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
  let p = 0; all.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}

const xesc = v => String(v == null ? '' : v)
  .replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
const colRef = i => { let s = '', n = i + 1;
  while(n){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s; };

/* one sheet: first row is the heading, frozen, with a filter on it so the
   whole thing can be sorted and searched in Excel without any setup */
function sheetXml(rows){
  const wide = (rows[0] || []).map((_, j) => Math.min(58, Math.max(9,
    ...rows.slice(0, 400).map(r => String(r[j] == null ? '' : r[j]).length + 2))));
  const body = rows.map((r, i) => '<row r="' + (i + 1) + '">' + r.map((c, j) => {
    const ref = colRef(j) + (i + 1);
    if(typeof c === 'number' && isFinite(c)) return `<c r="${ref}"><v>${c}</v></c>`;
    const t = xesc(c);
    if(t === '') return '';
    return `<c r="${ref}" t="inlineStr"${i === 0 ? ' s="1"' : ''}><is><t xml:space="preserve">${t}</t></is></c>`;
  }).join('') + '</row>').join('');
  const last = colRef(Math.max(0, (rows[0] || []).length - 1)) + Math.max(1, rows.length);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${wide.map((w, j) => `<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join('')}</cols>
<sheetData>${body}</sheetData>
<autoFilter ref="A1:${last}"/></worksheet>`;
}

async function xlsxBook(sheets){
  const enc = new TextEncoder(), B = s => enc.encode(s);
  const files = [
    {name:'[Content_Types].xml', data: B(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`)},
    {name:'_rels/.rels', data: B(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)},
    {name:'xl/workbook.xml', data: B(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s, i) =>
  `<sheet name="${xesc(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)},
    {name:'xl/_rels/workbook.xml.rels', data: B(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((_, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`)},
    {name:'xl/styles.xml', data: B(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
</styleSheet>`)}
  ];
  sheets.forEach((s, i) => files.push({name:`xl/worksheets/sheet${i+1}.xml`, data: B(sheetXml(s.rows))}));
  return zipStore(files);
}

/* ── what goes in the book ───────────────────────────────────────────────── */
const ST_X = {in_stock:'In stock', out:'Out on a job', repair:'In repair',
              lost:'Lost', retired:'Retired', installed:'Fitted in a cabinet'};
const KIND_X = {cabinet:'Cabinet', module:'Module', pdu:'PDU', psu:'PSU',
                hanging_bar:'Hanging bar', processor:'Processor', case:'Flight case',
                recv_card:'Receiving card', hub:'HUB board', frame:'Frame (blank cabinet)',
                reset_wheel:'Reset wheel'};

async function invWorkbook(){
  const when = nowBkk();
  const woName = id => { const w = S.wos.find(x => x.id === id); return w ? w.name : (id || ''); };

  /* 1 · the sheet you actually count against */
  const sum = [['Group','Sub-group','Item','Code','Unit','Own','In stock','Out','Repair','Lost','Counted how']];
  invRows().forEach(r => sum.push([
    INV_GN[r.g] || r.g, r.sub, r.name + (r.retired ? ' (retired)' : ''), r.code || '',
    r.counted ? (r.unit || 'pcs') : 'each',
    r.total, r.in_stock, r.out, r.repair, r.lost || 0,
    r.counted ? 'By quantity' : 'By serial']));

  /* 2 · every serialised item, one row each */
  const ser = [['Serial','Type','Model / group','Status','Condition','Flight case','Slot','On job','Fitted in','Note']];
  const byId = S.assets;
  [...byId.values()].sort((a, b) => String(a.sn).localeCompare(String(b.sn))).forEach(a => {
    const par = a.parent_id ? byId.get(a.parent_id) : null;
    ser.push([a.sn, KIND_X[a.kind] || a.kind, a.group_name || a.model || '',
      ST_X[a.status] || a.status, a.cond || '',
      a.fc_code ? 'FC ' + parseInt(a.fc_code, 10) : '', a.fc_slot || '',
      a.current_wo ? woName(a.current_wo) : '', par ? par.sn : '', a.note || '']);
  });

  /* 3 · everything counted by quantity */
  const blk = [['Code','Item','Spec','Category','Sub-group','Unit','Own','Out','Repair','Free','Retired','Note']];
  (S.bulk || []).slice()
    .sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name)))
    .forEach(b => blk.push([b.code, b.name, b.spec || '', b.category || '', b.sub || '',
      b.unit || 'pcs', b.qty_total || 0, b.qty_out || 0, b.qty_repair || 0,
      Math.max(0, (b.qty_total || 0) - (b.qty_out || 0) - (b.qty_repair || 0)),
      b.retired_at ? 'yes' : '', b.note || '']));

  /* 4 · the flight cases and how full they are */
  const fcs = [['Flight case','Label','Size','Slots','Filled','Empty','Out on a job','Note']];
  (S.fc || []).slice().sort((a, b) => (a.num || 0) - (b.num || 0)).forEach(f => {
    const cab = [...byId.values()].filter(a => a.fc_code === f.code);
    fcs.push(['FC ' + f.num, f.label || '', f.size || '', f.capacity || 0, cab.length,
      Math.max(0, (f.capacity || 0) - cab.length),
      cab.filter(a => a.status === 'out').length, f.note || '']);
  });

  /* 5 · what is out right now, and on what */
  const outn = [['Serial','Type','Model / group','Work order','Location','Out since']];
  const openWo = new Map(S.wos.filter(w => w.status === 'active' || w.status === 'draft').map(w => [w.id, w]));
  const outBody = [];
  S.lines.filter(l => !l.returned_at && openWo.has(l.wo_id)).forEach(l => {
    const a = byId.get(l.asset_id); if(!a) return;
    const w = openWo.get(l.wo_id);
    outBody.push([a.sn, KIND_X[a.kind] || a.kind, a.group_name || a.model || '',
      w.name, w.location || '', (l.out_at || '').slice(0, 10)]);
  });
  /* sort the rows, never the heading — it has to stay on row 1 */
  outBody.sort((a, b) => String(a[3]).localeCompare(String(b[3]))
                      || String(a[0]).localeCompare(String(b[0])));
  outBody.forEach(r => outn.push(r));

  const head = [['Cosmos LED Management — stock export'], ['Taken', when],
    ['', ''], ['This file is a snapshot of the moment it was exported.'],
    ['It does not update itself. Export again for a fresh one — the live picture is the website.'],
    ['', ''], ['Sheet','What is on it'],
    ['Stock check','Every line of the inventory, the way the website shows it'],
    ['Serial items','One row per serialised item — cabinets, bars, processors, modules'],
    ['Cables & parts','Everything counted by quantity'],
    ['Flight cases','Each case, how full it is, how many are out'],
    ['Out right now','What is on an open job today']];

  return await xlsxBook([
    {name:'Read me',       rows: head},
    {name:'Stock check',   rows: sum},
    {name:'Serial items',  rows: ser},
    {name:'Cables & parts',rows: blk},
    {name:'Flight cases',  rows: fcs},
    {name:'Out right now', rows: outn}
  ]);
}

async function invExport(){
  try{
    const bytes = await invWorkbook();
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `Cosmos stock ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}.xlsx`;
    const url = URL.createObjectURL(new Blob([bytes],
      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Exported — ' + name);
  }catch(e){ toast('Could not build the file: ' + e.message); }
}

function invRows(){
  const cabs=Object.values(D.cabs), own=ownMap();
  const rows=[];
  /* serialised things are counted from the items themselves; s = the order
     inside a group, and they sit above the counted lines */
  const add=r=>rows.push({sub:'', spec:'', code:'', counted:false, retired:false, lost:0, s:-1, ...r});
  const cab=s=>{ const a=cabs.filter(c=>c.s===s); return {...countSt(a.map(c=>c.st)),total:a.length}; };
  add({g:'LED',sub:'Cabinets',name:'Cabinet 500×1000',...cab('L'),unit:`${nf(cabs.filter(c=>c.s==='L').length*0.5)} m²`});
  add({g:'LED',sub:'Cabinets',name:'Cabinet 500×500',...cab('S'),unit:`${nf(cabs.filter(c=>c.s==='S').length*0.25)} m²`});
  const fs=D.fcs.map(fcState);
  add({g:'LED',sub:'Flight cases',name:'Flight case',total:fs.length,in_stock:fs.filter(x=>x.state==='in'||x.state==='flag').length,out:fs.filter(x=>x.state==='out'||x.state==='partial').length,repair:fs.filter(x=>x.state==='repair').length,lost:0,unit:`${fs.filter(x=>x.state==='partial').length} partial`});
  let mi=0,mp=0,pi=0,pp=0; cabs.forEach(c=>{ if(!own.has(c.sn)) return; (c.mods||[]).forEach(m=>{ if(m){ mi++; if(D.parts[m]&&D.parts[m].cd==='damaged') mp++; } }); if(c.pdu){ pi++; if(D.parts[c.pdu]&&D.parts[c.pdu].cd==='damaged') pp++; } });
  add({g:'LED',sub:'Modules',name:'Module · installed',total:mi,in_stock:mi-mp,out:0,repair:mp,lost:0,unit:'problem = repair'});
  const sp=k=>{ const a=Object.values(D.spares).filter(s=>s.k===k&&s.st!=='installed'); return {...countSt(a.map(s=>s.st)),total:a.length}; };
  add({g:'LED',sub:'Modules',name:'Module · spare',...sp('M')});
  add({g:'LED',sub:'PDUs',name:'PDU · installed',total:pi,in_stock:pi-pp,out:0,repair:pp,lost:0});
  add({g:'LED',sub:'PDUs',name:'PDU · spare',...sp('P')});
  const hb=s=>{ const a=Object.values(D.hb).filter(h=>h.sub===s); return {...countSt(a.map(h=>h.st)),total:a.length}; };
  add({g:'Structure',sub:'Hanging bars',name:'Hanging bar DBmk2-1000',...hb('L')});
  add({g:'Structure',sub:'Hanging bars',name:'Hanging bar RS-500',...hb('S')});
  const acc=id=>GS.acc.find(a=>a[0]===id);
  [['PROC-01'],['PROC-02']].forEach(([id])=>{ const a=acc(id); if(a) add({g:'Proc',sub:'Processors',name:a[1],total:a[2],in_stock:a[2]-a[3]-a[4],out:a[3],repair:a[4],lost:0}); });
  [['recv_card','Receiving card'],['hub','HUB board'],['psu','PSU 500×1000']].forEach(([k,n])=>{ const t=GS.cards[k]||0; add({g:'Spare',sub:'Boards',name:n,total:t,in_stock:t,out:0,repair:0,lost:0}); });
  /* everything counted by quantity, straight from the database — nothing is
     left out, so what is on screen is what is in the warehouse */
  (GS.bulk||[]).forEach(b=>{
    const t=b.qty_total||0, o=b.qty_out||0, r=b.qty_repair||0;
    rows.push({g:BULK_G[b.category]||'Other', sub:b.sub||'Ungrouped', name:b.name,
      spec:b.spec||'', code:b.code, counted:true, retired:!!b.retired_at, note:b.note||'',
      total:t, in_stock:Math.max(0,t-o-r), out:o, repair:r, lost:0,
      unit:b.unit||'pcs', s:b.sort||0});
  });
  const gi=g=>{ const i=INV_ORDER.indexOf(g); return i<0?99:i; };
  rows.sort((a,b)=>gi(a.g)-gi(b.g) || (a.s-b.s) || a.sub.localeCompare(b.sub) || a.name.localeCompare(b.name));
  return rows;
}

}

/* a code the crew can read on a label, made from the name if none is given */
function invCode(name, cat){
  const pre = {cable:'CBL', accessory:'ACC', spare:'SPR', tool:'TL', other:'ITM'}[cat] || 'ITM';
  const body = String(name||'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,18) || 'ITEM';
  let code = pre+'-'+body, n = 2;
  while(bulkBy(code)) code = pre+'-'+body+'-'+(n++);
  return code;
}

/* the two repairers we actually use, and the faults we actually see.
   One definition, used by both places that send something away. */
const VEND  = ['Goldenduck','InfiLed'];
const FAULT = ['Dead pixel','Damaged pixel'];
const sendFields = r => [
  {id:'v', label:'Sent to', value:VEND.includes(r.vendor)?r.vendor:VEND[1],
   options:VEND.map(v=>[v,v]).concat([['__o','Someone else…']])},
  {id:'vo',label:'If someone else, who', value:VEND.includes(r.vendor)?'':(r.vendor||''), ph:'name of the repairer'},
  {id:'ft',label:'Fault', value:FAULT[0], options:FAULT.map(v=>[v,v]).concat([['__o','Something else…']])},
  {id:'n', label:'Note', value:'', ph:'more detail (optional)'}];
/* → {vendor, note} or null when nobody was named */
function sendRead(f){
  const vendor = f.v === '__o' ? (f.vo||'').trim() : f.v;
  if(!vendor){ toast('Type who it went to'); return null; }
  return {vendor, note:[f.ft === '__o' ? '' : f.ft, (f.n||'').trim()].filter(Boolean).join(' · ')};
}

async function repairAction(sn){
  if(!mayAct()) return;
  const r = RP.list.find(x=>x.sn===sn); if(!r) return;
  const a = await dialog({title:r.sn, text:esc(r.fault||'')+(r.wo_name?` · last out on ${esc(r.wo_name)}`:''),
    opts:[ r.stage==='waiting'?{v:'send',l:'Sent to the repairer',d:'Starts the clock at the vendor'}:null,
           {v:'back',l:'Came back fixed',d:'Goes to In stock, condition repaired'},
           isAdmin()?{v:'scrap',l:'Beyond repair',d:'Retired — out of the usable stock',plain:true}:null,
           {v:'go',l:'Find the item',plain:true}].filter(Boolean)});
  if(!a) return;
  if(a==='send'){
    const f = await dialog({title:'Sent for repair · '+r.sn, fields:sendFields(r), ok:'Save'});
    if(!f) return;
    const s = sendRead(f); if(!s) return;
    if(await srv('repair_send',{p_sn:r.sn,p_vendor:s.vendor,p_note:s.note},'Repair')) toast(r.sn+' → '+s.vendor);
  } else if(a==='back'){
    if(await srv('repair_back',{p_sn:r.sn,p_outcome:'fixed',p_note:''},'Repair')) toast(r.sn+' is back in stock');
  } else if(a==='scrap'){
    if(await srv('repair_back',{p_sn:r.sn,p_outcome:'scrapped',p_note:''},'Repair')) toast(r.sn+' retired');
  } else if(a==='go'){ V.q=r.sn; const qi=$('#q'); if(qi) qi.value=r.sn; setPage('manage'); refresh(false); return; }
  await reload();
}

/* ═══ Counting a job back in ═══
   The same idea as the phone: count per group, and when a count is short, say
   which ones are missing before anything is written. Nothing is guessed. */
function outGroups(w){
  const G = {}, ls = S.lines.filter(l=>l.wo_id === w.id && !l.returned_at);
  ls.forEach(l=>{
    const a = S.assets.get(l.asset_id); if(!a) return;
    const k = a.kind === 'cabinet' ? (a.size === 'S' ? 'cab_s' : 'cab_l')
            : a.kind === 'hanging_bar' ? 'bar' : a.kind === 'processor' ? 'proc' : 'other';
    const L = {cab_l:['Cabinets 500 × 1000','cabinet 500 × 1000',1],
               cab_s:['Cabinets 500 × 500','cabinet 500 × 500',2],
               bar:['Hanging bars','hanging bar',3], proc:['Processors','processor',4],
               other:['Other items','item',5]}[k];
    (G[k] = G[k] || {k, l:L[0], one:L[1], o:L[2], items:[]}).items.push(a);
  });
  const gs = Object.values(G).sort((a,b)=>a.o-b.o);
  gs.forEach(g=>g.items.sort((x,y)=>String(x.fc_code||'').localeCompare(String(y.fc_code||''))
    || (x.fc_slot||0)-(y.fc_slot||0) || String(x.sn).localeCompare(String(y.sn))));
  return gs;
}

/* Closing a job is where counting belongs: a job cannot finish honestly until
   everything is accounted for, so that is the first thing offered. */
async function closeJobWeb(woId){
  if(!mayAct()) return;
  const w = woBy(woId); if(!w) return;
  if(w.status !== 'active') return toast(w.name+' is already closed');
  const out = outGroups(w).reduce((a,g)=>a+g.items.length, 0);
  const cbShort = (w.bulk||[]).reduce((a,r)=>a+Math.max(0,
    (r.qty_out||0)-(r.qty_returned||0)-(r.qty_damaged||0)-(r.qty_lost||0)), 0);

  if(!out && !cbShort){
    const go = await dialog({title:'Close '+w.name,
      text:'Everything on this job is back in the warehouse. Closing it moves it to History and prints its completion report.',
      opts:[{v:'ok',l:'Close the job',d:'Nothing is outstanding'}]});
    if(go !== 'ok') return;
    const r = await srv('wo_complete',{p_wo:woId, p_force:false},'Close');
    if(r){ toast('Job closed — everything is back'); await reload(); goDash('creport:'+woId); }
    return;
  }

  const bits = [out?`${out} item${out===1?'':'s'}`:'', cbShort?`${cbShort} cable${cbShort===1?'':'s'}`:'']
    .filter(Boolean).join(' and ');
  const k = await dialog({title:`${bits} still out on ${w.name}`,
    text:cbShort && !out
      ? 'Every cabinet is back — it is the cable count holding this job open. Counting them is a few clicks.'
      : 'This job cannot close cleanly until they are accounted for. Counting them is a few clicks and keeps the stock right.',
    opts:[{v:'count', l:'Count them back in, then close', d:'Type how many came back, per group'},
          {v:'force', l:`Close anyway — leave ${out===1&&!cbShort?'it':'them'} marked out`,
           d:`${out===1&&!cbShort?'It gets':'They each get'} a reminder until found`, plain:true}]});
  if(!k) return;

  if(k === 'force'){
    const r = await srv('wo_complete',{p_wo:woId, p_force:true},'Close');
    if(r){ toast(`Job closed — ${bits} flagged`); await reload(); }
    return;
  }

  const done = await countBackWeb(woId, true);
  if(!done) return;
  const left = done.left;
  if(left > 0){
    const go = await dialog({title:`${left} item${left===1?'':'s'} still not accounted for`,
      text:`You left ${left===1?'it':'them'} marked out. Closing now puts a reminder on ${left===1?'it':'each one'} so ${left===1?'it':'they'} stay${left===1?'s':''} on the dashboard until found.`,
      opts:[{v:'force',l:'Close anyway',d:'The reminders keep it visible'},
            {v:'',l:'Keep it open',plain:true}]});
    if(go !== 'force') return;
  }
  const r = await srv('wo_complete',{p_wo:woId, p_force:left>0},'Close');
  if(r){ toast(left>0?`Job closed — ${left} item(s) flagged`:'Job closed — everything is back'); await reload(); }
}

async function countBackWeb(woId, quiet){
  if(!mayAct()) return;
  const w = woBy(woId); if(!w) return null;
  const groups = outGroups(w);
  /* cables hold a close open just as hard as cabinets, so they are counted here too */
  const cbl = (w.bulk||[])
    .map(r=>({...r, short:(r.qty_out||0)-(r.qty_returned||0)-(r.qty_damaged||0)-(r.qty_lost||0)}))
    .filter(r=>r.short > 0)
    .sort((a,b)=>bulkNameOf(a.item_code).localeCompare(bulkNameOf(b.item_code)));
  if(!groups.length && !cbl.length){ if(!quiet) toast('Everything on '+w.name+' is already back'); return null; }
  const total = groups.reduce((a,g)=>a+g.items.length, 0) + cbl.reduce((a,r)=>a+r.short, 0);

  const f = await dialog({title:'Count '+w.name+' back in',
    text:`${total} item${total===1?'':'s'} still out. Count them and type how many came back —
      leave a number as it is if the whole lot is there. Nothing is written until you have said
      which ones are missing.`,
    fields:groups.map(g=>({id:g.k, label:`${g.l} · ${g.items.length} out`, value:String(g.items.length)}))
      .concat(cbl.map(r=>({id:'q_'+r.item_code,
        label:`${bulkNameOf(r.item_code)} · ${r.short} still to count`, value:String(r.short)}))),
    ok:'Confirm the count'});
  if(!f) return null;

  const plan = [];
  for(const g of groups){
    let n = parseInt(f[g.k], 10);
    if(!isFinite(n) || n < 0) n = 0;
    if(n > g.items.length){ toast(`${g.l}: only ${g.items.length} went out`); return null; }
    plan.push({g, n, missing:[]});
  }

  for(const p of plan.filter(x=>x.n < x.g.items.length)){
    const gap = p.g.items.length - p.n;
    const picked = await pickMissingWeb(p.g, gap);
    if(picked === null) return null;
    p.missing = picked;
  }

  const cplan = [];
  for(const r of cbl){
    let n = parseInt(f['q_'+r.item_code], 10);
    if(!isFinite(n) || n < 0) n = 0;
    if(n > r.short){ toast(`${bulkNameOf(r.item_code)}: only ${r.short} are outstanding`); return null; }
    cplan.push({r, n, rest:r.short - n});
  }
  const cshort = cplan.filter(c=>c.rest > 0);

  const missing = plan.flatMap(p=>p.missing);
  let fate = 'lost';
  if(missing.length || cshort.length){
    const shown = missing.slice(0,10).concat(cshort.map(c=>bulkNameOf(c.r.item_code)+' ×'+c.rest));
    const k = await dialog({title:`${missing.length + cshort.reduce((a,c)=>a+c.rest,0)} did not come back`,
      text:`<span class="mono">${esc(shown.join(' · '))}</span>`,
      opts:[{v:'out',    l:'Leave them marked out', d:'Still looking — they stay on the job'},
            {v:'repair', l:'They came back broken', d:'Goes to repair, condition damaged'},
            {v:'lost',   l:'Mark them lost',        d:'The honest answer, not the tidy one', plain:true}]});
    if(!k) return null;
    fate = k;
  }

  const backSns = plan.flatMap(p=>{ const m = new Set(p.missing);
    return p.g.items.filter(a=>!m.has(a.sn)).map(a=>a.sn); });

  if(backSns.length){
    const r = await srv('wo_return_many',{p_wo:woId, p_sns:backSns, p_status:'in_stock',
      p_note:'Counted back in, not scanned'},'Return');
    if(!r) return null;
    if(r.skipped && r.skipped.length) toast(r.skipped.length+' could not be done');
  }
  if(missing.length && fate !== 'out'){
    await srv('wo_return_many',{p_wo:woId, p_sns:missing, p_status:fate,
      p_cond:fate==='repair'?'damaged':null,
      p_note:fate==='repair'?'Came back damaged, counted not scanned':'Not there at the count'},'Return');
  }
  for(const c of cplan){
    if(!c.n && !c.rest) continue;
    const r = c.r;
    await srv('wo_bulk_set',{p_wo:woId, p_item:r.item_code, p_qty_out:r.qty_out,
      p_returned:(r.qty_returned||0) + c.n,
      p_damaged:(r.qty_damaged||0) + (fate==='repair'?c.rest:0),
      p_lost:(r.qty_lost||0) + (fate==='lost'?c.rest:0),
      p_note:r.note||'Counted back in, not scanned'}, bulkNameOf(r.item_code));
  }
  toast(`${backSns.length} back in stock${missing.length?` · ${missing.length} ${
    fate==='out'?'still out':fate==='repair'?'to repair':'lost'}`:''}`);
  await reload();
  const cLeft = fate === 'out' ? cshort.reduce((a,c)=>a+c.rest, 0) : 0;
  return {back:backSns.length, missing:missing.length, fate,
          left:(fate === 'out' ? missing.length : 0) + cLeft};
}

async function pickMissingWeb(g, gap){
  const k = await dialog({title:gap===1?`Which ${g.one} is missing?`
                                    :`Which ${gap} of the ${g.l.toLowerCase()} are missing?`,
    text:`Pick the ${gap===1?'one':gap} that ${gap===1?'is':'are'} not there. Everything else goes back into stock.`,
    opts:g.items.slice(0,120).map(a=>({v:a.sn, plain:true, l:a.sn,
      d:a.fc_code?`FC ${parseInt(a.fc_code,10)}${a.fc_slot!=null?' · S'+a.fc_slot:''}`:(a.group_name||'')})),
    cancel:'Cancel'});
  if(!k) return null;
  /* one at a time, so the list re-opens until the count is right */
  const picked = [k];
  if(gap === 1) return picked;
  const rest = {...g, items:g.items.filter(a=>a.sn !== k)};
  const more = await pickMissingWeb(rest, gap - 1);
  return more === null ? null : picked.concat(more);
}

/* ═══ Find an item ═══
   Filters the serials already in memory as you type — serial, name, model or
   flight-case number — so a partial number finds the item instead of failing. */
function searchItems(q, limit){
  const s = String(q||'').trim().toLowerCase();
  if(!s) return [];
  const fc = /^\d{1,3}$/.test(s) ? String(parseInt(s,10)) : null;
  const hits = [];
  for(const a of S.assets.values()){
    const sn = String(a.sn||'').toLowerCase();
    let rank = -1;
    if(sn.startsWith(s)) rank = 0;
    else if(sn.includes(s)) rank = 1;
    else if(fc && a.fc_code && String(parseInt(a.fc_code,10)) === fc) rank = 2;
    else if(String(a.group_name||'').toLowerCase().includes(s)) rank = 3;
    else if(String(a.model||'').toLowerCase().includes(s)) rank = 3;
    if(rank >= 0) hits.push([rank, a]);
    if(hits.length > 600) break;
  }
  hits.sort((x,y)=>x[0]-y[0] || String(x[1].sn).localeCompare(String(y[1].sn)));
  return hits.slice(0, limit||40).map(h=>h[1]);
}

/* a dialog that is a search box: type, pick, done */
function pickItem({title, text, ok}){
  return new Promise(res=>{
    const host = $('#dlgHost');
    host.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pkT"><div class="card pick">
      <h4 id="pkT">${esc(title)}</h4>${text?`<p>${text}</p>`:''}
      <div class="fld"><label for="pkQ">Serial, name or flight case</label>
        <input id="pkQ" placeholder="08975 · hanging bar · 131" autocomplete="off" spellcheck="false"></div>
      <div class="pkhits" id="pkHits"><div class="pkhint">Start typing — the list appears as you go.</div></div>
      <div class="acts"><button class="btn" data-o="__cancel" type="button">Cancel</button></div>
    </div></div>`;
    const close = v => { host.innerHTML=''; res(v); };
    const q = host.querySelector('#pkQ'), box = host.querySelector('#pkHits');
    const draw = () => {
      const hits = searchItems(q.value, 40);
      if(!q.value.trim()){ box.innerHTML = '<div class="pkhint">Start typing — the list appears as you go.</div>'; return; }
      if(!hits.length){ box.innerHTML = `<div class="pkhint">Nothing matches “${esc(q.value.trim())}”.</div>`; return; }
      box.innerHTML = hits.map(a=>{
        const w = a.current_wo ? woBy(a.current_wo) : null;
        return `<button class="pkrow" data-sn="${esc(a.sn)}" type="button">
          <span class="dot ${a.status==='in_stock'?'in':a.status}"></span>
          <span class="pn"><b>${esc(a.sn)}</b>
            <span class="sub">${esc(a.group_name||KIND_L2[a.kind]||a.kind)}${
              a.fc_code?` · FC ${parseInt(a.fc_code,10)}${a.fc_slot!=null?' · S'+a.fc_slot:''}`:''}</span></span>
          <span class="pst">${esc(ST_L[a.status]||a.status)}${w?`<span class="sub">${esc(w.name)}</span>`:''}</span>
        </button>`; }).join('') +
        (hits.length >= 40 ? '<div class="pkhint">Showing the first 40 — type a little more.</div>' : '');
      box.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>close(b.dataset.sn));
    };
    let t = null;
    q.addEventListener('input', ()=>{ clearTimeout(t); t = setTimeout(draw, 90); });
    q.addEventListener('keydown', e=>{
      if(e.key === 'Escape') return close(null);
      if(e.key === 'Enter'){ const first = box.querySelector('[data-sn]'); if(first){ e.preventDefault(); close(first.dataset.sn); } }
    });
    host.querySelector('[data-o="__cancel"]').onclick = ()=>close(null);
    host.querySelector('.dlg').addEventListener('click', e=>{ if(e.target.classList.contains('dlg')) close(null); });
    q.focus();
  });
}

/* ═══ The numbers ═══ */

const dT  = v => v ? new Date(v).toLocaleDateString('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',year:'numeric'}) : '—';
const ago = v => { if(!v) return ''; const d = Math.floor((Date.now()-new Date(v))/86400000);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 60 ? d+' days ago' : Math.round(d/30)+' months ago'; };

async function rpc(fn, args){
  try{
    const {data, error} = await SB.rpc(fn, args||{});
    if(error) throw new Error(error.message);
    return data;
  }catch(e){ toast('Could not read that: '+e.message); return null; }
}

/* ── one item's whole life ── */

  const t = d.totals||{}, jobs = d.jobs||[], reps = d.repairs||[], names = d.names||[];
  const where = d.fc_code ? `FC ${parseInt(d.fc_code,10)}${d.fc_slot!=null?' · S'+d.fc_slot:''}` : 'not in a case';
  const warn = (t.repairs||0) >= 3
    ? `<div class="vd no"><b>${t.repairs} repairs on one item.</b> A cabinet on its third or fourth visit is usually
       cheaper to retire than to keep fixing — its history is below, decide with the facts.</div>` : '';

  const doc = `<div class="rdoc"><header class="rh"><div>
      <div class="rk">Cosmos LED Management · item history</div>
      <h2>${esc(d.sn)}</h2>
      <div class="wono">${esc(KIND_L2[d.kind]||d.kind)}${d.group_name?' · '+esc(d.group_name):''}</div></div>
    <div class="rmeta">${esc(ST_L[d.status]||d.status)}${d.retired_reason?' · '+esc(d.retired_reason):''}<br>

      <th class="n">Repairs</th><th class="n">Open now</th></tr></thead>
      <tbody><tr><td class="n">${t.jobs||0}</td><td class="n">${t.damaged||0}</td>
      <td class="n">${t.repairs||0}</td><td class="n">${reps.filter(r=>!r.back).length}</td></tr></tbody></table>

    ${names.length?`<h3 class="rs2">It has been called<span class="segn">${names.length} old name${names.length===1?'':'s'}</span></h3>
      ${ptbl(['#','Was','Renamed','Old label scans until'], names.map(n=>
        [`<span class="mono">${esc(n.was)}</span>`, dT(n.on), dT(n.until)]))}`:''}

    <h3 class="rs2">Every job it went on<span class="segn">${jobs.length}</span></h3>
    ${jobs.length?ptbl(['#','Work order','Out','Back','How it came back','Note'], jobs.map(j=>
      [`<b>${esc(j.name)}</b>${j.no?` <span class="u">WO ${j.no}/${j.year}</span>`:''}<br><span class="u">${esc(j.loc||'')}</span>`,
       dT(j.out), j.back?dT(j.back):'<b style="color:#c27400">not scanned back</b>',
       j.status==='repair'?'<b style="color:#d03b3b">damaged</b>':j.status==='lost'?'<b style="color:#4a3aa7">lost</b>':j.back?'fine':'—',
       esc(j.note||'')]))

    <h3 class="rs2">Every repair<span class="segn">${reps.length}</span></h3>
    ${reps.length?ptbl(['#','Fault','Sent to','Opened','Back','n:Days','Outcome'], reps.map(r=>
      [esc(r.fault||'—'), esc(r.vendor||'—'), dT(r.opened), r.back?dT(r.back):'<b style="color:#c27400">still away</b>',
       r.days==null?'':r.days, esc(r.outcome||'')]))

/* ── which items keep breaking, and which repairer is faster ── */
async function reliabilityView(){
  const d = await rpc('reliability', {p_limit:15});
  if(!d) return;
  const worst = d.worst||[], vend = d.vendors||[], t = d.totals||{};
  const kinds = Object.entries(d.by_kind||{}).sort((a,b)=>b[1]-a[1])
    .map(([k,n])=>`${KIND_L2[k]||k} ${n}`).join(' · ');
  const fastest = vend.filter(v=>v.avg_days!=null).sort((a,b)=>a.avg_days-b.avg_days)[0];
  const slowest = vend.filter(v=>v.avg_days!=null).sort((a,b)=>b.avg_days-a.avg_days)[0];
  const lead = fastest && slowest && fastest.vendor !== slowest.vendor
    ? `<div class="vd yes"><b>${esc(fastest.vendor)} turns work around in ${fastest.avg_days} days;
       ${esc(slowest.vendor)} takes ${slowest.avg_days}.</b> That is a fact you can negotiate with.</div>` : '';

  const doc = `<div class="rdoc"><header class="rh"><div>
      <div class="rk">Cosmos LED Management · reliability</div>
      <h2>What keeps breaking</h2>
      <div class="wono">${t.repairs||0} repairs on ${t.items||0} items · ${t.open||0} open now</div></div>
    <div class="rmeta">${esc(kinds||'—')}<br>Printed ${esc(nowBkk())}</div></header>
    ${lead}
    <h3 class="rs2">Items on their second visit or more<span class="segn">${worst.length}</span></h3>
    ${worst.length?ptbl(['#','Serial','What it is','n:Repairs','Last one','Faults','Where it is'], worst.map(w=>
      [`<span class="mono">${esc(w.sn)}</span>`, esc(w.group_name||KIND_L2[w.kind]||w.kind),
       `${w.n}${w.open?` <span class="u">(${w.open} open)</span>`:''}`,
       `${dT(w.last)}<br><span class="u">${ago(w.last)}</span>`,
       esc(w.faults||''), w.fc_code?`FC ${parseInt(w.fc_code,10)}`:esc(ST_L[w.status]||w.status)]))
      :`<div class="okline">✓ Nothing has been repaired twice. Nothing to worry about yet.</div>`}

    <h3 class="rs2">Your repairers<span class="segn">${vend.length}</span></h3>
    ${vend.length?ptbl(['#','Repairer','n:Finished','n:Still there','n:Average days','n:Fixed','n:Written off'], vend.map(v=>
      [esc(v.vendor), v.done||0, v.open||0, v.avg_days==null?'—':v.avg_days, v.fixed||0, v.scrapped||0]))
      :`<div class="okline">Nothing has been sent to a repairer yet.</div>`}

    <footer class="rf">"Average days" counts from the day it was sent to the day it came back.
      An item still at a repairer is not in the average.</footer></div>`;
  openReportHost('Reliability', doc);
}

/* ── how hard the wall worked ── */
async function utilView(){
  const d = await rpc('utilisation', {p_months:12});
  if(!d) return;
  const ms = d.months||[], owned = +d.owned_m2 || 0, t = d.totals||{};
  if(!ms.length) return toast('No jobs in the last twelve months to measure');
  const top = Math.max(...ms.map(m=>+m.m2), 1);
  const best = ms.slice().sort((a,b)=>b.m2-a.m2)[0], worst = ms.slice().sort((a,b)=>a.m2-b.m2)[0];

  const bars = ms.map(m=>`<div class="ub">
      <div class="uv"><i style="height:${Math.max(3, Math.round(m.m2/top*100))}%"></i></div>
      <div class="ul">${esc(m.label)}</div>
      <div class="un">${nf(+m.m2)}</div></div>`).join('');

  const doc = `<div class="rdoc"><header class="rh"><div>
      <div class="rk">Cosmos LED Management · utilisation</div>
      <h2>How hard the wall worked</h2>
      <div class="wono">${nf(owned)} m² owned · ${t.jobs||0} jobs in ${ms.length} month${ms.length===1?'':'s'}</div></div>
    <div class="rmeta">Best month ${esc(best.label)} · ${nf(+best.m2)} m²<br>
      Quietest ${esc(worst.label)} · ${nf(+worst.m2)} m²<br>Printed ${esc(nowBkk())}</div></header>

    <div class="vd ${(t.best||0) < 50 ? 'no' : 'yes'}"><b>Your busiest single job used ${t.best||0}% of the wall.</b>
      ${(t.best||0) < 50
        ? `More than half of what you own has never gone out at once. That is either room to grow into, or more stock than the work needs.`
        : `You are working the wall hard — worth watching whether a big booking and a repair queue can collide.`}</div>

    <h3 class="rs2">Month by month<span class="segn">m² shipped</span></h3>
    <div class="ubars">${bars}</div>

    ${ptbl(['#','Month','n:Jobs','n:Cabinets','n:m² shipped','n:m²-days','n:Peak share','Busiest job'], ms.map(m=>
      [esc(m.label)+' '+String(m.month).slice(0,4), m.jobs, m.cabs, nf(+m.m2), nf(+m.m2_days),
       (m.peak||0)+'%', esc(m.busiest||'')]))}

    <footer class="rf">"m² shipped" counts the cabinets actually scanned out that month.
      "m²-days" multiplies that by how long the job ran, so a three-day job counts three times a one-day job.
      "Peak share" is the biggest single job that month against everything you own.</footer></div>`;
  openReportHost('Utilisation', doc);
}

/* ── a whole flight case at once ── */
async function moveWholeCase(){
  const f = fcBy(V.fc); if(!f) return;
  const n = filled(f);
  if(!n) return toast(`FC ${f.l} is already empty`);
  const k = await dialog({title:`FC ${f.l} · ${n} cabinet${n===1?'':'s'}`,
    text:'Moving or emptying a whole case in one go, instead of one drag at a time. Anything out on a job is left where it is.',
    opts:[{v:'to',    l:'Move them all to another case…', d:'The first free slots, in order'},
          {v:'empty', l:'Take them all out of the case',  d:'They become unassigned and each slot is flagged empty', plain:true}]});
  if(!k) return;
  let to = null;
  if(k==='to'){
    const g = await dialog({title:'Into which case',
      fields:[{id:'fc',label:'Flight case number',value:'',ph:'e.g. 42'}], ok:'Move'});
    if(!g || !g.fc.trim()) return;
    to = g.fc.trim();
  }
  const r = await srv('fc_move_all',{p_from:f.n, p_to:to},'Flight case');
  if(r){
    toast(r.msg||'Done');
    if(r.skipped && r.skipped.length)
      setTimeout(()=>toast(r.skipped.map(x=>x.sn+' — '+x.why).join(' · ')), 2600);
    await reload();
  }
}

/* ═══ Who can use this ═══

  const row = p => `<li class="tperson ${p.active?'':'off'}" data-em="${esc(p.email)}" tabindex="0">
    <div><b>${esc(p.name||p.email)}</b><small>${esc(p.email)}</small></div>
    <div class="trt"><span class="rtag ${esc(p.role)}">${esc(ROLE_L[p.role]||p.role)}</span>
      <span class="tsub">${p.active ? (p.signed_up ? 'signed in before' : 'no Supabase account yet')
                                     : 'switched off'}</span></div></li>`;
  const k = await dialog({title:'Team',
    text:'Who can use Cosmos, and how much of it. A person needs two things: a row here, '+
         'and an account in Supabase with the same email. You make the account and set the '+
         'password there — it never passes through this page.',
    html:`<ul class="tlist">${people.map(row).join('')||'<li class="tnone">Nobody yet</li>'}</ul>`,
    opts:[{v:'add',    l:'Add someone…', d:'An email and what they are allowed to do'},
          {v:'phones', l:'Phones on the scanner…', d:'Which phones are using it, and free a slot', plain:true}],

/* Two crew phones at a time. Your own phone and an editor's are never counted,
   so you can always scan on your own. */
async function phoneScreen(){
  if(!isAdmin()) return toast('Only the admin account can manage the phones');
  const d = await rpc('device_list');
  if(!d) return;
  const all = d.phones || [], crew = all.filter(p=>p.counted), mine = all.filter(p=>!p.counted);
  const when = t => { const x = new Date(t); return isNaN(x) ? '—' : fmtD(t); };
  const quiet = n => n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago';
  const row = p => `<li class="tperson" data-dev="${esc(p.id)}" tabindex="0">
    <div><b>${esc(p.label || 'A phone')}</b>
      <small>${esc(p.email || '—')} · last used ${esc(quiet(p.days_quiet))}</small></div>
    <div class="trt"><span class="rtag ${p.counted?'crew':'viewer'}">${p.counted?'uses a slot':'not counted'}</span>
      <span class="tsub">since ${esc(when(p.first_seen))}</span></div></li>`;
  const k = await dialog({title:`Phones · ${d.used} of ${d.limit} slots used`,
    text:`The scanner runs on <b>${d.limit} crew phone${d.limit===1?'':'s'}</b> at a time. `+
         `A third is turned away and told to ask you. Your own account and an editor's are never `+
         `counted, so you can always scan on your own phone.`+
         (crew.length ? '<br><br>Tap a phone to free its slot.' : ''),
    html:`<ul class="tlist">${crew.map(row).join('') ||
            '<li class="tnone">No crew phone has used the scanner yet</li>'}
          ${mine.length?`<li class="tnone" style="text-align:left;padding:10px 2px 2px">Not using a slot:</li>`+
            mine.map(row).join(''):''}</ul>`,
    opts:[{v:'limit', l:`Change how many phones… (${d.limit})`, d:'If you buy another phone for the crew', plain:true}],
    cancel:'Close'});
  if(k === 'limit'){
    const f = await dialog({title:'How many crew phones?',
      text:'Phones already using a slot keep it. Lowering this does not throw anyone off — free a slot instead.',
      fields:[{id:'n', label:'Crew phones allowed at once', value:String(d.limit)}], ok:'Save'});
    if(!f) return phoneScreen();
    const n = parseInt(String(f.n).replace(/[^0-9]/g,''), 10);
    if(!isFinite(n)) return toast('That has to be a number');
    const r = await srv('device_limit_set', {p_n:n}, 'Phones');
    if(r) toast(r.msg || 'Saved');
    return phoneScreen();
  }
  if(k && k.startsWith('dev:')){
    const id = k.slice(4), p = all.find(x=>x.id === id) || {};
    const go = await dialog({title:'Free this slot?',
      text:`<b>${esc(p.label||'This phone')}</b> · ${esc(p.email||'')}<br><br>`+
           `It is signed out of the scanner and the slot goes back. The next phone to sign in takes it. `+
           `If this phone opens the scanner again it will be the one turned away.`,
      opts:[{v:'go', l:'Free the slot', d:'The next phone to sign in can use it'}], cancel:'Keep it'});
    if(go !== 'go') return phoneScreen();
    const r = await srv('device_release', {p_device:id}, 'Phones');
    if(r) toast(r.msg || 'Slot freed');
    return phoneScreen();
  }
}

      ? 'The email has to match the Supabase account exactly, or they will sign in and be told they are not on the team.'
      : `<b>${esc(p.email)}</b>${p.signed_up ? '' : ' · <b style="color:var(--flag)">no Supabase account with this email yet</b>'}`,
    fields:[ isNew ? {id:'email', label:'Email', value:'', ph:'led03@mahled.local'} : null,

             {id:'role', label:'Allowed to', value:isNew?'crew':p.role, options:ROLE_OPTS}
           ].filter(Boolean),
    ok: isNew ? 'Add them' : 'Save',

        : (!isNew) ? [{v:'on', l:'Switch it back on', d:'They can sign in again'}] : []});

/* ═══ Can we take this job? ═══ */

/* A 500 × 1000 cabinet is half a metre wide and a metre tall, so the cabinet
   count is simple geometry. Bars, processors and cable are not — those ratios
   come from what you actually took on past jobs. */
/* The wall maths lives in the database (plan_suggest), so the phone and the
   website can never drift apart on what a job needs. */
async function wallPlan(wm, hm, spare){
  const w = +wm || 0, h = +hm || 0;
  if(w <= 0 || h <= 0) return null;
  try{
    const {data, error} = await SB.rpc('plan_suggest', {p_w:w, p_h:h, p_spare:+spare||0});
    if(error) throw new Error(error.message);
    if(!data || data.ok === false){ if(data&&data.msg) toast(data.msg); return null; }
    return data;
  }catch(e){ toast('Could not work out the wall: '+e.message); return null; }
}

async function freeCheck(){
  const today = new Date().toISOString().slice(0,10);
  const f = await dialog({title:'Can we take this job?',
    text:'What is free on a date that has not happened yet — counting jobs that are already booked as well as jobs already loaded.',
    fields:[{id:'from',label:'From',value:today,ph:'2026-10-03'},
            {id:'to',  label:'To',  value:'',    ph:'leave blank for one day'},
            {id:'w',   label:'Wall width, metres',  value:'', ph:'8'},
            {id:'h',   label:'Wall height, metres', value:'', ph:'4.5'},
            {id:'sp',  label:'Spare cabinets',      value:'4', ph:'4'}], ok:'Check'});
  if(!f) return;
  const from = (f.from||'').trim(); if(!from) return toast('A date is needed');
  const to = (f.to||'').trim() || null;
  let av;
  try{
    const {data, error} = await SB.rpc('availability', {p_from:from, p_to:to});
    if(error) throw new Error(error.message);
    av = data;
  }catch(e){ return toast('Could not check: '+e.message); }
  if(!av) return toast('Nothing came back');
  renderFree(av, await wallPlan(f.w, f.h, f.sp));
}

function renderFree(av, plan){
  const free = av.free||{}, pool = av.pool||{}, com = av.committed||{};
  const jobs = av.jobs||[], m2 = av.m2||{};
  const span = av.from === av.to ? fmtD(av.from) : fmtD(av.from)+' – '+fmtD(av.to);
  let verdict = '';
  if(plan){
    const shortL = plan.cab_l - (free.cab_l||0), shortS = plan.cab_s - (free.cab_s||0);
    const need = `A ${esc(plan.wall)} wall is ${plan.across} across, ${esc(plan.rows)} — ` +
      `${plan.wall_cab_l} × 500 × 1000${plan.cab_s?` and ${plan.cab_s} × 500 × 500`:''}` +
      `${plan.spare?`, plus ${plan.spare} spare`:''}.`;
    verdict = (shortL <= 0 && shortS <= 0)
      ? `<div class="vd yes"><b>Yes.</b> ${need} You have <b>${free.cab_l}</b> and <b>${free.cab_s}</b> free that week, so
         ${(free.cab_l||0)-plan.cab_l} large${plan.cab_s?` and ${(free.cab_s||0)-plan.cab_s} small`:''} would still be spare.</div>`
      : `<div class="vd no"><b>No — short of cabinets.</b> ${need}
         ${shortL>0?`You are <b>${shortL}</b> short of 500 × 1000${shortS>0?' and ':''}`:''}${
           shortS>0?`<b>${shortS}</b> short of 500 × 500`:''} on those dates.</div>`;
  }

  const row = (k, label, unit) =>
    `<tr><td>${label}</td><td class="n">${pool[k]||0}</td><td class="n">${com[k]||0}</td>` +
    `<td class="n ${(!free[k] && pool[k])?'z':''}"><b>${free[k]||0}</b></td><td class="u">${unit||''}</td></tr>`;

  const cables = Object.entries(av.cables||{})
    .filter(([,c])=>c.total > 0)
    .sort((a,b)=>a[1].name.localeCompare(b[1].name))
    .map(([code,c])=>`<tr><td>${esc(c.name)}</td><td class="n">${c.total}</td>` +
      `<td class="n">${c.total - c.free}</td><td class="n"><b>${c.free}</b></td><td class="u">${esc(c.unit||'')}</td></tr>`).join('');

  const doc = `<div class="rdoc"><header class="rh"><div>
      <div class="rk">Cosmos LED Management · availability</div>
      <h2>${esc(span)}</h2>
      <div class="wono">${nf(m2.free||0)} m² free of ${nf(m2.total||0)}</div></div>
    <div class="rmeta">Checked ${esc(nowBkk())}<br>${jobs.length} job${jobs.length===1?'':'s'} in the way</div></header>
    ${verdict}
    ${plan?(()=>{ const src = (guess, seen) => guess ? '<span class="gs">estimate — no past job to learn from</span>'
                       : `averaged over ${seen} past job${seen===1?'':'s'}`;
      return `<h3 class="rs2">What that wall needs<span class="segn">${plan.across} across · ${nf(+plan.m2)} m²</span></h3>
      ${ptbl(['#','Item','n:Needs','Where the number comes from'],[
        ['Cabinets 500 × 1000', plan.cab_l,
          plan.spare?`${plan.wall_cab_l} for the wall plus ${plan.spare} spare`:'the wall itself'],
        ['Cabinets 500 × 500', plan.cab_s, plan.cab_s?'the half-metre top row':'not needed for this height'],
        ['Flight cases', plan.fc_l + plan.fc_s,
          plan.fc_s?`${plan.fc_l} for the big cabinets and ${plan.fc_s} for the small`:`${STD.L} cabinets to a case`],

        ['Interlink power', plan.cables.il_power, src(plan.guess.pow, plan.seen.pow)]])}`; })():''}

const RETIRE_WHY = [['scrapped','Scrapped — beyond repair'],['sold','Sold'],
                    ['lost','Lost for good'],['returned','Returned to the supplier']];
const isAdmin = () => ROLE === 'admin';

async function tbl(name, cols, order){
  if(!SB) return [];
  let q = SB.from(name).select(cols);
  if(order) q = q.order(order);
  const {data, error} = await q.limit(500);
  if(error){ toast('Could not read '+name+': '+error.message); return []; }
  return data || [];
}

/* what you can do to one serial */
async function itemActions(sn){
  if(!canEdit()) return toast('This account is view only');
  const {data, error} = await SB.rpc('scan_lookup', {p_code: sn});
  if(error) return toast(error.message);
  if(!data || data.type !== 'asset') return toast(`"${sn}" is not an item in the database`);
  const a = data;
  const where = a.fc_code ? `FC ${parseInt(a.fc_code,10)}${a.fc_slot!=null?' · S'+(a.fc_slot+1):''}`
              : a.parent_sn ? 'fitted in '+a.parent_sn : 'not in a case';
  const k = await dialog({title:a.sn,
    text:`${esc(KIND_L2[a.kind]||a.kind)} · ${esc(where)} · ${esc(ST_L[a.status]||a.status)}` +
         (a.old_label?`<br><b style="color:var(--flag)">${esc(a.warn)}</b>`:'') +
         (a.retired?`<br><b style="color:var(--rep)">${esc(a.warn)}</b>`:''),
    opts:[{v:'edit',  l:'Edit description',  d:'Model, name, spec and the internal note'},
          {v:'ren',   l:'Rename the serial', d:'Keeps every job and repair · old label scans for 90 days'},
          a.retired ? {v:'back', l:'Bring it back into stock', d:'Undo the retirement'}
                    : isAdmin() ? {v:'kill', l:'Retire it…', d:'Out of the counts, history kept', plain:true} : null,
          {v:'life', l:'Its whole life', d:'Every job and every repair', plain:true},
          D.cabs[a.sn] ? {v:'go', l:'Find it in the 3D view', plain:true} : null].filter(Boolean)});
  if(!k) return;
  if(k==='life') return itemLife(a.sn);
  if(k==='go'){ openCab(a.sn); setPage('manage'); return; }
  if(k==='back'){
    if(await srv('asset_restore',{p_sn:a.sn},'Restore')) { toast(a.sn+' is back in stock'); await reloadStock(); }
    return;
  }
  if(k==='edit') return editItem(a);
  if(k==='ren')  return renameItem(a);
  if(k==='kill') return retireItem(a);
}

               ['hanging_bar','Hanging bar'],['cabinet','Cabinet'],['module','Module'],['pdu','PDU'],
               ['processor','Processor'],['psu','Power supply'],['recv_card','Receiving card'],['hub','Hub'],['other','Other']]},

            {id:'name',label:'Name on papers', value:'',         ph:'Hanging Bar DBmk2-1000mm'},

  if(!f) return;

  if(!sns.length) return toast('That pattern makes no serials — it needs ### where the number goes');
  const go = await dialog({title:`Add ${sns.length} item${sns.length===1?'':'s'}`,

    opts:[{v:'ok',l:`Create ${sns.length} item${sns.length===1?'':'s'}`,d:'They go straight into stock, and their labels join the reprint queue'},
          {v:'',l:'Back',plain:true}]});

  else if(r === false) return;
}

/* 'HB-L-###' + 61 + 10 → HB-L-061 … HB-L-070 */
function expandPattern(pat, from, n){
  pat = String(pat||'').trim();
  const m = pat.match(/#+/);
  const start = parseInt(from,10), count = Math.min(parseInt(n,10)||0, 500);
  if(!m || !isFinite(start) || count < 1) return [];
  const w = m[0].length, out = [];
  for(let i=0;i<count;i++) out.push(pat.replace(m[0], String(start+i).padStart(w,'0')));
  return out;
}

/* ═══ The paperwork ═══
   Work Order — printed from an open job: what we are taking.
   Work Completion Report — printed from History: what came home.
   Both number every list, split hanging bars by length, and break long lists
   over pages with the heading repeated. */
const woNo = w => (w.no ? w.no + '/' + (w.year || new Date().getFullYear()) : '');
const uniq = a => [...new Set(a)];

/* a section heading that carries its own totals, so every block on the
   completion report answers "how many went, how many came home" on its own */
function segh(title, out, back){
  const n = back===null||back===undefined ? `${out} out`
          : `${out} out · ${back} back${out>back?` · <b>${out-back} not back</b>`:''}`;
  return `<h3 class="rs2">${title}<span class="segn">${n}</span></h3>`;
}

/* 5 down a column up to 40 pieces, 10 above that; five columns to a page then. */
function barCols(list, start, per){
  let out = '';
  for(let i=0;i<list.length;i+=per){
    out += '<ol>' + list.slice(i,i+per).map((v,j)=>
      `<li><i>${start+i+j}.</i>${esc(v)}</li>`).join('') + '</ol>';
  }
  return `<div class="band ${per===10?'c5':'c8'}">${out}</div>`;
}
/* The heading and its list are wrapped together. They used to be two loose
   elements, so when the list would not fit in what was left of the page the
   browser moved the list on its own and left the heading behind — a title,
   then half a page of nothing, then the serials. */
function barBand(title, list, head, segHtml){
  const seg = segHtml || '<h3 class="rs2">Hanging bars</h3>';
  const n = list.length;
  if(!n) return `<div class="bandw"><p class="bandh">${title} <span>none on this job</span></p>
    <div class="band c8"><ol><li class="none">—</li></ol></div></div>`;
  const per = n > 40 ? 10 : 5, perPage = n > 40 ? 50 : n;
  let out = '', i = 0, page = 0;
  while(i < n){
    const chunk = list.slice(i, i + perPage);
    if(page) out += `<div class="pgbreak"></div>${head}${seg}
      <span class="cont">Continued from page ${page}</span>`;
    out += `<div class="bandw"><p class="bandh">${title} <span>${n} pcs${n>perPage?` · ${i+1}–${i+chunk.length}`:''}</span></p>`
         + barCols(chunk, i + 1, per) + `</div>`;
    i += perPage; page++;
  }
  return out;
}
function barsOf(w){
  const all = uniq(w.items||[]);
  return {L: all.filter(sn=>D.hb[sn] && D.hb[sn].sub!=='S'),
          S: all.filter(sn=>D.hb[sn] && D.hb[sn].sub==='S')};
}
function fcGroups(w){
  const own = ownMap(), byFc = {}, loose = [];
  uniq(w.cabs||[]).forEach(sn=>{ const o = own.get(sn);
    if(o){ (byFc[o.f.n] = byFc[o.f.n] || {f:o.f, sns:[]}).sns.push(sn); } else loose.push(sn); });
  return {groups: Object.values(byFc).sort((a,b)=>parseInt(a.f.n)-parseInt(b.f.n)), loose};
}
function paperHead(w, kind){
  return `<header class="rh"><div><div class="rk">Cosmos LED Management · ${kind}</div>
    <h2>${esc(w.name)}</h2>${woNo(w)?`<div class="wono">WO ${esc(woNo(w))}</div>`:''}</div>
    <div class="rmeta">${esc(w.loc)}<br>${woDates(w)}<br>${esc(w.resp)}${
      w.status==='active' ? ' · ACTIVE' : '<br>Closed '+fmtD(w.completed)}<br>Printed ${esc(nowBkk())}</div></header>`;
}
function ptbl(head, rows){
  return `<table class="rt"><thead><tr>${head.map(h=>
    `<th${/^n:/.test(h)?' class="n"':''}>${esc(h.replace(/^n:/,''))}</th>`).join('')}</tr></thead><tbody>${
    rows.length ? rows.map((r,i)=>`<tr><td class="idx">${i+1}.</td>${r.map((c,j)=>
      `<td${/^n:/.test(head[j+1])?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${head.length}" class="none">None</td></tr>`}</tbody></table>`;
}
function procRows(w){
  const pr = w.procs||{}, out = [];
  if(pr.vx2000pro) out.push(['Novastar VX2000 Pro', pr.vx2000pro]);
  if(pr.cvtm) out.push(['Novastar CVT-M', pr.cvtm]);
  return out;
}
/* processors are counted on older jobs and scanned on newer ones — report
   whichever we actually have, and say so rather than inventing a back count */
function procTable(w, ls, done){
  const pl = ls.filter(l=>{ const a = S.assets.get(l.asset_id); return a && a.kind === 'processor'; });
  if(pl.length){
    const g = {};
    pl.forEach(l=>{ const a = S.assets.get(l.asset_id);
      const nm = a.group_name || a.model || 'Processor';
      const r = g[nm] || (g[nm] = {out:0, back:0, sns:[]});
      r.out++; if(l.returned_at) r.back++; r.sns.push(a.sn); });
    const rows = Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0]));
    /* a work order has nothing to say about "back" yet — it is a packing
       list. The model is the column that matters; the serial is how you
       tick it off. */
    return {out: pl.length, back: pl.filter(l=>l.returned_at).length,
      html: done
        ? ptbl(['#','Item','n:Out','n:Back','Serials'], rows.map(([nm,r])=>
            [esc(nm), r.out, r.back, `<span class="mono">${esc(r.sns.join(', '))}</span>`]))
        : ptbl(['#','Item','n:Qty','Serials'], rows.map(([nm,r])=>
            [esc(nm), r.out, `<span class="mono">${esc(r.sns.join(', '))}</span>`]))};
  }
  const rows = procRows(w);
  return {out: rows.reduce((a,r)=>a+r[1],0), back: null,
    html: done
      ? ptbl(['#','Item','n:Out','Back'], rows.map(r=>
          [esc(r[0]), r[1], '<span class="none">counted, not scanned</span>']))
      : ptbl(['#','Item','n:Qty'], rows.map(r=>[esc(r[0]), r[1]]))};
}
function openReportHost(title, doc){
  const host = $('#report');
  host.innerHTML = `<div class="rbar"><b>${esc(title)}</b><span class="grow"></span>
    <button class="btn primary" id="rPrint" type="button">🖨 Print / Save as PDF</button>
    <button class="btn" id="rClose" type="button">Close</button></div>
    <div class="rscroll">${doc}</div>`;
  host.hidden = false; document.body.classList.add('rep-open');

/* ── 2 · Work Completion Report — what came home ── */
function woReport(id){
  const w = woBy(id); if(!w) return;
  const {groups, loose} = fcGroups(w), bars = barsOf(w);
  const byId = S.assets, snOf = aid => { const a = byId.get(aid); return a ? a.sn : ''; };
  const ls = S.lines.filter(l=>l.wo_id === w.id);
  const backSn = new Set(ls.filter(l=>l.returned_at).map(l=>snOf(l.asset_id)));
  const bl = (w.bulk||[]).slice().sort((a,b)=>bulkNameOf(a.item_code).localeCompare(bulkNameOf(b.item_code)));
  const head = paperHead(w, 'work completion report');
  const miss = r => Math.max(0,(r.qty_out||0)-(r.qty_returned||0)-(r.qty_damaged||0)-(r.qty_lost||0));

  /* the out / back pair each section carries in its own heading */
  const cabAll  = uniq(w.cabs||[]);
  const barAll  = bars.L.concat(bars.S);
  const barSeg  = segh('Hanging bars', barAll.length, barAll.filter(sn=>backSn.has(sn)).length);
  const blOut   = bl.reduce((a,r)=>a+(r.qty_out||0),0);
  const blBack  = bl.reduce((a,r)=>a+(r.qty_returned||0),0);
  const pt      = procTable(w, ls, true);

  /* everything that needs chasing, with the remark the crew typed */
  const att = [];
  ls.forEach(l=>{
    const sn = snOf(l.asset_id); if(!sn) return;
    if(!l.returned_at) att.push([sn,'Not scanned back','Still marked out — find it or mark it lost']);
    else if(l.return_status === 'repair') att.push([sn,'To repair', l.return_note||'Came back damaged']);
    else if(l.return_status === 'lost')   att.push([sn,'Lost', l.return_note||'Did not come back']);
  });
  bl.forEach(r=>{
    const nm = bulkNameOf(r.item_code);
    if(r.qty_damaged) att.push([`${nm} ×${r.qty_damaged}`,'Damaged', r.note||'']);
    if(r.qty_lost)    att.push([`${nm} ×${r.qty_lost}`,'Lost', r.note||'']);
    if(miss(r))       att.push([`${nm} ×${miss(r)}`,'Not back', r.note||'Not counted back in']);
  });

  const doc = `<div class="rdoc">${head}
    <h3 class="rs2">How it ended</h3>
    <table class="rt"><thead><tr><th class="n">Went out</th><th class="n">Came back</th><th class="n">To repair</th>
      <th class="n">Lost</th><th class="n">Not scanned back</th></tr></thead>
      <tbody><tr><td class="n">${w.lines||0}</td><td class="n">${w.back||0}</td><td class="n">${w.rep||0}</td>
      <td class="n">${w.lost||0}</td><td class="n">${Math.max(0,(w.lines||0)-(w.back||0))}</td></tr></tbody></table>
    ${att.length ? `<h3 class="rs2">Needs attention</h3>
      <div class="att">${att.map((a,i)=>`<div class="l"><span class="ai">${i+1}.</span><b>${esc(a[0])}</b>
        <span class="tag2">${esc(a[1])}</span><span>${esc(a[2])}</span></div>`).join('')}</div>`
      : `<div class="okline">✓ Everything on this job came back. Nothing to chase.</div>`}

    ${segh('Cabinets by flight case', cabAll.length, cabAll.filter(sn=>backSn.has(sn)).length)}
    ${ptbl(['#','Flight case','n:Out','n:Back','Serials'], groups.map(g=>
      [`FC ${esc(g.f.l)}`, g.sns.length, g.sns.filter(sn=>backSn.has(sn)).length,
       `<span class="mono">${esc(g.sns.join(', '))}</span>`]))}
    ${loose.length?`<p class="rp"><b>Not in a case:</b> <span class="mono">${esc(loose.join(', '))}</span></p>`:''}

    ${segh('Cables &amp; accessories', blOut, blBack)}
    ${ptbl(['#','Item','n:Out','n:Back','n:Damaged','n:Lost','Note'], bl.map(r=>
      [`${esc(bulkNameOf(r.item_code))} <span class="u">${esc(bulkUnitOf(r.item_code))}</span>`,
       r.qty_out, r.qty_returned||0, r.qty_damaged||0, r.qty_lost||0, esc(r.note||'')]))}

    ${barSeg}
    ${barBand('Hanging bar · DBmk2 100 cm', bars.L, head, barSeg)}
    ${barBand('Hanging bar · RS 50 cm', bars.S, head, barSeg)}

    ${segh('Processors', pt.out, pt.back)}
    ${pt.html}

    ${w.notes?`<h3 class="rs2">Note</h3><div class="rp">${esc(w.notes)}</div>`:''}
    <div class="rsign"><div>Checked in by</div><div>Approved by</div><div>Date</div></div>
    <footer class="rf">Cosmos LED Management · completion report ${esc(woNo(w)||w.name)} · ${esc(nowBkk())}</footer></div>`;
  openReportHost('Completion report' + (woNo(w)?' '+woNo(w):''), doc);
}

const WO_C=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];

const woM2=w=>w.cabs.reduce((s,sn)=>s+(D.cabs[sn]?M2[D.cabs[sn].s]:0),0);
function donut(segs,{size=132,th=16,center='',sub=''}={}){
  const r=(size-th)/2, C=2*Math.PI*r, tot=segs.reduce((a,s)=>a+s.v,0)||1; let off=0; const gap=segs.filter(s=>s.v>0).length>1?2:0;
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(segs.map(s=>s.l+' '+s.v).join(', '))}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${th}"/>
    ${segs.filter(s=>s.v>0).map(s=>{ const len=Math.max(0,s.v/tot*C-gap); const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" data-tip="${esc(s.l+': '+nf(s.v)+(s.u||''))}"/>`; off+=s.v/tot*C; return el; }).join('')}
    <text x="50%" y="${size/2+2}" text-anchor="middle" class="dc">${center}</text><text x="50%" y="${size/2+20}" text-anchor="middle" class="ds">${sub}</text></svg>`;
}

const nowBkk=()=>new Date().toLocaleString('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function reportData(){
  const cabs=Object.values(D.cabs), own=ownMap();
  const outC=cabs.filter(c=>c.st==='out'); const m2out=outC.reduce((a,c)=>a+M2[c.s],0), m2tot=cabs.reduce((a,c)=>a+M2[c.s],0);
  const cc=countSt(cabs.map(c=>c.st));
  const wsel=RPT.wo==='all'?D.wos:RPT.wo==='active'?D.wos.filter(w=>w.status==='active'):D.wos.filter(w=>w.id===RPT.wo);
  const activeW=wsel.filter(w=>w.status==='active'||RPT.wo===w.id);
  const woDetail=w=>{ const byFc={}; const loose=[]; w.cabs.forEach(sn=>{ const o=own.get(sn); if(o) (byFc[o.f.n]=byFc[o.f.n]||{f:o.f,sns:[]}).sns.push(sn); else loose.push(sn); });
    return {w, m2:woM2(w), fcs:Object.values(byFc).sort((a,b)=>parseInt(a.f.n)-parseInt(b.f.n)), loose}; };
  const repCabs=cabs.filter(c=>c.st==='repair'||c.st==='lost'||(c.cd&&c.cd!=='good')).map(c=>{ const o=own.get(c.sn); return {sn:c.sn,where:o?`FC ${o.f.l} · S${o.i+1}`:'unassigned',st:ST_L[c.st]||c.st,cd:CD_L[c.cd]||c.cd||'',note:c.note||''}; });
  const probParts=[]; cabs.forEach(c=>{ const o=own.get(c.sn); (c.mods||[]).forEach((m,i)=>{ const p=m&&D.parts[m]; if(p&&p.cd!=='good') probParts.push({sn:m,part:'M'+(i+1),cab:c.sn,where:o?`FC ${o.f.l}`:'',cd:CD_L[p.cd],note:p.note||''}); }); const p=c.pdu&&D.parts[c.pdu]; if(p&&p.cd!=='good') probParts.push({sn:c.pdu,part:'PDU',cab:c.sn,where:o?`FC ${o.f.l}`:'',cd:CD_L[p.cd],note:p.note||''}); });
  const spareRep=Object.values(D.spares).filter(s=>s.st==='repair'||s.st==='lost').map(s=>({sn:s.sn,kind:s.k==='P'?'PDU':'Module',st:ST_L[s.st],note:s.note||''}));
  const repFc=Object.entries(GS.fcsheet).filter(([n,v])=>v[2]>0).map(([n])=>parseInt(n,10));
  const rem=reminders().map(r=>({what:r.type==='slot'?`FC ${r.f.l} · S${r.i+1} empty`:`${r.c.sn} · ${r.type==='pdu'?'PDU':'M'+(r.i+1)} missing`,why:r.rec?`${r.rec.text} · ${hhmm(r.rec.t)}`:'Empty in the seed data'}));
  return {gen:nowBkk(),src:'Live from the MAH LED database',
    summary:[['LED wall out',`${nf(m2out)} m² of ${nf(m2tot)} m² (${Math.round(m2out/m2tot*100)}%)`],['Cabinets',`${nf(cabs.length)} · in stock ${nf(cc.in_stock)} · out ${nf(cc.out)} · repair ${nf(cc.repair)} · lost ${nf(cc.lost)}`],['Work orders',`${D.wos.filter(w=>w.status==='active').length} active · ${D.wos.filter(w=>w.status!=='active').length} completed`],['Needs attention',`${attention().length} items`],['Reminders',`${rem.length} empty slots / missing parts`]],
    active:activeW.map(woDetail), history:wsel.slice().sort((a,b)=>dt(woSpan(b)[0])-dt(woSpan(a)[0])),
    repCabs, probParts, spareRep, repFc, rem, checks:attention(), inv:invRows()};
}

  const table=(cols,rows)=>{ // cols: [{t,w,a}]

    head(); if(!rows.length){ need(6); txt('None',Lm+pad,y+2,{s:fs,c:mut}); y+=7; return; }
    rows.forEach((r,ri)=>{ doc.setFont('helvetica','normal'); doc.setFontSize(fs); const cells=r.map((v,i)=>doc.splitTextToSize(String(v==null?'':v),cols[i].w-pad*2)); const h=Math.max(...cells.map(c=>c.length))*3.4+2.4;

      if(ri%2) { doc.setFillColor(248,250,250); doc.rect(Lm,y-1.2,Wd,h,'F'); }
      let x=Lm; cells.forEach((c,i)=>{ c.forEach((l,li)=>txt(l,cols[i].a==='right'?x+cols[i].w-pad:x+pad,y+2.2+li*3.4,{s:fs,a:cols[i].a})); x+=cols[i].w; });
      doc.setDrawColor(...line); doc.setLineWidth(0.15); doc.line(Lm,y-1.2+h,Lm+Wd,y-1.2+h); y+=h; });

  txt('Stock & Work Order Report',Lm,y,{s:18,b:1}); y+=5; para(R.src,{c:mut,s:7.5}); doc.setDrawColor(...ink); doc.setLineWidth(0.4); doc.line(Lm,y,Lm+Wd,y); y+=3;
  if(S.summary){ h3('Summary'); table([{t:'Measure',w:45},{t:'Value',w:137}],R.summary); }
  if(S.active){ h3(RPT.wo==='all'||RPT.wo==='active'?'Active work orders — pick list':'Work order detail');
    if(!R.active.length) para('No active work orders.');
    R.active.forEach(x=>{ need(16); txt(x.w.name,Lm,y,{b:1,s:10.5}); y+=4.6; para(`${x.w.loc} · ${woDates(x.w)} · ${x.w.resp} · ${x.w.status==='active'?'Active':'Completed'}`,{c:mut});
      para(`${x.w.cabs.length} cabinets · ${nf(x.m2)} m² · ${x.fcs.length} flight cases · hanging bars ${x.w.items.length} · IL signal ${x.w.cables.il_signal||0} · IL power ${x.w.cables.il_power||0} · main power ${x.w.cables.main_power||0} · Cat6 ${x.w.cables.cat6||0} · VX2000 Pro ${x.w.procs.vx2000pro||0} · CVT-M ${x.w.procs.cvtm||0}`);
      table([{t:'Flight case',w:26},{t:'Cab',w:14,a:'right'},{t:'Cabinet serials',w:142}],x.fcs.map(g=>['FC '+g.f.l,g.sns.length+'/'+cap(g.f),g.sns.join(', ')]));
      if(x.w.items.length) para('Hanging bars: '+x.w.items.join(', ')); if(x.loose.length) para('Not in a case: '+x.loose.join(', ')); if(x.w.notes) para('Note: '+x.w.notes); y+=2; }); }
  if(S.history){ h3('Work orders'); table([{t:'Work order',w:44},{t:'Venue',w:36},{t:'Crew',w:30},{t:'Dates',w:28},{t:'Status',w:18},{t:'Cab',w:10,a:'right'},{t:'m²',w:9,a:'right'},{t:'Bars',w:7,a:'right'}],R.history.map(w=>[w.name,w.loc,w.resp,woDates(w),w.status==='active'?'Active':'Completed',w.cabs.length,nf(woM2(w)),w.items.length])); }
  if(S.repair){ h3('Repair & problem items'); para('Cabinets',{b:1});

  if(S.checks){ h3('Data checks'); table([{t:'Level',w:20},{t:'Finding',w:80},{t:'Detail',w:82}],R.checks.map(a=>[a.sev==='crit'?'Critical':a.sev==='warn'?'Warning':'Info',a.t,a.d])); }

/* Repair tracking. A ticket opens by itself the moment an item is set to
   repair (on the phone or here); this is where it is followed up. */
async function showRepairs(){
  const list=(D.repairs||[]).slice();
  if(!list.length){ toast('Nothing is in repair'); return; }
  const wait=list.filter(r=>r.stage==='waiting').length, atv=list.length-wait;
  const k=await dialog({title:`🛠 ${list.length} item${list.length===1?'':'s'} in repair`,
    text:`${wait} still here, ${atv} with a repairer. Longest wait first — pick one to move it along.`,
    opts:list.slice(0,60).map(r=>({v:String(r.id), plain:true,
      l:`${r.sn} · ${r.group_name||r.kind||''}`,
      d:`${r.stage==='at_vendor'?'at '+(r.vendor||'the vendor')+' for '+r.days_at_vendor+' day'+(r.days_at_vendor===1?'':'s'):'waiting to be sent'} · open ${r.days_open} day${r.days_open===1?'':'s'}${r.fault?' · '+r.fault:''}`})),
    cancel:'Close'});
  if(!k) return;
  const r=list.find(x=>String(x.id)===k); if(!r) return;
  const a=await dialog({title:r.sn, text:esc(r.fault||'')+(r.wo_name?` · last out on ${esc(r.wo_name)}`:''),
    opts:[ r.stage==='waiting'?{v:'send',l:'Sent to the repairer',d:'Starts the clock at the vendor'}:null,
           {v:'back',l:'Came back fixed',d:'Goes to In stock, condition repaired'},
           isAdmin()?{v:'scrap',l:'Beyond repair',d:'Retired — out of the usable stock',plain:true}:null,
           {v:'go',l:'Find the item',plain:true}].filter(Boolean)});
  if(!a) return;
  if(a==='send'){
    const f=await dialog({title:'Sent for repair · '+r.sn, fields:sendFields(r), ok:'Save'});
    if(!f) return;
    const s=sendRead(f); if(!s) return;
    if(await srv('repair_send',{p_sn:r.sn,p_vendor:s.vendor,p_note:s.note},'Repair')) toast(r.sn+' → '+s.vendor);
  } else if(a==='back'){
    if(await srv('repair_back',{p_sn:r.sn,p_outcome:'fixed',p_note:''},'Repair')) toast(r.sn+' is back in stock');
  } else if(a==='scrap'){
    if(await srv('repair_back',{p_sn:r.sn,p_outcome:'scrapped',p_note:''},'Repair')) toast(r.sn+' retired');
  } else if(a==='go'){ V.q=r.sn; const qi=$('#q'); if(qi) qi.value=r.sn; setPage('manage'); refresh(false); return; }
  await reload();
}
/* Fold a library column away when you are not using it. At least one stays
   open; the Library narrows as columns fold, and the 3D view takes the room. */
const LIBMIN_K=SK+'-libmin';
let LIBMIN=(()=>{ try{ return JSON.parse(localStorage.getItem(LIBMIN_K))||{}; }catch(e){ return {}; } })();
function applyLibMin(){
  const cols=[...document.querySelectorAll('.libcol')];
  const open=cols.filter(c=>!LIBMIN[c.dataset.col]).length;
  cols.forEach(c=>{
    const min=!!LIBMIN[c.dataset.col] && open>0;
    c.classList.toggle('min',min);
    const b=c.querySelector('.colhide'); if(b){ b.textContent='–'; b.title='Fold this column away'; }
  });
  const work=document.querySelector('main.work');
  if(work) work.style.setProperty('--libw',
    open>=3?'minmax(430px,1.15fr)':open===2?'minmax(320px,.8fr)':'minmax(210px,.45fr)');
  const t0=Date.now(), tick=()=>{ resize(); if(Date.now()-t0<300) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  try{ localStorage.setItem(LIBMIN_K,JSON.stringify(LIBMIN)); }catch(e){}
}
function toggleLibCol(col){
  const open=[...document.querySelectorAll('.libcol')].filter(c=>!LIBMIN[c.dataset.col]);
  if(!LIBMIN[col] && open.length<=1){ toast('Keep at least one column open'); return; }
  LIBMIN[col]=!LIBMIN[col]; applyLibMin();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.colhide');
  if(b){ e.stopPropagation(); toggleLibCol(b.dataset.hide); return; }
  const c=e.target.closest('.libcol.min');
  if(c) toggleLibCol(c.dataset.col);
});

$('#bFlags').onclick=showReminders;
$('#bUndo').hidden=true; $('#bLoad').hidden=true; $('#file').hidden=true;

/* boot: sign in, load the database, then draw */
function start(){
  V.fc=(D.fcs.find(f=>f.n==='009')||D.fcs[0]||{n:null}).n;
  document.body.dataset.page=V.page;
  refresh(true);
  setPage(V.page);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>build3D());
}
boot();
})();
